<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solar Rim - Absolut Fehlerfrei & Sichtbar</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #030100;
            font-family: sans-serif;
            user-select: none;
        }
        canvas {
            display: block;
            background: #000;
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
        }
        #audioBtn {
            position: absolute;
            bottom: 20px;
            left: 20px;
            z-index: 10;
            color: rgba(255, 255, 255, 0.6);
            font-size: 11px;
            letter-spacing: 1.5px;
            background: rgba(15, 5, 2, 0.7);
            padding: 10px 18px;
            border-radius: 30px;
            border: 1px solid rgba(255, 60, 0, 0.3);
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 0 15px rgba(230, 50, 0, 0.15);
        }
    </style>
</head>
<body>

<button id="audioBtn">SOUND AKTIVIEREN</button>
<canvas id="solarCanvas"></canvas>

<script>
const canvas = document.getElementById('solarCanvas');
const ctx = canvas.getContext('2d');
const audioBtn = document.getElementById('audioBtn');

// --- PURE 2D KOORDINATEN-PHYSIK (KEIN OFF-SCREEN KREIS MEHR!) ---
// Die Kante der Sonne wird starr als vertikale Linie auf der rechten Seite definiert.
// Das verhindert jegliche Skalierungsfehler auf verschiedenen Monitoren.
let sunEdgeX = 0;

function resize() {
    canvas.width = window.innerWidth || document.documentElement.clientWidth || 800;
    canvas.height = window.innerHeight || document.documentElement.clientHeight || 600;
    // Die sichtbare Kante der Sonne liegt immer genau 80 Pixel vor dem rechten Bildschirmrand
    sunEdgeX = canvas.width - 80;
}
resize();
window.addEventListener('resize', resize);
window.addEventListener('load', resize);

// --- NATIVE WEB AUDIO (CRASH-GESCHÜTZT) ---
let audioCtx = null;
let ambientGain = null;

function initAudio() {
    if (audioCtx) return;
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    audioBtn.style.display = 'none';

    const ambientOsc = audioCtx.createOscillator();
    const ambientFilter = audioCtx.createBiquadFilter();
    ambientGain = audioCtx.createGain();

    ambientOsc.type = 'sawtooth';
    ambientOsc.frequency.setValueAtTime(32, audioCtx.currentTime); 
    ambientFilter.type = 'lowpass';
    ambientFilter.frequency.setValueAtTime(45, audioCtx.currentTime); 
    ambientGain.gain.setValueAtTime(0.08, audioCtx.currentTime); 

    ambientOsc.connect(ambientFilter);
    ambientFilter.connect(ambientGain);
    ambientGain.connect(audioCtx.destination);
    ambientOsc.start();

    setInterval(() => {
        if (!audioCtx) return;
        const mod = 0.05 + Math.sin(Date.now() * 0.001) * 0.02;
        ambientGain.gain.linearRampToValueAtTime(mod, audioCtx.currentTime + 0.1);
    }, 100);
}

function playFlareSound(isMajor) {
    // CRASH FIX: Absolut sichere Rückkehr, wenn der AudioContext noch nicht initialisiert wurde!
    if (!audioCtx || audioCtx.state === 'suspended') return;

    try {
        const sampleRate = audioCtx.sampleRate || 44100;
        const bufferSize = sampleRate * (isMajor ? 4.0 : 1.5); 
        const buffer = audioCtx.createBuffer(1, bufferSize, sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
            data[i] = Math.random() * 2 - 1;
        }

        const noiseNode = audioCtx.createBufferSource();
        noiseNode.buffer = buffer;

        const filter = audioCtx.createBiquadFilter();
        filter.type = 'bandpass';
        const gainNode = audioCtx.createGain();

        if (isMajor) {
            filter.frequency.setValueAtTime(60, audioCtx.currentTime);
            filter.frequency.exponentialRampToValueAtTime(180, audioCtx.currentTime + 1.5);
            filter.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 4.0);
            filter.Q.setValueAtTime(3, audioCtx.currentTime);

            gainNode.gain.setValueAtTime(0.0, audioCtx.currentTime);
            gainNode.gain.linearRampToValueAtTime(0.20, audioCtx.currentTime + 0.4); 
            gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 4.0);

            const subOsc = audioCtx.createOscillator();
            const subGain = audioCtx.createGain();
            subOsc.frequency.setValueAtTime(40, audioCtx.currentTime);
            subOsc.frequency.linearRampToValueAtTime(22, audioCtx.currentTime + 2.0);
            subGain.gain.setValueAtTime(0.25, audioCtx.currentTime);
            subGain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 2.5);
            
            subOsc.connect(subGain);
            subGain.connect(audioCtx.destination);
            subOsc.start();
            subOsc.stop(audioCtx.currentTime + 2.5);
        } else {
            filter.frequency.setValueAtTime(110, audioCtx.currentTime);
            filter.frequency.linearRampToValueAtTime(75, audioCtx.currentTime + 1.2);
            filter.Q.setValueAtTime(1, audioCtx.currentTime);

            gainNode.gain.setValueAtTime(0.04, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 1.2);
        }

        noiseNode.connect(filter);
        filter.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        noiseNode.start();
    } catch (e) {
        console.log("Audio-Fehler abgefangen:", e);
    }
}

audioBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    initAudio();
});

// --- PARTIKEL SYSTEM VARIABLEN ---
const standardParticles = []; 
const flareParticles = [];  
const maxStandard = 200;       

let globalEruptionTimer = 0;
const globalEruptionInterval = 960; 
let isGlobalErupting = false;
let globalEruptionProgress = 0;
let globalEruptionTargetY = 0;

class SolarParticle {
    constructor(type) {
        this.type = type; 
        this.reset();
        if(type === 'standard') this.age = Math.random() * this.maxAge;
    }

    reset() {
        this.age = 0;
        this.swirlSeed = Math.random() * 100;
        
        // Jedes Partikel startet auf der vertikalen Sonnenkante an einer zufälligen Y-Koordinate
        this.startY = Math.random() * canvas.height;
        this.x = sunEdgeX;
        this.y = this.startY;

        if (this.type === 'global') {
            this.startY = globalEruptionTargetY + (Math.random() - 0.5) * 60;
            this.maxAge = 120 + Math.random() * 60;
            this.speedX = -(3 + Math.random() * 4); // Schießt rasant gerade nach links ins All
            this.speedY = (Math.random() - 0.5) * 1.5;
            this.gravityPull = 0.05; // Fast keine Schwerkraft-Biegung
            this.size = 6 + Math.random() * 12;        
            this.hue = 0 + Math.random() * 15;          
        } 
        else if (this.type === 'local') {
            this.maxAge = 50 + Math.random() * 40;
            this.speedX = -(2 + Math.random() * 3); // Startgeschwindigkeit nach links
            // Starker parabolischer Bogenwurf (Aufstieg und Fall auf der Y-Achse simulieren)
            this.speedY = (Math.random() > 0.5 ? 1 : -1) * (2 + Math.random() * 4); 
            this.gravityPull = 0.25; // Hohe Gravitation zieht die Partikel im Bogen zurück
            this.size = 2 + Math.random() * 5;
            this.hue = 15 + Math.random() * 20;
        } 
        else {
            // Standard Micro-Brodeln direkt am Rand
            this.maxAge = 25 + Math.random() * 35;
            this.speedX = -(0.5 + Math.random() * 1.5);
            this.speedY = (Math.random() - 0.5) * 2;
            this.gravityPull = 0.1;
            this.size = 1.5 + Math.random() * 4;
            this.hue = 12 + Math.random() * 20;         
        }
    }

    update(tick) {
        this.age++;
        const progress = this.age / this.maxAge; 

        if (this.type === 'local') {
            // MATHEMATISCHER BOGEN: X wandert stetig nach links, Y verhält sich wie ein Wurf
            // Ein Sinusbogen zwingt das Partikel, zur Kante zurückzukehren
            this.x = sunEdgeX + (Math.sin(progress * Math.PI * 0.95) * -80); 
            this.y = this.startY + (this.speedY * this.age) - (Math.pow(this.age, 2) * this.gravityPull * this.speedY * 0.02);
        } else if (this.type === 'global') {
            this.x += this.speedX;
            this.y += this.speedY + Math.sin(tick * 0.08 + this.swirlSeed) * 0.5;
        } else {
            this.x += this.speedX;
            this.y += this.speedY;
            // Zwinge Mikro-Partikel am Lebensende zurück an den Rand zu faden
            if(progress > 0.7) this.x += (sunEdgeX - this.x) * 0.2;
        }

        if (this.age >= this.maxAge) {
            if (this.type === 'global' || this.type === 'local') return false; 
            this.reset(); 
        }
        return true;
    }

    draw() {
        const progress = this.age / this.maxAge;
        const alpha = Math.sin(progress * Math.PI);

        ctx.save();
        ctx.globalCompositeOperation = 'screen';
        
        const grad = ctx.createRadialGradient(this.x, this.y, 0, this.x, this.y, this.size);
        grad.addColorStop(0, this.type === 'global' ? `hsla(${this.hue + 35}, 100%, 94%, ${alpha})` : `hsla(${this.hue + 22}, 100%, 75%, ${alpha})`);
        grad.addColorStop(0.3, `hsla(${this.hue}, 100%, 55%, ${alpha * 0.8})`);
        grad.addColorStop(1, `hsla(0, 100%, 30%, 0)`);

        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
    }
}

// Pool befüllen
for (let i = 0; i < maxStandard; i++) {
