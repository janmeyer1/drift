<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vertikaler Sonnenrand & Flare-Eruptionen (Dokumentierte Version)</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #030100;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        canvas {
            display: block;
            background: #000;
        }
    </style>
</head>
<body>

<canvas id="solarCanvas"></canvas>

<script>
const canvas = document.getElementById('solarCanvas');
const ctx = canvas.getContext('2d');

// --- ARCHITEKTUR & POSITIONIERUNG ---
// Um rechenintensive Pixel-Loops (wie getImageData aus dem 25scripts-Tutorial) zu vermeiden,
// verschieben wir das Zentrum der Sonne komplett nach rechts außerhalb des sichtbaren Bereichs.
// Dadurch rendern wir nur ein kleines Kreis-Segment (Bogen) am rechten Bildschirmrand.
let centerX, centerY, sunRadius;

function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    
    // Dynamischer Radius basierend auf der kleineren Bildschirmdimension.
    // Das verhindert, dass der Bogen bei extremen Monitor-Seitenverhältnissen verzerrt.
    const referenceSize = Math.min(canvas.width, canvas.height);
    sunRadius = referenceSize * 1.5; 
    
    // FIX: Exakter mathematischer Offset. Die Sonne liegt rechts im "Off", 
    // so dass nur ein ca. 80px dicker Rand (Rim) ins Bild ragt.
    centerX = canvas.width + sunRadius - 80; 
    centerY = canvas.height / 2;
}
resize();
window.addEventListener('resize', resize);

// --- PARTIKEL-POOLS ---
const standardParticles = []; // Kontinuierliches Hintergrund-Brodeln am Rand
const majorArchParticles = [];  // Temporäre Partikel für die riesigen Plasma-Arme
const maxStandard = 250;       // Dichte-Limit für die Standard-Flares

// --- ERUPTIONS-ZUSTANDSMASCHINE (STATE MACHINE) ---
// Steuert die zyklischen, massiven Eruptionen (Coronal Mass Ejections).
let eruptionTimer = 0;
const eruptionInterval = 240; // Intervall zwischen Ausbrüchen (~4 Sekunden bei 60 FPS)
let isErupting = false;       // Aktueller Status der Eruption
let eruptionProgress = 0;     // Normalisierter Verlauf (0.0 bis 1.0) der aktiven Eruptionsphase
let eruptionAngle = Math.PI;  // Auswurfwinkel. Math.PI bedeutet exakt nach links in den Weltraum

// --- PARTIKEL-KLASSE (FLARES & PLASMA-WIRBEL) ---
class SolarParticle {
    constructor(isMajor = false) {
        this.isMajor = isMajor; // Flag unterscheidet zwischen Mikro-Loops und Riesen-Armen
        this.reset();
        // Standard-Partikel zeitlich versetzt starten, damit sie nicht alle synchron spawnen
        if(!isMajor) this.age = Math.random() * this.maxAge;
    }

    reset() {
        this.age = 0;
        
        if (this.isMajor) {
            // --- LOGIK FÜR DIE RIESIGEN ERUPTIONS-ARME ---
            // Eingegrenzter Winkel rund um das Epizentrum der aktuellen Eruption
            this.baseAngle = eruptionAngle + (Math.random() - 0.5) * 0.18;
            this.maxAge = 100 + Math.random() * 60;
            this.maxHeight = 280 + Math.random() * 220; // Enorme Reichweite weit in den Raum hinein
            this.loopDirection = (Math.random() - 0.5) * 0.04; // Geringere seitliche Drift, Fokus liegt auf Vorwärtsvektor
            this.size = 5 + Math.random() * 15;        // Mächtigere Plasma-Knoten
            this.hue = 0 + Math.random() * 18;          // Tiefes Rot bis gleißendes Orange
        } else {
            // --- LOGIK FÜR STANDARD-HINTERGRUND-WIRBEL ---
            // Gleichmäßige Verteilung entlang des sichtbaren linken Bogens der rechten Sonne
            this.baseAngle = Math.PI + (Math.random() - 0.5) * 0.7; 
            this.maxAge = 40 + Math.random() * 60;
            this.maxHeight = 25 + Math.random() * 65;   // Kleine, solare Bögen
            this.loopDirection = Math.random() > 0.5 ? 1 : -1; // Bestimmt, ob der Wirbel links- oder rechtsherum eindreht
            this.size = 2 + Math.random() * 7;
            this.hue = 10 + Math.random() * 22;         // Klassische Solar-Hues
        }
        
        this.angle = this.baseAngle;
        this.radius = sunRadius;
        this.swirlSeed = Math.random() * 100; // Einzigartiger mathematischer Seed für individuelles Rauschen (Turbulenz)
    }

    update(tick) {
        this.age++;
        const progress = this.age / this.maxAge; // Normalisierter Lebenszyklus (0.0 bis 1.0)

        if (this.isMajor) {
            // MATHE: Progress-Multiplikator * 0.85 sorgt dafür, dass die Partikel am Lebensende 
            // nicht ganz zur Oberfläche zurückkehren, sondern im All "verglühen"/auflösen.
            const reach = Math.sin(progress * Math.PI * 0.85) * this.maxHeight; 
            this.radius = sunRadius + reach;
            // Hochfrequentes Plasma-Zittern via Math.sin addiert
            this.angle = this.baseAngle + (progress * this.loopDirection) + Math.sin(tick * 0.08 + this.swirlSeed) * 0.015;
        } else {
            // MATHE: Reiner Math.sin von 0 bis PI erzeugt eine perfekte Parabel. 
            // Das Partikel steigt auf und wird von den Magnetfeldlinien exakt zurück auf die Oberfläche gezwungen (Loop).
            const archHeight = Math.sin(progress * Math.PI) * this.maxHeight;
            this.radius = sunRadius + archHeight;
            this.angle = this.baseAngle + (progress * 0.04 * this.loopDirection) + Math.cos(tick * 0.08 + this.swirlSeed) * 0.006;
        }

        // Lebenszeit-Prüfung
        if (this.age >= this.maxAge) {
            if (this.isMajor) return false; // Major-Partikel löschen sich nach dem Verglühen aus dem Array
            this.reset(); // Standard-Partikel werden recycelt
        }
        return true;
    }

    draw() {
        const progress = this.age / this.maxAge;
        // Alpha-Blending: Ein- und Ausfaden basierend auf dem Lebensalter
        const alpha = this.isMajor ? (1 - progress) * Math.sin(progress * Math.PI) : Math.sin(progress * Math.PI);

        // Umrechnung von Polarkoordinaten (Winkel & Radius vom Sonnenzentrum) in 2D-Canvas-Koordinaten
        const x = centerX + Math.cos(this.angle) * this.radius;
        const y = centerY + Math.sin(this.angle) * this.radius;

        // Optimierung: Partikel außerhalb des linken Bildschirmrands ignorieren
        if (x < -100) return;

        ctx.save();
        // 'screen' sorgt für additive Farbmischung. Überlagernde Flares addieren ihre Helligkeit 
        // und erzeugen so automatisch überhitzte, weiße Energiekerne.
        ctx.globalCompositeOperation = 'screen';
        
        const grad = ctx.createRadialGradient(x, y, 0, x, y, this.size);
        // Eruptions-Partikel erhalten im Zentrum einen deutlich heißeren, weißeren Kern
        grad.addColorStop(0, this.isMajor ? `hsla(${this.hue + 35}, 100%, 92%, ${alpha})` : `hsla(${this.hue + 25}, 100%, 75%, ${alpha})`);
        grad.addColorStop(0.3, `hsla(${this.hue}, 100%, 55%, ${alpha * 0.8})`);
        grad.addColorStop(1, `hsla(0, 100%, 30%, 0)`);

        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(x, y, this.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
    }
}

// Initialisierung des Standard-Partikel-Pools
for (let i = 0; i < maxStandard; i++) {
    standardParticles.push(new SolarParticle(false));
}

// --- RENDERING VON OBERFLÄCHE & CHROMOSPHÄRE ---
function drawSunSurfaceAndRim(tick) {
    ctx.save();

    // 1. KORONA (Hintergrund-Atmosphäre, die weit in das Weltall strahlt)
    const corona = ctx.createRadialGradient(centerX, centerY, sunRadius - 40, centerX, centerY, sunRadius + 400);
    corona.addColorStop(0, 'rgba(255, 45, 0, 0.4)');
    corona.addColorStop(0.25, 'rgba(180, 15, 0, 0.18)');
    corona.addColorStop(0.7, 'rgba(60, 2, 0, 0.03)');
    corona.addColorStop(1, 'rgba(0, 0, 0, 0)');
    ctx.fillStyle = corona;
    ctx.beginPath();
    ctx.arc(centerX, centerY, sunRadius + 400, 0, Math.PI * 2);
    ctx.fill();

    // 2. JETZT INTEGRATION: HOCH-KONTRAST-KONVEKTIONSZELLEN (BRODELNDER RAND)
    // Wir simulieren die "Granulation" der Sonnenoberfläche kosteneffizient über sich bewegende geometrische Vektorkreise
    // anstatt rechenintensiver Perlin-Noise-Pixelmanipulation.
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = '#1c0200'; // Dunkle, kältere Plasma-Basis der inneren Sonne
    ctx.beginPath();
    ctx.arc(centerX, centerY, sunRadius, 0, Math.PI * 2);
    ctx.fill();

    const numCells = 28; // Anzahl der simulierten thermischen Zellen entlang des sichtbaren Rands
    const startAngle = Math.PI - 0.5;
    const endAngle = Math.PI + 0.5;

    for (let i = 0; i < numCells; i++) {
        const anglePercent = i / numCells;
        const currentAngle = startAngle + (endAngle - startAngle) * anglePercent;
        
        // Wellen-Frequenzen für das Auf- und Absteigen des kochenden Plasmas
        const cellWave = Math.sin(tick * 0.07 + i * 1.5) * 5;
        const cellShiftX = Math.cos(tick * 0.03 + i) * 5;
        
        // DYNAMIK: Modifikator verstärkt das Brodeln und erhöht den Kontrast massiv,
        // wenn eine Eruption bevorsteht oder aktiv läuft.
        let intensityModifier = 1;
        if (isErupting) {
            // Wildes, hochfrequentes Schütteln während des Ausbruchs
            intensityModifier = 1.2 + Math.sin(tick * 0.35 + i) * 0.9 * (1 - eruptionProgress);
        } else if (eruptionTimer > eruptionInterval * 0.75) {
            // VORAHNUNGSPHASE (Premonition Stage): Die Zellen fangen kurz vor dem Ausbruch an,
            // sich massiv aufzuheizen und heftiger zu fluktuieren.
            const premonitionScale = (eruptionTimer - eruptionInterval * 0.75) / (eruptionInterval * 0.25);
            intensityModifier = 1 + Math.sin(tick * 0.18 + i) * 0.5 * premonitionScale;
        }
