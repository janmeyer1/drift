<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solar Surface & Flares Animation</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #050100;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        canvas {
            background: #000;
        }
    </style>
</head>
<body>

<canvas id="sunCanvas"></canvas>

<script>
const canvas = document.getElementById('sunCanvas');
const ctx = canvas.getContext('2d');

// Set canvas sizing
const size = 600;
canvas.width = size;
canvas.height = size;

const centerX = size / 2;
const centerY = size / 2;
const sunRadius = 140;

// Configuration
const particles = [];
const maxParticles = 150;

// Particle class for Solar Flares
class FlareParticle {
    constructor() {
        this.reset();
        // Stagger initial lifecycle so they don't all burst at once
        this.age = Math.random() * this.maxAge; 
    }

    reset() {
        // Start on the sun's boundary
        this.angle = Math.random() * Math.PI * 2;
        this.speed = 1 + Math.random() * 3;
        this.radius = sunRadius;
        
        // Dynamic vectors for curved, organic paths
        this.vx = Math.cos(this.angle) * this.speed;
        this.vy = Math.sin(this.angle) * this.speed;
        
        // Visual traits
        this.size = 4 + Math.random() * 12;
        this.age = 0;
        this.maxAge = 40 + Math.random() * 50;
        
        // Color shifting from white/yellow to deep red
        this.hue = 15 + Math.random() * 25; // 15-40 (Orange/Red-Orange)
    }

    update() {
        // Move outward
        this.radius += this.speed;
        
        // Add solar wind/magnetic curving effect
        this.angle += (Math.random() - 0.5) * 0.05;
        this.vx = Math.cos(this.angle) * this.speed;
        this.vy = Math.sin(this.angle) * this.speed;

        // Advance lifecycle
        this.age++;
        if (this.age >= this.maxAge) {
            this.reset();
        }
    }

    draw() {
        const alpha = 1 - (this.age / this.maxAge);
        const currentX = centerX + Math.cos(this.angle) * this.radius;
        const currentY = centerY + Math.sin(this.angle) * this.radius;

        ctx.save();
        ctx.globalCompositeOperation = 'screen'; // Creates intense glow overlay
        ctx.beginPath();
        
        // Radial gradient per particle for soft edges
        const grad = ctx.createRadialGradient(currentX, currentY, 0, currentX, currentY, this.size);
        grad.addColorStop(0, `hsla(${this.hue + 20}, 100%, 70%, ${alpha})`); // Brighter core
        grad.addColorStop(0.4, `hsla(${this.hue}, 100%, 50%, ${alpha * 0.8})`);
        grad.addColorStop(1, `hsla(0, 100%, 40%, 0)`);

        ctx.fillStyle = grad;
        ctx.arc(currentX, currentY, this.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
    }
}

// Initialize flare particles
for (let i = 0; i < maxParticles; i++) {
    particles.push(new FlareParticle());
}

// Function to draw animated surface activity/corona
function drawSunSurface(tick) {
    ctx.save();
    
    // 1. Base Corona Glow (Large background soft gradient)
    const coronaGrad = ctx.createRadialGradient(centerX, centerY, sunRadius * 0.8, centerX, centerY, size / 2);
    coronaGrad.addColorStop(0, 'rgba(255, 120, 0, 0.4)');
    coronaGrad.addColorStop(0.3, 'rgba(200, 40, 0, 0.15)');
    coronaGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');
    ctx.fillStyle = coronaGrad;
    ctx.fillRect(0, 0, size, size);

    // 2. Animated Surface Noise (Simulated using overlapping shifting gradients)
    ctx.globalCompositeOperation = 'source-over';
    
    // Wave calculations to fluctuate the base scale
    const pulse = Math.sin(tick * 0.02) * 4;
    
    const surfaceGrad = ctx.createRadialGradient(
        centerX + Math.cos(tick * 0.03) * 5, // Shifting center simulates boiling
        centerY + Math.sin(tick * 0.02) * 5, 
        0, 
        centerX, 
        centerY, 
        sunRadius + pulse
    );
    surfaceGrad.addColorStop(0, '#fffdf0'); // Incandescent core
    surfaceGrad.addColorStop(0.2, '#ffea4a');
    surfaceGrad.addColorStop(0.5, '#ff7700');
    surfaceGrad.addColorStop(0.8, '#d61a00');
    surfaceGrad.addColorStop(1, '#5c0000');

    ctx.beginPath();
    ctx.arc(centerX, centerY, sunRadius, 0, Math.PI * 2);
    ctx.fillStyle = surfaceGrad;
    ctx.fill();

    ctx.restore();
}

// Core Animation Loop
let tick = 0;
function animate() {
    // Clear canvas with slight opacity trail to smooth out flares
    ctx.fillStyle = 'rgba(5, 1, 0, 0.3)';
    ctx.fillRect(0, 0, size, size);

    tick++;

    // Update and draw flares behind the main surface edge mask
    particles.forEach(p => {
        p.update();
        p.draw();
    });

    // Draw the sun body over the base of the flares
    drawSunSurface(tick);

    requestAnimationFrame(animate);
}

// Start loop
animate();
</script>

</body>
</html>
