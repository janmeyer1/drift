<!doctype html>
<html lang="en">

<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;background:#0a3e5e;overflow:hidden;font-family:'Fredoka',system-ui,sans-serif}
#wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
canvas{width:min(100vw,160vh);height:min(62.5vw,100vh);display:block}
#ui{position:fixed;right:12px;bottom:12px;display:flex;gap:8px}
button{border:0;border-radius:12px;padding:8px 14px;font:600 14px 'Fredoka',system-ui;background:rgba(255,246,227,.9);color:#3b2a1a;cursor:pointer}

#omen{position:fixed;left:50%;top:10px;transform:translateX(-50%);z-index:3;text-align:center;max-width:46vw}
#omen b{color:#ff9d7a}
#panel{position:fixed;right:12px;top:10px;width:min(300px,34vw);max-height:calc(100vh - 80px);overflow:auto;background:rgba(255,246,227,.94);color:#3b2a1a;border-radius:14px;padding:10px 14px;display:none;z-index:3;font-size:14px;box-shadow:0 4px 18px rgba(0,0,0,.3)}

<body>
<div id="wrap"><canvas id="cv"></canvas></div>
<div id="hud"><div class="pill" id="hGoal"></div><div class="pill">🌊 <b id="hG"></b> · Tide <b id="hT"></b></div><div class="pill">Wandel <b id="hW"></b>/20 · <span id="hS"></span><div class="bar2"><i id="hWb"></i></div></div><div class="pill" id="hR"></div></div>
<div class="pill" id="omen"></div><div id="panel"></div>
<div id="ui"><button id="bTiles">Tile borders: on</button><button id="bInv">Inventory · 1 🌊</button><button id="bSkip">Skip</button><button id="bEnd">End ebb</button></div>
<div id="toast"></div><div id="bubble"></div><div id="banner"></div>
<div id="card"><div class="cardbox"><h2 id="cardT"></h2><div id="cardB"></div><button id="cardBtn">OK</button></div></div>
<div id="info"><span></span><button id="bStory">Story ↺</button></div>
<div id="loading"><div>Charting the island…</div><div class="bar"><i id="lbar"></i></div></div>
<script>
'use strict';
// =====================================================================
// Island world map — baked terrain layer + live animation layer.
// Terrain is computed once (fine 2px grid), cached as an image; only
// waves, surf, smoke, birds, bats and glows are redrawn every frame.
// Positions are fractions of the grid (0..1), so detail can change freely.
// =====================================================================
const CW = 1600, CH = 1000, GW = 800, GH = 600, S = CW / GW, SC = 400 / GW;   // SC: noise scale vs. the old 400-wide grid
const TILT = .74, ELEV = 210, SEED = 7;
const K = Math.min(2, window.devicePixelRatio || 1);
const VX = .5, VY = .43;
const LM = {
  bay: [.47, .765], spring: [.505, .655], palms: [.45, .68], breadfruit: [.565, .675], crabs: [.565, .785], flotsam: [.405, .775],
  cave: [.372, .488], birds: [.19, .30], lagoon: [.80, .52], riptide: [.47, .90]
};
const ESCARP = [[.435, .50], [.375, .80]];
const THICKET = [[.585, .12], [.635, .82]];
const REGIONS = {
  1: { name: 'Castaway Cove', col: '255,236,170' }, 2: { name: 'Booby Cliffs', col: '255,255,255' },
  3: { name: 'Fire Mountain', col: '255,170,120' }, 4: { name: 'Lagoon & Reef', col: '150,240,230' }
};
const cv = document.getElementById('cv');
cv.width = CW * K; cv.height = CH * K;
const mainCtx = cv.getContext('2d');
let ctx = mainCtx;                                      // drawing helpers draw into whatever layer ctx points to
function layer() { const c = document.createElement('canvas'); c.width = CW * K; c.height = CH * K; const x = c.getContext('2d'); x.setTransform(K, 0, 0, K, 0, 0); return { c, x }; }
let showLabels = true, showTiles = true;

// ---------- noise ----------
function mulberry(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
let rnd, perm;
function initNoise() { rnd = mulberry(SEED * 9973 + 1); perm = new Float32Array(256 * 256); for (let i = 0; i < perm.length; i++) perm[i] = rnd(); }
function vnoise(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
  const g = (a, b) => perm[((a & 255) * 256) + (b & 255)];
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  return (g(xi, yi) * (1 - u) + g(xi + 1, yi) * u) * (1 - v) + (g(xi, yi + 1) * (1 - u) + g(xi + 1, yi + 1) * u) * v;
}
function fbm(x, y, o) { let s = 0, a = .5, f = 1, n = 0; for (let i = 0; i < (o || 5); i++) { s += a * vnoise(x * f, y * f); n += a; a *= .5; f *= 2.03; } return s / n; }
function ridged(x, y, o) { let s = 0, a = .5, f = 1, n = 0; for (let i = 0; i < (o || 4); i++) { const r = 1 - Math.abs(vnoise(x * f, y * f) * 2 - 1); s += a * r * r; n += a; a *= .5; f *= 2.1; } return s / n; }
// cellular noise: distance to nearest and second-nearest feature point → plates and cracks
function worley(x, y) {
  const xi = Math.floor(x), yi = Math.floor(y); let f1 = 9, f2 = 9;
  for (let dy = -1; dy <= 1; dy++) for (let dx = -1; dx <= 1; dx++) {
    const cx = xi + dx, cy = yi + dy;
    const px = cx + perm[((cx & 255) * 256) + (cy & 255)], py = cy + perm[(((cx + 37) & 255) * 256) + ((cy + 91) & 255)];
    const d = Math.hypot(px - x, py - y);
    if (d < f1) { f2 = f1; f1 = d; } else if (d < f2) f2 = d;
  }
  return [f1, f2];
}
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, v) => { const t = clamp((v - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
function mix(c1, c2, t) { return [lerp(c1[0], c2[0], t), lerp(c1[1], c2[1], t), lerp(c1[2], c2[2], t)]; }
function hex(h) { return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)]; }
function segDist(px, py, a, b) {
  const dx = b[0] - a[0], dy = b[1] - a[1], L = dx * dx + dy * dy;
  const t = clamp(((px - a[0]) * dx + (py - a[1]) * dy) / L, 0, 1);
  const qx = a[0] + t * dx, qy = a[1] + t * dy;
  return { d: Math.hypot(px - qx, py - qy), side: Math.sign(dx * (py - a[1]) - dy * (px - a[0])), t };
}

// ---------- terrain ----------
let H, moist, feat, region, seeds, lavaAmt, tangleAmt, plat, caveAmt, cellReg;
const F_LAVAFIELD = 1, F_THICKET = 2, F_STREAM = 4, F_GUANO = 8, F_LAVA = 16, F_RIM = 32, F_ESC = 64, F_CAVERIM = 128;
function volR(nx, ny) { return Math.hypot((nx - VX) / .13, (ny - VY) / .115); }
function volRW(nx, ny) { return volR(nx, ny) + (fbm(nx * 7 + 13, ny * 7 + 2, 3) - .5) * .7; }
function escSigned(nx, ny) {
  const wx = nx - Math.sin(ny * 21 + 1) * .01 - (fbm(ny * 8, 9, 3) - .5) * .03;
  const a = ESCARP[0], b = ESCARP[1], dx = b[0] - a[0], dy = b[1] - a[1], L = Math.hypot(dx, dy);
  return (dx * (ny - a[1]) - dy * (wx - a[0])) / L;
}
function plateauMask(nx, ny) { return smooth(-.004, .007, escSigned(nx, ny)) * smooth(1.45, 1.75, volRW(nx, ny)); }
function thicketSigned(nx, ny) {
  const wx = nx - Math.sin(ny * 26) * .012 - (fbm(ny * 9, 5, 3) - .5) * .03;
  const a = THICKET[0], b = THICKET[1], dx = b[0] - a[0], dy = b[1] - a[1], L = Math.hypot(dx, dy);
  return -(dx * (ny - a[1]) - dy * (wx - a[0])) / L;
}
function buildTerrain() {
  const N = GW * GH;
  H = new Float32Array(N); moist = new Float32Array(N); feat = new Uint8Array(N);
  lavaAmt = new Float32Array(N); tangleAmt = new Float32Array(N); plat = new Float32Array(N); caveAmt = new Float32Array(N);
  for (let y = 0; y < GH; y++) for (let x = 0; x < GW; x++) {
    const nx = x / GW, ny = y / GH, i = y * GW + x;
    const wx = (fbm(nx * 3 + 11, ny * 3 + 3, 4) - .5) * .22, wy = (fbm(nx * 3 + 41, ny * 3 + 17, 4) - .5) * .22;
    const dx = (nx - .5 + wx) / .40, dy = (ny - .48 + wy) / .36;
    const d = Math.sqrt(dx * dx + dy * dy);
    let h = (1 - Math.pow(d, 1.9)) * .30 + (fbm(nx * 6, ny * 6, 5) - .5) * .24;
    // volcano: cone, rim, crater, radial erosion gullies with sharp ribs
    const vr = volR(nx, ny), ang = Math.atan2(ny - VY, nx - VX);
    h += Math.exp(-vr * 2.0) * 1.15;
    const rimNoise = .85 + .3 * fbm(Math.cos(ang) * 2 + 50, Math.sin(ang) * 2 + 50, 2);
    h += Math.exp(-Math.pow((vr - .12) / .04, 2)) * .10 * rimNoise;
    h -= Math.exp(-Math.pow(vr / .10, 2)) * .42;
    if (Math.abs(vr - .12) < .03) feat[i] |= F_RIM;
    const gully = Math.abs(Math.sin(ang * 13 + fbm(nx * 5, ny * 5, 3) * 5));
    h += (Math.pow(gully, .6) - .62) * .075 * smooth(.12, .3, vr) * smooth(1.7, .8, vr);
    h += (ridged(nx * 22, ny * 22, 3) - .45) * .05 * smooth(.2, .5, vr) * smooth(1.6, 1.0, vr);
    // the start bay
    const br = Math.hypot((nx - LM.bay[0]) / .055, (ny - LM.bay[1]) / .04);
    h -= Math.exp(-br * br) * .14;
    // lagoon
    const lr = Math.hypot((nx - LM.lagoon[0]) / .08, (ny - LM.lagoon[1]) / .10);
    h -= Math.exp(-lr * lr) * .22;
    // Booby Cliffs plateau, with rough rocky edges
    const pm = plateauMask(nx, ny); plat[i] = pm;
    if (h > -.03) {
      h += pm * .12 + pm * (1 - pm) * 4 * (ridged(nx * 40, ny * 40, 3) - .5) * .05;
      if (pm > .12 && pm < .88 && h > .02) feat[i] |= F_ESC;
    }
    // bird rocks
    const bc = Math.hypot((nx - LM.birds[0]) / .07, (ny - LM.birds[1]) / .05);
    if (bc < 1.4) { h += Math.exp(-bc * bc) * .16 + (ridged(nx * 50, ny * 50, 3) - .5) * .04 * Math.exp(-bc * bc); if (h > .05 && bc < 1.1) feat[i] |= F_GUANO; }
    // bat cave: an outcrop on the mountain's south-west flank with a dark mouth under it
    const cr = Math.hypot((nx - LM.cave[0]) / .014, (ny - LM.cave[1]) / .010);
    const crTop = Math.hypot((nx - LM.cave[0]) / .022, (ny - (LM.cave[1] - .012)) / .013);
    h += Math.exp(-crTop * crTop) * .06;
    if (cr < 1) caveAmt[i] = smooth(1, .25, cr);
    else if (crTop < 1.5) feat[i] |= F_CAVERIM;
    // old lava field
    {
      const vrw = volRW(nx, ny);
      const band = smooth(.95, 1.2, vrw) * smooth(1.85, 1.45, vrw);
      const south = smooth(.25, .6, Math.sin(ang)) * smooth(.75, .45, Math.abs(Math.cos(ang)));
      const amt = band * south * (.55 + .9 * fbm(nx * 10 + 3, ny * 10, 3)) - .45;
      if (amt > 0 && h > .06) { lavaAmt[i] = clamp(amt * 2.2, 0, 1); if (lavaAmt[i] > .3) feat[i] |= F_LAVAFIELD; h += lavaAmt[i] * (ridged(nx * 60, ny * 60, 2) - .5) * .015; }
    }
    // fresh lava flow
    const lf = segDist(nx, ny, [VX + .04, VY - .035], [VX + .14, VY - .16]);
    if (lf.d < .006 + .004 * fbm(nx * 30, ny * 30, 2) && h > .02) feat[i] |= F_LAVA;
    // the tangle
    const th = segDist(nx - Math.sin(ny * 26) * .012 - (fbm(ny * 9, 5, 3) - .5) * .03, ny, THICKET[0], THICKET[1]);
    {
      const amt = (1 - th.d / (.03 + .02 * fbm(nx * 14 + 8, ny * 14, 3))) * smooth(0, .03, th.t) * smooth(1, .97, th.t) * smooth(.9, 1.3, vr);
      if (amt > 0 && h > .03) { tangleAmt[i] = clamp(amt * 1.6, 0, 1); if (tangleAmt[i] > .35) feat[i] |= F_THICKET; }
    }
    // stream
    const wig = (fbm(ny * 25, 3, 2) - .5) * .012;
    const st2 = segDist(nx - wig, ny, LM.spring, [LM.bay[0] + .01, LM.bay[1] - .03]);
    if ((st2.d < .0035 || Math.hypot((nx - LM.spring[0]) / .014, (ny - LM.spring[1]) / .011) < 1) && h > 0) feat[i] |= F_STREAM;
    h -= .06;
    // the plateau meets the sea as a sheer cliff: no sand, deeper water at its foot
    if (pm > .35) { if (h >= 0 && h < .12) h = .12 + h * .5; else if (h < 0 && h > -.05) h = -.05 + h * .3; }
    H[i] = h;
    moist[i] = fbm(nx * 4 + 70, ny * 4 + 70, 4) + (ny - .5) * .3 - Math.max(0, (nx - .5)) * .2;
  }
}
const at = (x, y) => H[clamp(y, 0, GH - 1) * GW + clamp(x, 0, GW - 1)];
const atf = (fx, fy) => at((fx * GW) | 0, (fy * GH) | 0);

// ---------- regions & tiles ----------
const TILE_MIN_H = -.135, TILE_AREA = 1650 * (GW / 400) * (GH / 300);
function cellRegion(x, y) {
  const i = y * GW + x, h = H[i], nx = x / GW, ny = y / GH;
  if (h < TILE_MIN_H) return 0;
  if (h < -.02) return 5;
  if (plat[i] > .5) return 2;
  const vr = volRW(nx, ny), east = thicketSigned(nx, ny) > -.012;
  if (vr < 1.7) return 3;
  if (east) return 4;
  if (ny < VY + .02) return 3;
  return 1;
}
let REG_C = {}, BORDER_C = {};
const regOf = r => r === 5 ? 4 : r;
function buildTiles() {
  cellReg = new Int8Array(GW * GH);
  const cells = { 1: [], 2: [], 3: [], 4: [], 5: [] };
  for (let y = 0; y < GH; y++) for (let x = 0; x < GW; x++) { const r = cellRegion(x, y); cellReg[y * GW + x] = r; if (r) cells[r].push(y * GW + x); }
  seeds = [];
  [1, 2, 3, 4, 5].forEach(r => {
    const list = cells[r]; if (!list.length) return;
    const n = Math.max(2, Math.round(list.length / (TILE_AREA * { 1: .42, 2: 1, 3: .85, 4: .85, 5: 2.4 }[r])));   // the start region gets small, many tiles
    const minD = Math.sqrt(list.length / n) * .75;
    let placed = 0, tries = 0;
    while (placed < n && tries < 20000) {
      tries++;
      const c = list[(rnd() * list.length) | 0], x = c % GW, y = (c / GW) | 0;
      if (seeds.some(s => s.reg === r && Math.hypot(s.x - x, s.y - y) < minD)) continue;
      seeds.push({ x, y, reg: r, water: r === 5 }); placed++;
    }
  });
  const byReg = { 1: [], 2: [], 3: [], 4: [], 5: [] };
  seeds.forEach((s, k) => byReg[s.reg].push(k));
  region = new Int16Array(GW * GH).fill(-1);
  for (let it = 0; it < 4; it++) {
    const sx = new Float64Array(seeds.length), sy = new Float64Array(seeds.length), sn = new Float64Array(seeds.length);
    for (let i = 0; i < GW * GH; i++) {
      const r = cellReg[i]; if (!r) continue;
      const x = i % GW, y = (i / GW) | 0, ks = byReg[r];
      let best = -1, bd = 1e12;
      for (let j = 0; j < ks.length; j++) { const s = seeds[ks[j]], dx = s.x - x, dy = s.y - y, dd = dx * dx + dy * dy; if (dd < bd) { bd = dd; best = ks[j]; } }
      region[i] = best;
      sx[best] += x; sy[best] += y; sn[best]++;
    }
    if (it < 3) seeds.forEach((s, k) => { if (sn[k]) { s.x = sx[k] / sn[k]; s.y = sy[k] / sn[k]; } });
  }
  REG_C = {}; BORDER_C = {};
  for (let i = 0; i < GW * GH; i++) {
    const r = cellReg[i]; if (!r || r === 5) continue;
    const x = i % GW, y = (i / GW) | 0;
    (REG_C[r] = REG_C[r] || [0, 0, 0]); REG_C[r][0] += x; REG_C[r][1] += y; REG_C[r][2]++;
    if (x < GW - 1 && y < GH - 1) for (const o of [cellReg[i + 1], cellReg[i + GW]]) {
      if (o && o !== 5 && o !== r) { const key = Math.min(r, o) + '-' + Math.max(r, o); (BORDER_C[key] = BORDER_C[key] || [0, 0, 0]); BORDER_C[key][0] += x; BORDER_C[key][1] += y; BORDER_C[key][2]++; }
    }
  }
}

// ---------- colours ----------
const COL = {
  deep: hex('#0a3e5e'), sand: hex('#f2dcaa'), sandWet: hex('#d8bb80'),
  lowland: hex('#8cc152'), grass: hex('#6fae45'), jungle: hex('#2f7a40'), jungleDeep: hex('#215a30'),
  high: hex('#5f7a3c'), rock: hex('#8a7058'), rockDark: hex('#5a4840'), ash: hex('#4a403c'), crater: hex('#2b211e'),
  basalt: hex('#353133'), tangle: hex('#1d3f26')
};
const WATER = [[0, '#d3f7e8'], [.012, '#a6f0de'], [.035, '#5fdccb'], [.06, '#2cc3c6'], [.09, '#1aa6c2'], [.13, '#1484ad'], [.19, '#0f5f8a'], [.28, '#0a3e5e']].map(([d, c]) => [d, hex(c)]);
function waterColor(h, x, y) {
  const d = -h;
  let c = WATER[WATER.length - 1][1];

// ---------- projection ----------

// ---------- baked base layer ----------
let base, borders, labels;

function renderBase() {

// ---------- sprites ----------

      c.strokeStyle = 'rgba(255,240,170,' + (.35 + .45 * p) + ')'; c.lineWidth = 2.2; c.beginPath(); c.ellipse(x, y + 2, 22 + p * 4, 9 + p * 1.6, 0, 0, Math.PI * 2); c.stroke();
      drawWish(c, x, y - 46 - p * 3, t);

  }
  // content icons on known tiles, hints on scouted tiles
  T.forEach(tt => {
    if (tt.state === 0) return;
    const [x, y] = tileXY(tt.id);
    if (tt.state === 1) {
      if (tt.content && tt.content.kind === 'banyan') return;
      const icon = tt.content ? tt.content.icon || '•' : tt.b ? '☠' : ''; if (!icon) return;
      c.font = '18px serif'; c.textAlign = 'center'; c.globalAlpha = .8 + .2 * Math.sin(t * 2 + tt.id); c.fillText(icon, x, y + 6); c.globalAlpha = 1; return;
    }
    if (!tt.content || !tt.content.icon || tt.content.kind === 'banyan') return;
    if (tt.content.kind === 'gecko' && G.friends.gecko) return;
    c.font = '15px serif'; c.textAlign = 'center'; c.fillText(tt.content.icon, x + 16, y - 8);
  });
  // rot pips
  T.forEach(tt => {
    if (tt.b <= 0 || tt.state === 0 || tt.reg === 5) return;
    const [x, y] = tileXY(tt.id), bx = x - 18, by = y + 14;
    c.fillStyle = 'rgba(12,30,14,.82)'; roundRect(c, bx, by, 36, 12, 6); c.fill();
    for (let k = 0; k < 3; k++) {
      const px = bx + 8 + k * 10, py = by + 6;
      if (k < tt.b) { const g = c.createRadialGradient(px, py, 0, px, py, 6); g.addColorStop(0, 'rgba(120,255,80,.9)'); g.addColorStop(1, 'rgba(120,255,80,0)'); c.fillStyle = g; c.fillRect(px - 6, py - 6, 12, 12); c.fillStyle = '#7dff4f'; }
      else c.fillStyle = 'rgba(255,255,255,.18)';
      c.beginPath(); c.arc(px, py, 3, 0, Math.PI * 2); c.fill();
    }
  });
  // threat arrows with attack/defence badges
  const pulse = .55 + .4 * Math.sin(t * 4);
  if (G.phase !== 'grow') G.targets.forEach(id => {
    const inf = G.tinfo[id] || {}, tt = T[id], [x, y] = tileXY(id);
    dots(c, tt, G.flash === id ? 'rgba(255,90,60,.95)' : 'rgba(120,255,90,' + pulse * .8 + ')', G.flash === id ? 3 : 2.2);
    if (inf.from >= 0) {
      const [fx, fy] = tileXY(inf.from), mx = (fx + x) / 2 + (fy - y) * .2, my = (fy + y) / 2 + (x - fx) * .2 - 10;
      c.setLineDash(inf.overflow ? [7, 6] : []); c.lineCap = 'round';
      c.strokeStyle = 'rgba(10,30,10,.7)'; c.lineWidth = 6; c.beginPath(); c.moveTo(fx, fy); c.quadraticCurveTo(mx, my, x, y - 6); c.stroke();
      c.strokeStyle = 'rgba(120,255,80,' + pulse + ')'; c.lineWidth = 3; c.beginPath(); c.moveTo(fx, fy); c.quadraticCurveTo(mx, my, x, y - 6); c.stroke();
      c.setLineDash([]);
      const ang = Math.atan2(y - 6 - my, x - mx); c.fillStyle = 'rgba(120,255,80,' + pulse + ')';
      c.beginPath(); c.moveTo(x + Math.cos(ang) * 4, y - 6 + Math.sin(ang) * 4); c.lineTo(x - Math.cos(ang - .5) * 12, y - 6 - Math.sin(ang - .5) * 12); c.lineTo(x - Math.cos(ang + .5) * 12, y - 6 - Math.sin(ang + .5) * 12); c.fill();
    }
    const a = attackOn(tt), d = defense(tt), txt = '⚔' + a + '  🛡' + d, bad = a > d;
    c.font = "600 15px 'Fredoka',system-ui"; c.textAlign = 'center'; const w = c.measureText(txt).width + 14;
    c.fillStyle = bad ? 'rgba(150,30,20,.9)' : 'rgba(30,110,60,.9)'; roundRect(c, x - w / 2, y - 40, w, 20, 10); c.fill();
    c.fillStyle = '#fff6e3'; c.fillText(txt, x, y - 25);
  });
  // tortoise on crab beach
  const [tx, ty] = tileXY(G.start); drawTortoiseMini(c, tx + 26, ty + 4, t, saying && saying.who === 'tortoise');
  // group (Crusoe + briefcase + kitten)
  const gp = G.group; if (gp.t < 1) { gp.t = Math.min(1, gp.t + dt / .6); const e = 1 - Math.pow(1 - gp.t, 3); gp.x = lerp(gp.fx, gp.tx, e); gp.y = lerp(gp.fy, gp.ty, e); }
  drawCrusoeMini(c, gp.x - 4, gp.y, t, gp.t < 1, saying && saying.who === 'briefcase');
  if (G.cat) drawCatMini(c, G.cat.x, G.cat.y, t, true, G.cat.dir);
  else drawCatMini(c, gp.x + 9, gp.y + 2, t, false, 1);
  // floating texts
  c.textAlign = 'center'; c.font = "600 21px 'Fredoka',system-ui"; c.lineJoin = 'round';
  G.floats.forEach(f => { f.t += dt; const a = Math.max(0, 1 - f.t / 2.2), y = f.y - 18 - f.t * 14; c.globalAlpha = a; c.strokeStyle = 'rgba(15,30,25,.8)'; c.lineWidth = 4; c.strokeText(f.txt, f.x, y); c.fillStyle = f.col; c.fillText(f.txt, f.x, y); });
  c.globalAlpha = 1; G.floats = G.floats.filter(f => f.t < 2.2);
}
function roundRect(c, x, y, w, h, r) { c.beginPath(); c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath(); }
function dots(c, t, col, s) { c.fillStyle = col; for (const [x, y] of t.border) c.fillRect(x - s / 2, y - s / 2, s, s); }
function drawNest(c, x, y, t) {
  const p = .5 + .5 * Math.sin(t * 2.2);
  const g = c.createRadialGradient(x, y, 0, x, y, 40); g.addColorStop(0, 'rgba(90,255,50,' + (.35 + .2 * p) + ')'); g.addColorStop(1, 'rgba(90,255,50,0)');
  c.fillStyle = g; c.beginPath(); c.arc(x, y, 40, 0, Math.PI * 2); c.fill();
  c.fillStyle = '#15301a'; c.beginPath(); c.ellipse(x, y, 20, 8, 0, 0, Math.PI * 2); c.fill();
  c.fillStyle = 'rgba(60,200,50,.85)'; c.beginPath(); c.ellipse(x, y - 1, 15, 5.5, 0, 0, Math.PI * 2); c.fill();
  c.strokeStyle = 'rgba(140,255,90,.7)'; c.lineWidth = 1.5; c.beginPath(); c.ellipse(x, y, 20, 8, 0, 0, Math.PI * 2); c.stroke();
  for (let k = 0; k < 5; k++) {   // rising bubbles that pop
    const q = (t * .6 + k / 5) % 1, bx = x - 10 + k * 5 + Math.sin(t * 3 + k) * 1.5, by = y - 2 - q * 18, r = 1.2 + q * 2.4;
    c.globalAlpha = 1 - q; c.strokeStyle = '#a8ff7a'; c.lineWidth = 1; c.beginPath(); c.arc(bx, by, r, 0, Math.PI * 2); c.stroke();
  }
  c.globalAlpha = 1;
  // drips toward the sea
  c.strokeStyle = 'rgba(70,220,50,.6)'; c.lineWidth = 2;
  for (let k = 0; k < 3; k++) { const dx = x - 12 + k * 12, l = 6 + 4 * Math.sin(t * 1.5 + k * 2); c.beginPath(); c.moveTo(dx, y + 5); c.lineTo(dx + 1, y + 5 + l); c.stroke(); }
  c.font = "600 13px 'Fredoka',system-ui"; c.textAlign = 'center'; c.fillStyle = 'rgba(190,255,160,.95)'; c.fillText('NEST', x, y + 30);
}
function drawBanyan(c, x, y, t, friend) {
  const sway = Math.sin(t * 1.1) * .8;
  c.fillStyle = 'rgba(0,0,0,.25)'; c.beginPath(); c.ellipse(x, y + 1, 18, 5, 0, 0, Math.PI * 2); c.fill();
  // aerial roots
  c.strokeStyle = '#6b4a26'; c.lineWidth = 1.4;
  for (let k = -3; k <= 3; k++) { c.beginPath(); c.moveTo(x + k * 4.5 + sway, y - 22); c.quadraticCurveTo(x + k * 5, y - 10, x + k * 5.5, y); c.stroke(); }
  c.fillStyle = '#5a3d1e'; c.beginPath(); c.moveTo(x - 4, y); c.lineTo(x - 2, y - 24); c.lineTo(x + 2, y - 24); c.lineTo(x + 4, y); c.fill();
  // canopy
  const greens = friend ? ['#2f7a2a', '#3f9a36', '#5cbf45'] : ['#2b6a2a', '#3a8634', '#4fa640'];
  [[-12, -28, 12, 7], [11, -28, 12, 7], [0, -34, 15, 8], [-6, -38, 9, 5], [7, -38, 9, 5]].forEach(([dx, dy, rx, ry], i) => {
    c.fillStyle = greens[i % 3]; c.beginPath(); c.ellipse(x + dx + sway, y + dy, rx, ry, 0, 0, Math.PI * 2); c.fill();
  });
  c.fillStyle = 'rgba(200,255,160,.35)'; c.beginPath(); c.ellipse(x - 2 + sway, y - 38, 7, 3, 0, 0, Math.PI * 2); c.fill();
}
function drawWish(c, x, y, t) {
  c.fillStyle = 'rgba(255,246,227,.95)'; roundRect(c, x - 15, y - 13, 30, 24, 10); c.fill();
  c.beginPath(); c.moveTo(x - 4, y + 10); c.lineTo(x, y + 17); c.lineTo(x + 4, y + 10); c.fill();
  c.font = '15px serif'; c.textAlign = 'center'; c.fillText('✨', x, y + 4);
}
function drawCrusoeMini(c, x, y, t, walking, caseTalk) {
  const bob = walking ? Math.sin(t * 16) * 1.2 : 0, sw = walking ? Math.sin(t * 16) * 2 : 0;
  c.fillStyle = 'rgba(0,0,0,.25)'; c.beginPath(); c.ellipse(x, y + 1, 6, 2, 0, 0, Math.PI * 2); c.fill();
  c.strokeStyle = '#5d6470'; c.lineWidth = 2.4; c.lineCap = 'round';
  c.beginPath(); c.moveTo(x - 1.5, y - 8); c.lineTo(x - 1.5 - sw, y); c.moveTo(x + 1.5, y - 8); c.lineTo(x + 1.5 + sw, y); c.stroke();
  c.fillStyle = '#f4f1ea'; c.fillRect(x - 4, y - 17 + bob, 8, 10);
  c.fillStyle = G.wandel >= 5 ? '#5a8a3a' : '#8e2a2a'; c.fillRect(x - .7, y - 17 + bob, 1.6, 6);
  c.fillStyle = '#d9a27a'; c.beginPath(); c.arc(x, y - 20.5 + bob, 3.6, 0, Math.PI * 2); c.fill();
  c.fillStyle = '#4a3324'; c.beginPath(); c.ellipse(x, y - 23 + bob, 3.8, 1.8, 0, Math.PI, 0); c.fill();
  if (G.wandel >= 10) { c.fillStyle = '#7ec850'; c.beginPath(); c.ellipse(x + 3, y - 24 + bob, 2.4, 1.1, .5, 0, Math.PI * 2); c.fill(); }
  // the briefcase — it talks; when it does, its lid flaps
  const lid = caseTalk ? Math.abs(Math.sin(t * 14)) * 2.2 : 0, bx = x + 4, by = y - 14 + bob;
  c.fillStyle = '#2b2b2b'; c.fillRect(bx, by, 6, 4.5); c.fillStyle = '#39e639'; c.fillRect(bx, by + 3, 6, .9);
  c.fillStyle = '#3a3a3a'; c.save(); c.translate(bx, by); c.rotate(-lid * .25); c.fillRect(0, -1.2, 6, 1.4); c.restore();
  c.strokeStyle = '#2b2b2b'; c.lineWidth = .8; c.beginPath(); c.arc(bx + 3, by - .4, 1.3, Math.PI, 0); c.stroke();
}
function drawCatMini(c, x, y, t, running, dir) {
  const k = running ? Math.sin(t * 22) * 1.2 : 0;
  c.save(); c.translate(x, y); c.scale(dir || 1, 1); c.translate(-x, -y);
  c.fillStyle = 'rgba(0,0,0,.22)'; c.beginPath(); c.ellipse(x, y + 1, 4, 1.4, 0, 0, Math.PI * 2); c.fill();
  c.fillStyle = '#f2994a'; c.beginPath(); c.ellipse(x, y - 3 + k * .3, 4, 2.4, 0, 0, Math.PI * 2); c.fill();
  c.beginPath(); c.arc(x + 4, y - 5.5, 2.2, 0, Math.PI * 2); c.fill();
  c.beginPath(); c.moveTo(x + 2.6, y - 7); c.lineTo(x + 3.1, y - 9.2); c.lineTo(x + 4.2, y - 7.4); c.fill(); c.beginPath(); c.moveTo(x + 4.6, y - 7.4); c.lineTo(x + 5.6, y - 9.2); c.lineTo(x + 6, y - 6.8); c.fill();
  c.strokeStyle = '#e07b2e'; c.lineWidth = 1.2; c.beginPath(); c.moveTo(x - 4, y - 3); c.quadraticCurveTo(x - 7, y - 5 + k, x - 6, y - 8); c.stroke();
  if (running) { c.strokeStyle = '#d9822f'; c.lineWidth = 1; c.beginPath(); c.moveTo(x - 2, y - 1); c.lineTo(x - 2 - k, y + 1); c.moveTo(x + 2, y - 1); c.lineTo(x + 2 + k, y + 1); c.stroke(); }
  c.restore();
}
function drawTortoiseMini(c, x, y, t, talk) {
  const head = talk ? Math.sin(t * 10) * .8 : 0;
  c.fillStyle = 'rgba(0,0,0,.22)'; c.beginPath(); c.ellipse(x, y + 1, 8, 2.4, 0, 0, Math.PI * 2); c.fill();
  c.fillStyle = '#9aa565'; c.beginPath(); c.ellipse(x - 7.5, y - 3 + Math.sin(t * .9) * .4 + head, 2.4, 1.9, 0, 0, Math.PI * 2); c.fill();
  c.fillStyle = '#6f7d3c'; c.beginPath(); c.ellipse(x, y - 2, 6.5, 4.6, 0, Math.PI, 0); c.fill();
  c.fillStyle = '#58652d'; c.fillRect(x - 6.5, y - 2.4, 13, 1.2);
}
function SFXmeow() {}

// ---------- frame ----------
let lastT = 0;
function frame(ms) {
  const t = ms / 1000, dt = Math.min(.05, lastT ? t - lastT : .016); lastT = t; G.now = t;
  updateCat(dt);
  if (G.stateDirty) composeState();
  if (G.fogDirty || G.knownDirty) composeFog();
  mainCtx.setTransform(1, 0, 0, 1, 0, 0);
  mainCtx.drawImage(base.c, 0, 0);
  if (showTiles) mainCtx.drawImage(borders.c, 0, 0);
  mainCtx.setTransform(K, 0, 0, K, 0, 0);
  drawAnim(t);
  mainCtx.setTransform(1, 0, 0, 1, 0, 0);
  mainCtx.drawImage(stateLayer.c, 0, 0);
  mainCtx.setTransform(K, 0, 0, K, 0, 0);
  drawUnder(t, dt);
  mainCtx.globalAlpha = .93; mainCtx.drawImage(FOG.out.c, 0, 0, CW, CH); mainCtx.globalAlpha = 1;
  drawOver(t, dt);
  vignette(mainCtx);
  placeBubble();
  requestAnimationFrame(frame);
}

// ---------- build (with a loading screen) ----------
const lbar = document.getElementById('lbar');
const step = (p, fn) => new Promise(res => setTimeout(() => { fn(); lbar.style.width = p + '%'; res(); }, 20));
async function build() {
  const t0 = performance.now();
  initNoise();
  await step(35, buildTerrain);
  await step(55, buildTiles);
  await step(80, renderBase);
  await step(90, renderBorders);
  await step(100, () => { buildGame(); composeState(); composeFog(); });
  document.getElementById('info').firstChild.textContent = 'built in ' + Math.round(performance.now() - t0) + ' ms · ' + seeds.length + ' tiles · ';
  const ld = document.getElementById('loading'); ld.style.opacity = 0; setTimeout(() => ld.remove(), 700);
  updateHUD(); banner('Low tide · Tide 1');
  setTimeout(() => {
    say1('intro', 'tortoise', 'Another one. Washed up in a tie. Lovely. Tap a tile next to you to walk — the cat sniffs ahead for free. Let her.');
    say1('opening', 'briefcase', 'Opening balance: one accountant, one cat, eight units of tide. Spend wisely. And keep me dry.');
  }, 1200);
  requestAnimationFrame(frame);
}
document.getElementById('bTiles').onclick = e => { showTiles = !showTiles; e.target.textContent = 'Tile borders: ' + (showTiles ? 'on' : 'off'); };
build();
