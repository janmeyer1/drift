<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vertical Solar Rim & Flare Eruption - Fixed</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #030100;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        canvas {
            display: block;
            background: #000;
        }
    </style>
</head>
<body>

<canvas id="solarCanvas"></canvas>

<script>
const canvas = document.getElementById('solarCanvas');
const ctx = canvas.getContext('2d');

let centerX, centerY, sunRadius;

// FIX: Reliable positioning math relative to screen boundaries
function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    
    // Use the shorter screen dimension to scale the sun radius reliably
    const referenceSize = Math.min(canvas.width, canvas.height);
    sunRadius = referenceSize * 1.5; 
    
    // Anchor the center point exactly relative to the right edge of the screen
    centerX = canvas.width + sunRadius - 80; // Only shows an 80px thick arc rim on screen
    centerY = canvas.height / 2;
}
resize();
window.addEventListener('resize', resize);

const standardParticles = [];
const majorArchParticles = [];
const maxStandard = 250;

let eruptionTimer = 0;
const eruptionInterval = 240; // Eruption cycle every ~4 seconds
let isErupting = false;
let eruptionProgress = 0;
let eruptionAngle = Math.PI;

class SolarParticle {
    constructor(isMajor = false) {
        this.isMajor = isMajor;
        this.reset();
        if(!isMajor) this.age = Math.random() * this.maxAge;
    }

    reset() {
        this.age = 0;
        
        if (this.isMajor) {
            this.baseAngle = eruptionAngle + (Math.random() - 0.5) * 0.18;
            this.maxAge = 100 + Math.random() * 60;
            this.maxHeight = 280 + Math.random() * 220; // Long trailing filament arms
            this.loopDirection = (Math.random() - 0.5) * 0.04;
            this.size = 5 + Math.random() * 15;
            this.hue = 0 + Math.random() * 18; 
        } else {
            // Anchor arc distribution to the left face of the right-side Sun
            this.baseAngle = Math.PI + (Math.random() - 0.5) * 0.7; 
            this.maxAge = 40 + Math.random() * 60;
            this.maxHeight = 25 + Math.random() * 65;
            this.loopDirection = Math.random() > 0.5 ? 1 : -1;
            this.size = 2 + Math.random() * 7;
            this.hue = 10 + Math.random() * 22;
        }
        
        this.angle = this.baseAngle;
        this.radius = sunRadius;
        this.swirlSeed = Math.random() * 100;
    }

    update(tick) {
        this.age++;
        const progress = this.age / this.maxAge;

        if (this.isMajor) {
            const reach = Math.sin(progress * Math.PI * 0.85) * this.maxHeight; 
            this.radius = sunRadius + reach;
            this.angle = this.baseAngle + (progress * this.loopDirection) + Math.sin(tick * 0.08 + this.swirlSeed) * 0.015;
        } else {
            const archHeight = Math.sin(progress * Math.PI) * this.maxHeight;
            this.radius = sunRadius + archHeight;
            this.angle = this.baseAngle + (progress * 0.04 * this.loopDirection) + Math.cos(tick * 0.08 + this.swirlSeed) * 0.006;
        }

        if (this.age >= this.maxAge) {
            if (this.isMajor) return false; 
            this.reset();
        }
        return true;
    }

    draw() {
        const progress = this.age / this.maxAge;
        const alpha = this.isMajor ? (1 - progress) * Math.sin(progress * Math.PI) : Math.sin(progress * Math.PI);

        const x = centerX + Math.cos(this.angle) * this.radius;
        const y = centerY + Math.sin(this.angle) * this.radius;

        // Skip drawing if particles shoot completely off the left side of the screen
        if (x < -100) return;

        ctx.save();
        ctx.globalCompositeOperation = 'screen';
        
        const grad = ctx.createRadialGradient(x, y, 0, x, y, this.size);
        grad.addColorStop(0, this.isMajor ? `hsla(${this.hue + 35}, 100%, 92%, ${alpha})` : `hsla(${this.hue + 25}, 100%, 75%, ${alpha})`);
        grad.addColorStop(0.3, `hsla(${this.hue}, 100%, 55%, ${alpha * 0.8})`);
        grad.addColorStop(1, `hsla(0, 100%, 30%, 0)`);

        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(x, y, this.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
    }
}

// Populate structural background loops
for (let i = 0; i < maxStandard; i++) {
    standardParticles.push(new SolarParticle(false));
}

function drawSunSurfaceAndRim(tick) {
    ctx.save();

    // 1. Core Background Atmospheric Glow
    const corona = ctx.createRadialGradient(centerX, centerY, sunRadius - 40, centerX, centerY, sunRadius + 400);
    corona.addColorStop(0, 'rgba(255, 45, 0, 0.4)');
    corona.addColorStop(0.25, 'rgba(180, 15, 0, 0.18)');
    corona.addColorStop(0.7, 'rgba(60, 2, 0, 0.03)');
    corona.addColorStop(1, 'rgba(0, 0, 0, 0)');
    ctx.fillStyle = corona;
    ctx.beginPath();
    ctx.arc(centerX, centerY, sunRadius + 400, 0, Math.PI * 2);
    ctx.fill();

    // 2. Localized Boiling Edge Convection Cells
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = '#1c0200';
    ctx.beginPath();
    ctx.arc(centerX, centerY, sunRadius, 0, Math.PI * 2);
    ctx.fill();

    const numCells = 28;
    const startAngle = Math.PI - 0.5;
    const endAngle = Math.PI + 0.5;

    for (let i = 0; i < numCells; i++) {
        const anglePercent = i / numCells;
        const currentAngle = startAngle + (endAngle - startAngle) * anglePercent;
        
        const cellWave = Math.sin(tick * 0.07 + i * 1.5) * 5;
        const cellShiftX = Math.cos(tick * 0.03 + i) * 5;
        
        let intensityModifier = 1;
        if (isErupting) {
            intensityModifier = 1.2 + Math.sin(tick * 0.35 + i) * 0.9 * (1 - eruptionProgress);
        } else if (eruptionTimer > eruptionInterval * 0.75) {
            const premonitionScale = (eruptionTimer - eruptionInterval * 0.75) / (eruptionInterval * 0.25);
            intensityModifier = 1 + Math.sin(tick * 0.18 + i) * 0.5 * premonitionScale;
        }

        const cellRadius = sunRadius - 8 + (cellWave * intensityModifier);
        const cellX = centerX + Math.cos(currentAngle) * cellRadius + cellShiftX;
        const cellY = centerY + Math.sin(currentAngle) * cellRadius;

        const cellGrad = ctx.createRadialGradient(cellX, cellY, 1, cellX, cellY, 70 * intensityModifier);
        
        if (isErupting && Math.abs(currentAngle - eruptionAngle) < 0.22) {
            cellGrad.addColorStop(0, '#ffffff'); // Mega explosion root point illumination
            cellGrad.addColorStop(0.25, '#ffdf42');
        } else {
            cellGrad.addColorStop(0, '#ffe552'); // Normal turbulent convective granulation
            cellGrad.addColorStop(0.45, '#ff3700');
        }
        cellGrad.addColorStop(0.85, '#6b0300');
        cellGrad.addColorStop(1, 'rgba(28, 2, 0, 0)');

        ctx.globalCompositeOperation = 'screen';
        ctx.fillStyle = cellGrad;
        ctx.beginPath();
        ctx.arc(cellX, cellY, 80 * intensityModifier, 0, Math.PI * 2);
        ctx.fill();
    }

    // 3. Sharp Inner Sun Cover Mask
    ctx.globalCompositeOperation = 'source-over';
    const bodyGrad = ctx.createRadialGradient(centerX, centerY, sunRadius * 0.96, centerX, centerY, sunRadius);
    bodyGrad.addColorStop(0, '#ffcc00');
    bodyGrad.addColorStop(0.4, '#e62e00');
    bodyGrad.addColorStop(0.88, '#730000');
    bodyGrad.addColorStop(1, '#1a0100'); 

    ctx.fillStyle = bodyGrad;
    ctx.beginPath();
    ctx.arc(centerX, centerY, sunRadius, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
}

let tick = 0;
function animate() {
    ctx.fillStyle = 'rgba(3, 1, 0, 0.25)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    tick++;

    if (!isErupting) {
        eruptionTimer++;
        if (eruptionTimer >= eruptionInterval) {
            isErupting = true;
            eruptionProgress = 0;
            eruptionAngle = Math.PI + (Math.random() - 0.5) * 0.35; 
        }
    } else {
        eruptionProgress += 0.01; 
        
        if (eruptionProgress < 0.75) {
            for (let k = 0; k < 5; k++) {
                majorArchParticles.push(new SolarParticle(true));
            }
        }
        
        if (eruptionProgress >= 1) {
            isErupting = false;
            eruptionTimer = 0;
        }
    }

    standardParticles.forEach(p => {
        p.update(tick);
        p.draw();
    });

    for (let i = majorArchParticles.length - 1; i >= 0; i--) {
        const active = majorArchParticles[i].update(tick);
        if (!active) {
            majorArchParticles.splice(i, 1);
        } else {
            majorArchParticles[i].draw();
        }
    }

    drawSunSurfaceAndRim(tick);

    requestAnimationFrame(animate);
}

animate();
</script>

</body>
</html>
