<html lang="de">
<head>

<body>

<button id="audioBtn">SOUND AKTIVIEREN</button>
<canvas id="solarCanvas"></canvas>

<script>
const canvas = document.getElementById('solarCanvas');
const ctx = canvas.getContext('2d');
const audioBtn = document.getElementById('audioBtn');

// --- STABILE GEOMETRIE (KREISBOGEN-MODELL) ---
let centerX, centerY, sunRadius;

function resize() {
    const w = window.innerWidth || document.documentElement.clientWidth || 800;
    const h = window.innerHeight || document.documentElement.clientHeight || 600;
    
    canvas.width = w;
    canvas.height = h;
    
    sunRadius = h * 1.2; 
    centerX = w + sunRadius - 90; 
    centerY = h / 2;
}
resize();
window.addEventListener('resize', resize);
window.addEventListener('load', resize);

// --- NATIVE AUDIO PROZEDURAL (CRASH-SICHER) ---
let audioCtx = null;
let ambientGain = null;
let audioEnabled = false; 

function initAudio() {
    if (audioCtx) return;
    
    try {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        audioEnabled = true;
        
        audioBtn.style.display = 'none';

        const ambientOsc = audioCtx.createOscillator();
        const ambientFilter = audioCtx.createBiquadFilter();
        ambientGain = audioCtx.createGain();

        ambientOsc.type = 'sawtooth';
        ambientOsc.frequency.setValueAtTime(32, audioCtx.currentTime); 
        ambientFilter.type = 'lowpass';
        ambientFilter.frequency.setValueAtTime(45, audioCtx.currentTime); 
        ambientGain.gain.setValueAtTime(0.08, audioCtx.currentTime); 

        ambientOsc.connect(ambientFilter);
        ambientFilter.connect(ambientGain);
        ambientGain.connect(audioCtx.destination);
        ambientOsc.start();

        setInterval(() => {
            if (!audioCtx) return;
            const mod = 0.05 + Math.sin(Date.now() * 0.001) * 0.02;
            ambientGain.gain.linearRampToValueAtTime(mod, audioCtx.currentTime + 0.1);
        }, 100);
    } catch(e) {
        console.error("Audio-Init fehlgeschlagen:", e);
    }
}

function playFlareSound(isMajor) {
    if (!audioEnabled || !audioCtx) return;

    try {
        const sampleRate = audioCtx.sampleRate || 44100;
        const bufferSize = sampleRate * (isMajor ? 3.5 : 1.2); 
        const buffer = audioCtx.createBuffer(1, bufferSize, sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
            data[i] = Math.random() * 2 - 1;
        }

        const noiseNode = audioCtx.createBufferSource();
        noiseNode.buffer = buffer;

        const filter = audioCtx.createBiquadFilter();
        filter.type = 'bandpass';
        const gainNode = audioCtx.createGain();

        if (isMajor) {
            filter.frequency.setValueAtTime(55, audioCtx.currentTime);
            filter.frequency.exponentialRampToValueAtTime(160, audioCtx.currentTime + 1.2);
            filter.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 3.5);
            filter.Q.setValueAtTime(3, audioCtx.currentTime);

            gainNode.gain.setValueAtTime(0.0, audioCtx.currentTime);
            gainNode.gain.linearRampToValueAtTime(0.22, audioCtx.currentTime + 0.4); 
            gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 3.5);

            const subOsc = audioCtx.createOscillator();
            const subGain = audioCtx.createGain();
            subOsc.frequency.setValueAtTime(38, audioCtx.currentTime);
            subOsc.frequency.linearRampToValueAtTime(20, audioCtx.currentTime + 1.8);
            subGain.gain.setValueAtTime(0.25, audioCtx.currentTime);
            subGain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 2.2);
            
            subOsc.connect(subGain);
            subGain.connect(audioCtx.destination);
            subOsc.start();
            subOsc.stop(audioCtx.currentTime + 2.2);
        } else {
            filter.frequency.setValueAtTime(100, audioCtx.currentTime);
            filter.frequency.linearRampToValueAtTime(70, audioCtx.currentTime + 1.0);
            filter.Q.setValueAtTime(1, audioCtx.currentTime);

            gainNode.gain.setValueAtTime(0.03, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 1.0);
        }

        noiseNode.connect(filter);
        filter.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        noiseNode.start();
    } catch (e) {
        // Stumm abfangen
    }
}

audioBtn.addEventListener('click', (e) => { initAudio(); });
audioBtn.addEventListener('touchstart', (e) => { initAudio(); });

// --- PARTIKEL SYSTEM VARIABLEN ---
const standardParticles = []; 
const flareParticles = [];  
const maxStandard = 180;       

let globalEruptionTimer = 0;
const globalEruptionInterval = 960; 
let isGlobalErupting = false;
let globalEruptionProgress = 0;
let globalEruptionAngle = Math.PI;

class SolarParticle {
    constructor(type) {
        this.type = type; 
        this.reset();
        if(type === 'standard') this.age = Math.random() * this.maxAge;
    }

    reset() {
        this.age = 0;
        this.swirlSeed = Math.random() * 100;

        if (this.type === 'global') {
            this.baseAngle = globalEruptionAngle + (Math.random() - 0.5) * 0.12;
            this.maxAge = 110 + Math.random() * 50;
            this.maxHeight = 320 + Math.random() * 200; 
            this.gravityPull = 0.85; 
            this.loopDirection = (Math.random() - 0.5) * 0.02;
            this.size = 5 + Math.random() * 12;        
            this.hue = 0 + Math.random() * 15;          
        } 
        else if (this.type === 'local') {
            this.baseAngle = Math.PI + (Math.random() - 0.5) * 0.5;
            this.maxAge = 45 + Math.random() * 35;
            this.maxHeight = 40 + Math.random() * 45; 
            this.gravityPull = 1.4; 
            this.loopDirection = (Math.random() > 0.5 ? 1 : -1) * 0.14; 
            this.size = 2 + Math.random() * 5;
            this.hue = 14 + Math.random() * 18;
        } 
        else {
            this.baseAngle = Math.PI + (Math.random() - 0.5) * 0.7; 
            this.maxAge = 35 + Math.random() * 35;
            this.maxHeight = 15 + Math.random() * 30;   
            this.gravityPull = 1.0;
            this.loopDirection = Math.random() > 0.5 ? 1 : -1; 
            this.size = 1.5 + Math.random() * 4;
            this.hue = 12 + Math.random() * 20;         
        }
        
        this.angle = this.baseAngle;
        this.radius = sunRadius;
    }

    update(tick) {
        this.age++;
        const progress = this.age / this.maxAge; 

        const archHeight = Math.sin(Math.pow(progress, this.gravityPull) * Math.PI) * this.maxHeight;
        this.radius = sunRadius + archHeight;
        this.angle = this.baseAngle + (progress * this.loopDirection) + Math.sin(tick * 0.08 + this.swirlSeed) * 0.006;

        if (this.age >= this.maxAge) {
            if (this.type === 'global' || this.type === 'local') return false; 
            this.reset(); 
        }
        return true;
    }

    draw() {
        const progress = this.age / this.maxAge;
        const alpha = Math.sin(progress * Math.PI);

        const x = centerX + Math.cos(this.angle) * this.radius;
        const y = centerY + Math.sin(this.angle) * this.radius;

        if (x < -100) return;

        ctx.save();
        ctx.globalCompositeOperation = 'screen';
        
        const grad = ctx.createRadialGradient(x, y, 0, x, y, this.size);
        grad.addColorStop(0, this.type === 'global' ? `hsla(${this.hue + 35}, 100%, 94%, ${alpha})` : `hsla(${this.hue + 22}, 100%, 75%, ${alpha})`);
        grad.addColorStop(0.3, `hsla(${this.hue}, 100%, 55%, ${alpha * 0.8})`);
        grad.addColorStop(1, `hsla(0, 100%, 30%, 0)`);

        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(x, y, this.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
    }
}

for (let i = 0; i < maxStandard; i++) {
    standardParticles.push(new SolarParticle('standard'));
}
