<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Robinson Surf v002</title>
<style>
  html,body{margin:0;height:100%;background:#0d2a36;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;font-family:ui-monospace,Menlo,Consolas,monospace}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  canvas{image-rendering:pixelated;image-rendering:crisp-edges;display:block;touch-action:none;outline:none}
  #dbgBtn{position:fixed;top:8px;right:8px;z-index:5;background:#0008;color:#cfe;border:1px solid #6aa;border-radius:6px;font:12px ui-monospace,monospace;padding:6px 9px;cursor:pointer}
  #dbg{position:fixed;top:40px;right:8px;z-index:5;width:260px;max-height:calc(100% - 50px);overflow:auto;background:#061820e6;color:#cfe;border:1px solid #3a7f8f;border-radius:8px;font:11px/1.35 ui-monospace,monospace;padding:8px;display:none}
  #dbg.on{display:block}
  #dbg pre{margin:0 0 6px;white-space:pre-wrap}
  #dbg label{display:block;margin:5px 0 0}
  #dbg input[type=range]{width:100%}
  #dbg button{background:#123;color:#cfe;border:1px solid #3a7f8f;border-radius:4px;font:11px ui-monospace,monospace;padding:4px 7px;margin:4px 4px 0 0;cursor:pointer}
  #dbg .row{display:flex;justify-content:space-between}
  #logBox{position:fixed;inset:10% 8%;z-index:9;display:none;flex-direction:column;background:#061820f2;border:1px solid #3a7f8f;border-radius:8px;padding:10px;color:#cfe;font:12px ui-monospace,monospace}
  #logBox.on{display:flex}
  #logBox textarea{flex:1;width:100%;box-sizing:border-box;background:#02100f;color:#cfe;border:1px solid #3a7f8f;font:11px ui-monospace,monospace}
  #logBox button{margin-top:8px;align-self:flex-end;background:#123;color:#cfe;border:1px solid #3a7f8f;border-radius:4px;padding:5px 10px;font:12px ui-monospace,monospace}
  #toast{position:fixed;left:50%;top:14px;transform:translateX(-50%);z-index:8;background:#000a;color:#e9fbff;border-radius:6px;padding:6px 12px;font:12px ui-monospace,monospace;display:none}
</style>
</head>
<body>
<div id="wrap"><canvas id="cv" width="960" height="540" tabindex="0"></canvas></div>
<button id="dbgBtn">DBG</button>
<div id="dbg">
  <pre id="dbgOut"></pre>
  <label><div class="row"><span>stress: monsters</span><span id="v_stress">off</span></div><input type="range" id="stress" min="0" max="600" step="25" value="0"></label>
  <button id="bBurst">+100 burst</button><button id="bVoid">VOID full</button><button id="bLog">📋 Log</button>
  <label><input type="checkbox" id="tLite"> graphics: lite</label>
  <label><input type="checkbox" id="tFlat"> wave flattens on long braking</label>
  <label><input type="checkbox" id="tArc"> show jump arc preview</label>
  <div id="sliders"></div>
  <button id="bSkip">+20 s</button><button id="bReset">reset</button>
</div>
<div id="logBox"><div>Log — copy and paste it into the chat:</div><textarea id="logTxt" readonly></textarea><button id="logClose">close</button></div>
<div id="toast"></div>
<script>
'use strict';
// ===== Robinson — surf prototype v002 (standalone) =====
// World units = v001 units (480 × 270); the canvas renders at 2× (960 × 540) for finer detail.
// Wave frame: u = horizontal distance from the crest (u = 0, top left), growing down the face to the right.
// Water features (bumps, foam, monsters) are fixed in the water and flow left at the rider's tempo v.

const VERSION = 'v002';
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const W = 480, H = 270, SC = 2;
ctx.imageSmoothingEnabled = false;

// ---------- tunables ----------
const P = {
  thrust: 130, brake: 1.5, gSlope: 55, vMin: 35, vCruise: 95, vMax: 300,
  g: 560, jMin: 45, jMax: 215, dashMax: 230, climb: 60, steepBase: 1, spawnMul: 1,
  stampRate: 0.5, stampRange: 75, stampSpeed: 330, splashR: 16, splash: 0.3,
  sCd: 6, wCharge: 30, trough: 1,
  flatten: false, arc: false, lite: false, stress: 0,
};
const SLIDERS = [
  ['thrust', 40, 300, 5], ['brake', 0.3, 4, 0.1], ['vMax', 150, 450, 10], ['g', 250, 900, 10],
  ['jMax', 80, 400, 5], ['dashMax', 50, 450, 10], ['climb', 20, 140, 5], ['steepBase', 0.6, 1.6, 0.05],
  ['stampRate', 0.1, 1.5, 0.05], ['stampRange', 30, 200, 5], ['sCd', 1, 15, 0.5], ['wCharge', 5, 90, 5],
  ['trough', 0, 2, 0.1], ['spawnMul', 0.3, 3, 0.1],
];
const HP = { t: 1, m: 3, u: 2, f: 1 };

// ---------- wave surface (analytic) ----------
const Y_TOP = 38, S0 = 0.06;
const KK = [2 * Math.PI / 300, 2 * Math.PI / 110, 2 * Math.PI / 43];   // intrawave, bumps, ripples
const AA = [0.25, 0.45, 0.22];
const PH = [1.3, 0.7, 2.1];
let L = 150, AMP = 200;

function F(u, S) {
  const al = -1 / L, e = Math.exp(al * u), c = AMP / L;
  let y = -AMP * e + S0 * u;
  for (let i = 0; i < 3; i++) {
    const k = KK[i], a = AA[i], p = k * (u + S) + PH[i], sn = Math.sin(p), cs = Math.cos(p);
    y += c * a * e * (al * sn - k * cs) / (al * al + k * k) - S0 * a * cs / k;
  }
  return y;
}
function ysAt(u, S) { return Y_TOP + AMP + F(u, S); }
function slopeAt(u, S) {
  let m = 1;
  for (let i = 0; i < 3; i++) m += AA[i] * Math.sin(KK[i] * (u + S) + PH[i]);
  return (AMP / L * Math.exp(-u / L) + S0) * m;
}

// ---------- sprites (pre-rendered at 2×) ----------
function sprite(w, h, fn) {
  const c = document.createElement('canvas');
  c.width = w * SC; c.height = h * SC;
  const x = c.getContext('2d');
  x.imageSmoothingEnabled = false;
  x.scale(SC, SC);
  fn((a, b, cw, ch, col) => { x.fillStyle = col; x.fillRect(a, b, cw, ch); });
  return c;
}
function whiteOf(src) {
  const c = document.createElement('canvas');
  c.width = src.width; c.height = src.height;
  const x = c.getContext('2d');
  x.drawImage(src, 0, 0);
  x.globalCompositeOperation = 'source-atop';
  x.fillStyle = '#ffffff'; x.fillRect(0, 0, c.width, c.height);
  return c;
}
// each sprite: { img: [frames], flash: [frames], w, h, ox, oy } — anchor (ox, oy) in world units
function makeSet(w, h, ox, oy, frames) {
  const img = frames.map(f => sprite(w, h, f));
  return { img, flash: img.map(whiteOf), w, h, ox, oy };
}
const SPR = {
  t: makeSet(11, 7, 5.5, 6, [0, 1].map(fr => R => {
    const d = '#16201a', hl = '#3f6a28';
    R(1.5, 2, 6, 4, d); R(2, 1.5, 5, 5, d); R(2.5, 1, 4, 0.5, d);
    R(3, 2, 2, 0.5, hl); R(2.5, 2.5, 1, 0.5, hl); R(4.5, 4, 1, 0.5, '#7a2e2e'); R(5.5, 3, 0.5, 0.5, '#7a2e2e');
    R(2, 3, 1, 1, '#c6ff63'); R(2, 3.5, 0.5, 0.5, '#0b0f0b');
    const t = fr ? 0.5 : -0.5;
    R(7.5, 3 + t, 1.5, 1, d); R(9, 3.5 - t, 1.5, 0.5, d); R(10, 3 + t, 1, 0.5, d);
  })),
  m: makeSet(14, 11, 7, 10, [0, 1].map(fr => R => {
    const d = '#22182b', r = '#463656';
    R(1, 3, 12, 7, d); R(1.5, 2, 11, 1, d); R(3, 1, 8, 1, d); R(5, 0.5, 4, 0.5, d);
    for (const x of [3, 5.5, 8, 10.5]) R(x, 2, 0.5, 7, r);
    R(4, 1.5, 6, 0.5, '#5a4870');
    R(1, 9, 12, 1, '#0d0912');
    R(2, 9, 10, 0.5, fr ? '#a8f060' : '#5d8f2e');
    R(3, 5, 0.5, 0.5, '#5d8f2e'); R(9.5, 4, 1, 0.5, '#5d8f2e'); R(11, 7, 0.5, 0.5, '#7a2e2e');
  })),
  u: makeSet(16, 6, 8, 3, [0, 1].map(fr => R => {
    const d = '#0b2a2e';
    for (const [x, y] of [[1, 1], [6, 3], [10, 0.5]]) {
      R(x, y, 3, 2, d); R(x + 0.5, y - 0.5, 2, 0.5, d);
      R(x + 3, y + (fr ? 0.5 : 0), 2, 0.5, d);
      R(x + 0.5, y + 0.5, 0.5, 0.5, '#6fbf70');
    }
  })),
  f: makeSet(12, 8, 6, 5, [0, 1].map(fr => R => {
    const d = '#17140c', st = '#5e5230';
    R(2, 4, 7, 3, d); R(3, 3.5, 5, 0.5, d); R(1, 4.5, 1, 2, d);
    R(4, 4, 0.5, 3, st); R(6, 4, 0.5, 3, st);
    R(9, 5, 2, 0.5, d); R(10.5, 5.5, 1, 0.5, d);
    R(1.5, 5, 0.5, 0.5, '#c6ff63');
    const wy = fr ? 0 : 1.5;
    R(3, 1 + wy, 3, 2, '#c9d2c4cc'); R(6, 0.5 + wy, 3, 2, '#b8c2b4cc'); R(3.5, 1.5 + wy, 2, 0.5, '#7d877a');
  })),
};
const STAMP = sprite(6, 6, R => { R(2, 0, 2, 2.5, '#5a3a22'); R(1.5, 0, 3, 0.5, '#7a5634'); R(0.5, 2.5, 5, 1.5, '#2b2b2b'); R(0.5, 4, 5, 1.5, '#2e9e4f'); R(1, 4.5, 4, 0.5, '#7fe39a'); });

// ---------- cached background ----------
let BG = null;
function buildBG() {
  const sky = document.createElement('canvas'); sky.width = W * SC; sky.height = 140 * SC;
  const x = sky.getContext('2d'); x.scale(SC, SC);
  const g = x.createLinearGradient(0, 0, 0, 140);
  g.addColorStop(0, '#5aa9d6'); g.addColorStop(0.65, '#a9dbe9'); g.addColorStop(0.9, '#e3f3ee'); g.addColorStop(1, '#e3f3ee');
  x.fillStyle = g; x.fillRect(0, 0, W, 140);
  x.fillStyle = '#fff6c8'; x.fillRect(388, 26, 14, 14); x.fillRect(386, 28, 18, 10); x.fillRect(390, 24, 10, 18);
  x.fillStyle = '#fffbe0'; x.fillRect(391, 29, 8, 8);
  const isl = sprite(240, 32, R => {
    const c1 = '#6f9d97', c2 = '#5d8a86', HZ = 32;
    for (let i = 0; i < 70; i += 0.5) { const h = Math.max(0, 24 - Math.abs(i - 34) * 0.75); R(i, HZ - h, 0.5, h, c1); }
    R(31, HZ - 26, 7, 3, '#8a6f6a'); R(33, HZ - 27.5, 3, 1.5, '#9a827a');
    for (let i = 0; i < 120; i += 0.5) { const h = 6 + 4 * Math.sin(i * 0.09); R(40 + i, HZ - h, 0.5, h, c2); }
    for (const px of [70, 96, 128]) {
      R(px, HZ - 16, 1, 10, '#4c6f6b');
      R(px - 4, HZ - 17, 9, 1, '#4c6f6b'); R(px - 3, HZ - 18, 2, 1, '#4c6f6b'); R(px + 2, HZ - 18, 2, 1, '#4c6f6b'); R(px - 5, HZ - 16, 1, 1, '#4c6f6b'); R(px + 5, HZ - 16, 1, 1, '#4c6f6b');
    }
  });
  const sea = document.createElement('canvas'); sea.width = W * SC; sea.height = 200 * SC;
  const y = sea.getContext('2d'); y.scale(SC, SC);
  const g2 = y.createLinearGradient(0, 0, 0, 200);
  g2.addColorStop(0, '#7fb6cf'); g2.addColorStop(0.2, '#4d8fb4'); g2.addColorStop(1, '#2a5f86');
  y.fillStyle = g2; y.fillRect(0, 0, W, 200);
  BG = { sky, isl, sea };
}

// ---------- state ----------
let G;
function reset() {
  G = {
    T: 0, S: 0, v: P.vCruise, steep: 1,
    u: 120, y: 0, vy: 0, q: 0, air: false, airT: 0, qAir: 0,
    dashT: 0, dashDur: 0, dashU: 0, diveT: 0, jumpBusy: false,
    stumble: 0, lipCd: 0, aHeldT: 0, inv: 0, kickT: 0,
    camU: 0, camY: 0, shake: 0, dim: 0,
    mons: [], shots: [], fx: [], bolts: [], flood: null, voidQ: null,
    trail: [], trailT: 0, stampT: 0, sCharge: 1, wCharge: 0,
    spawnT: 0, spawnT2: 0, spawnT3: 0,
    farX: 0, midX: 0, nearX: 0, pred: null, jumpOK: false, cat: 'calm',
    K: { stamp: 0, splash: 0, dash: 0, jump: 0, dive: 0, s: 0, void: 0 },
    Hc: { t: 0, m: 0, fall: 0, f: 0, lip: 0 },
    C: { jumps: 0, dashes: 0, dives: 0, s: 0, w: 0, spills: 0, washed: 0 },
  };
  L = 150 / G.steep; AMP = 200;
  G.y = ysAt(G.u, G.S);
  G.camU = G.u - 0.3 * W;
  PT.n = 0;
  LOG.rows = []; LOG.peak = { fps: 999, at: 0, ms: 0 };
}

// ---------- particles (pooled) ----------
const PMAX = 3000;
const PT = {
  n: 0, x: new Float32Array(PMAX), y: new Float32Array(PMAX), vx: new Float32Array(PMAX), vy: new Float32Array(PMAX),
  t: new Float32Array(PMAX), life: new Float32Array(PMAX), sz: new Float32Array(PMAX), g: new Float32Array(PMAX),
  c: new Uint8Array(PMAX), add: new Uint8Array(PMAX),
};
const PCOL = ['#ffffff', '#e9fbff', '#b8f05a', '#3d6b25', '#4b3a5a', '#7dffb0', '#2cff9a', '#c6ff63', '#0e3b2a', '#9de7ff', '#2e9e4f'];
function budget() { return P.lite ? 900 : PMAX; }
function part(x, y, vx, vy, life, ci, sz, grav, add) {
  if (PT.n >= budget()) return;
  const i = PT.n++;
  PT.x[i] = x; PT.y[i] = y; PT.vx[i] = vx; PT.vy[i] = vy; PT.t[i] = 0; PT.life[i] = life;
  PT.c[i] = ci; PT.sz[i] = sz; PT.g[i] = grav; PT.add[i] = add ? 1 : 0;
}
function burst(x, y, n, ci, sp, up, add) {
  if (P.lite) n = Math.ceil(n * 0.4);
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, s = sp * (0.3 + Math.random() * 0.7);
    part(x, y, Math.cos(a) * s, Math.sin(a) * s + up, 0.4 + Math.random() * 0.4, ci, Math.random() < 0.3 ? 1 : 0.5, P.g * 0.6, add);
  }
}
function updParts(dt) {
  let j = 0;
  for (let i = 0; i < PT.n; i++) {
    const t = PT.t[i] + dt;
    if (t >= PT.life[i]) continue;
    PT.t[j] = t; PT.life[j] = PT.life[i];
    PT.vy[j] = PT.vy[i] + PT.g[i] * dt; PT.vx[j] = PT.vx[i];
    PT.x[j] = PT.x[i] + PT.vx[i] * dt; PT.y[j] = PT.y[i] + PT.vy[j] * dt;
    PT.c[j] = PT.c[i]; PT.sz[j] = PT.sz[i]; PT.g[j] = PT.g[i]; PT.add[j] = PT.add[i];
    j++;
  }
  PT.n = j;
}
// ring effects (ink rings, flashes)
function ring(x, y, r0, r1, life, col, add, lw) { G.fx.push({ x, y, r0, r1, t: 0, life, col, add, lw: lw || 0.5 }); }

// ---------- input: keys + touch zones ----------
const IN = { a: false, d: false, aAt: 0, dAt: 0 };
let clock = 0, started = false, paused = false;
function press(k) {
  if (IN[k]) return;
  IN[k] = true; IN[k + 'At'] = clock;
  if (k === 'd' && IN.a) tryDash();
  if (k === 'a' && IN.d) tryJump();
}
function release(k) { IN[k] = false; }
function resume() { if (!started) { started = true; } paused = false; try { cv.focus({ preventScroll: true }); } catch (_) {} }
addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (!started || paused) { if (['a', 'd', 's', 'w', ' ', 'enter'].includes(k) || e.key.startsWith('Arrow')) { resume(); e.preventDefault(); } return; }
  if (k === 'a' || e.key === 'ArrowLeft') { press('a'); e.preventDefault(); }
  if (k === 'd' || e.key === 'ArrowRight') { press('d'); e.preventDefault(); }
  if ((k === 's' || e.key === 'ArrowDown') && !e.repeat) { useS(); e.preventDefault(); }
  if ((k === 'w' || e.key === 'ArrowUp') && !e.repeat) { useW(); e.preventDefault(); }
});
addEventListener('keyup', e => {
  const k = e.key.toLowerCase();
  if (k === 'a' || e.key === 'ArrowLeft') release('a');
  if (k === 'd' || e.key === 'ArrowRight') release('d');
});
// zones in canvas fractions
const ZW = { x0: 0.32, x1: 0.88, y0: 0.0, y1: 0.24 };
const ZS = { x0: 0.12, x1: 0.68, y0: 0.76, y1: 1.0 };
function inZ(z, fx, fy) { return fx >= z.x0 && fx <= z.x1 && fy >= z.y0 && fy <= z.y1; }
const ptrs = new Map();
function sideCount(s) { let n = 0; for (const v of ptrs.values()) if (v === s) n++; return n; }
cv.addEventListener('pointerdown', e => {
  e.preventDefault();
  try { cv.focus({ preventScroll: true }); } catch (_) {}
  if (!started || paused) { resume(); return; }
  const r = cv.getBoundingClientRect();
  const fx = (e.clientX - r.left) / r.width, fy = (e.clientY - r.top) / r.height;
  if (inZ(ZW, fx, fy)) { useW(); return; }
  if (inZ(ZS, fx, fy)) { useS(); return; }
  const s = fx < 0.5 ? 'a' : 'd';
  ptrs.set(e.pointerId, s);
  try { cv.setPointerCapture(e.pointerId); } catch (_) {}
  press(s);
});
function ptrUp(e) {
  const s = ptrs.get(e.pointerId); if (!s) return;
  ptrs.delete(e.pointerId);
  if (!sideCount(s)) release(s);
}
cv.addEventListener('pointerup', ptrUp);
cv.addEventListener('pointercancel', ptrUp);
function lostFocus() { IN.a = IN.d = false; ptrs.clear(); if (started) paused = true; }
addEventListener('blur', lostFocus);
document.addEventListener('visibilitychange', () => { if (document.hidden) lostFocus(); });

function inputState() {
  if (IN.a && IN.d) return IN.aAt <= IN.dAt ? 'brake' : 'accel';
  if (IN.a) return 'brake';
  if (IN.d) return 'accel';
  return 'none';
}

// ---------- derived values ----------
function vNorm() { return Math.max(0, Math.min(1, (G.v - P.vMin) / (P.vMax - P.vMin))); }
function heightNorm() { return Math.max(0, Math.min(1, 1 - (ysAt(G.u, G.S) - Y_TOP) / AMP)); }
function sinTheta() { const s = slopeAt(G.u, G.S); return s / Math.hypot(1, s); }
function dashPower() {
  const vn = vNorm();
  const p = 0.5 * heightNorm() + 0.25 * Math.min(1, sinTheta() / 0.85) + 0.25 * vn;
  return Math.max(0, Math.min(1, p * (1 - 0.1 * Math.max(0, (vn - 0.6) / 0.4))));   // −10 % at very high tempo
}
function jumpImpulse() { return P.jMin + (P.jMax - P.jMin) * vNorm(); }
function onGround() { return !G.air || (ysAt(G.u, G.S) - G.y) < 2; }
function underwater() { return G.diveT > 0 && diveDepth() > 3; }
function diveDepth() { return G.diveT > 0 ? 8 * Math.sin(Math.PI * (1 - G.diveT / 0.3)) : 0; }

// ---------- actions ----------
function tryDash() {
  if (G.dashT > 0 || G.diveT > 0 || G.jumpBusy || !onGround() || G.stumble > 0.25) return;
  const p = dashPower();
  G.dashDur = G.dashT = 0.15 + 0.45 * p;
  G.dashU = 20 + 150 * p;                      // flatter: closer to the waterline
  G.v = Math.min(P.vMax * 1.15, G.v + 25 + P.dashMax * p);
  G.C.dashes++;
  burst(G.u, G.y, 6 + 10 * p, 1, 50, -30);
}
function tryJump() {
  if (G.jumpBusy || G.dashT > 0 || G.diveT > 0 || !onGround()) return;
  const J = jumpImpulse(), s = slopeAt(G.u, G.S), c = 1 / Math.hypot(1, s), sn = s * c;
  G.air = true; G.airT = 0; G.jumpBusy = true;
  G.vy -= J * c;
  G.qAir = G.q + J * sn * 0.4;
  G.C.jumps++;
  burst(G.u, G.y, 5 + J / 25, 0, 40, -60);
}

// ---------- monsters ----------
const MON = { t: { w: 9, h: 5, swim: 22 }, m: { w: 12, h: 10, swim: 0 }, u: { w: 14, h: 4, swim: 30 }, f: { w: 10, h: 6, swim: 15 } };
function newMon(type, u, mode) {
  return { type, u, off: 0, vu: 0, voff: 0, mode: mode || 'come', hp: HP[type], over: false, ph: Math.random() * 6,
    flash: 0, t: 0, x: 0, y: 0, vx: 0, vy: 0, T: 0, landU: 0, glideT: 2 + Math.random() * 4, hitV: false, rot: 0 };
}
function spawn(type, extra) { G.mons.push(newMon(type, G.camU + W + 24 + (extra || 0))); }
function spawnTick(dt) {
  const T = G.T;
  const r = (a, b) => a + Math.random() * (b - a);
  if (P.stress > 0) {
    let alive = 0;
    for (const m of G.mons) if (m.mode !== 'dead' && m.mode !== 'wash') alive++;
    let need = Math.min(40, P.stress - alive);
    while (need-- > 0) { const k = Math.random(); spawn(k < 0.4 ? 't' : k < 0.6 ? 'm' : k < 0.8 ? 'u' : 'f', r(0, 260)); }
    return;
  }
  G.spawnT -= dt * P.spawnMul; G.spawnT2 -= dt * P.spawnMul; G.spawnT3 -= dt * P.spawnMul;
  if (T < 20) return;

  txt('kills ' + kills + '   swarm ' + sw + '   monsters ' + alive, 8, 32, '#e9fbff');

  txt('parts ' + PT.n + '  shots ' + G.shots.length + '   ' + Math.floor(G.T) + ' s', W - 50, 22, '#e9fbff', 'right');
}
function drawOverlay() {
  if (started && !paused) {
    if (G.T < 14) {
      ctx.globalAlpha = Math.min(1, (14 - G.T) / 3);
      R(70, 92, 340, 44, '#00000066');
      txt('Hold D / right: faster      Hold A / left: brake & climb', W / 2, 104, '#ffffff', 'center');
      txt('Hold A + tap D: DASH (ends in a dive)   Hold D + tap A: JUMP', W / 2, 116, '#ffe36a', 'center');
      txt('S / bottom: bow wave        W / top: VOID', W / 2, 128, '#c6ff63', 'center');
      ctx.globalAlpha = 1;
    }
    return;
  }
  R(0, 0, W, H, '#00000077');
  txt(started ? 'Paused' : 'Robinson · Surf ' + VERSION, W / 2, H / 2 - 8, '#ffffff', 'center', 14);
  txt(started ? 'click / tap to continue' : 'click / tap to start', W / 2, H / 2 + 10, '#ffe36a', 'center', 10);
}

function draw() {
  ctx.setTransform(SC, 0, 0, SC, 0, 0);
  let shx = 0, shy = 0;
  if (G.shake > 0) { shx = (Math.random() - 0.5) * 4 * G.shake; shy = (Math.random() - 0.5) * 4 * G.shake; }
  drawBack();
  ctx.setTransform(SC, 0, 0, SC, shx * SC, (shy - G.camY) * SC);
  drawWave();
  drawMonsters();
  drawTrail();
  drawArc();
  drawRider();
  drawFlyers();
  drawShots();
  drawParts(0);
  drawFx(false);
  drawLip();
  if (G.dim > 0) { ctx.globalAlpha = Math.min(0.45, G.dim * 0.7); R(-10, G.camY - 10, W + 20, H + 20, '#02121a'); ctx.globalAlpha = 1; }
  ctx.globalCompositeOperation = 'lighter';
  drawFlood(); drawBolts(); drawParts(1); drawFx(true);
  ctx.globalCompositeOperation = 'source-over';
  ctx.setTransform(SC, 0, 0, SC, 0, 0);
  drawZones();
  drawHUD();
  drawOverlay();
}

// ---------- fps + log ----------
const FPS = { avg: 60, min: 60, msU: 0, msD: 0, acc: [], accU: 0, accD: 0, n: 0, t: 0 };
const LOG = { rows: [], peak: { fps: 999, at: 0, ms: 0 }, maxMs: 0 };
const LOG_COLS = ['t', 'fps_avg', 'fps_min', 'ms_update', 'ms_draw', 'mons', 'mons_surf', 'mons_under', 'mons_fly', 'mons_come', 'mons_swarm', 'mons_falling', 'parts', 'shots', 'tempo', 'height', 'steep', 'trough_y', 'air', 'input', 'kills_stamp', 'kills_splash', 'kills_dash', 'kills_jump', 'kills_dive', 'kills_s', 'kills_void', 'hits_tadpole', 'hits_mussel', 'hits_fall', 'hits_flyer', 'hits_lip', 'jumps', 'dashes', 'dives', 's_uses', 'w_uses', 'spills', 'washed', 'stamina'];
function logRow() {
  const c = { surf: 0, under: 0, fly: 0, come: 0, swarm: 0, fall: 0, all: 0 };
  for (const m of G.mons) {
    if (m.mode === 'dead' || m.mode === 'wash') continue;
    c.all++;
    if (m.type === 'u') c.under++; else if (m.type === 'f') c.fly++; else c.surf++;
    if (m.mode === 'come') c.come++; else if (m.mode === 'swarm') c.swarm++; else if (m.mode === 'spill') c.fall++;
  }
  const k = G.K, h = G.Hc, C = G.C;
  const row = [G.T.toFixed(0), FPS.avg.toFixed(1), FPS.min.toFixed(1), FPS.msU.toFixed(2), FPS.msD.toFixed(2), c.all, c.surf, c.under, c.fly, c.come, c.swarm, c.fall, PT.n, G.shots.length,
    G.v.toFixed(0), (heightNorm() * 100).toFixed(0), sinTheta().toFixed(2), (Y_TOP + AMP).toFixed(0), G.air ? 1 : 0, inputState(),
    k.stamp, k.splash, k.dash, k.jump, k.dive, k.s, k.void, h.t, h.m, h.fall, h.f, h.lip, C.jumps, C.dashes, C.dives, C.s, C.w, C.spills, C.washed, 'n/a'];
  LOG.rows.push(row.join(','));
  if (LOG.rows.length > 600) LOG.rows.shift();
  if (FPS.min < LOG.peak.fps && G.T > 3) LOG.peak = { fps: FPS.min, at: c.all, ms: FPS.msU + FPS.msD };
}
function logText() {
  const k = G.K, h = G.Hc;
  const head = [
    '# Robinson surf ' + VERSION + ' log · ' + new Date().toISOString(),
    '# ua: ' + navigator.userAgent,
    '# screen: ' + screen.width + 'x' + screen.height + ' dpr ' + (window.devicePixelRatio || 1) + ' · window ' + innerWidth + 'x' + innerHeight + ' · canvas ' + cv.width + 'x' + cv.height + ' shown ' + cv.style.width + 'x' + cv.style.height,
    '# params: ' + Object.entries(P).map(([a, b]) => a + '=' + b).join(' '),
  ];
  const sum = [
    '# summary: runtime ' + G.T.toFixed(0) + ' s · worst fps ' + LOG.peak.fps.toFixed(1) + ' at ' + LOG.peak.at + ' monsters (' + LOG.peak.ms.toFixed(1) + ' ms/frame) · longest frame ' + LOG.maxMs.toFixed(1) + ' ms',
    '# kills: stamp ' + k.stamp + ' splash ' + k.splash + ' dash ' + k.dash + ' jump ' + k.jump + ' dive ' + k.dive + ' s ' + k.s + ' void ' + k.void,
    '# hits: tadpole ' + h.t + ' mussel ' + h.m + ' fall ' + h.fall + ' flyer ' + h.f + ' lip ' + h.lip,
  ];
  return head.concat([LOG_COLS.join(',')], LOG.rows, sum).join('\n');
}
function toast(s) { const t = document.getElementById('toast'); t.textContent = s; t.style.display = 'block'; clearTimeout(toast.h); toast.h = setTimeout(() => t.style.display = 'none', 2200); }
async function copyLog() {
  const s = logText();
  try { await navigator.clipboard.writeText(s); toast('Log copied (' + LOG.rows.length + ' rows)'); }
  catch (_) { const b = document.getElementById('logBox'), ta = document.getElementById('logTxt'); ta.value = s; b.classList.add('on'); ta.focus(); ta.select(); }
}
document.getElementById('logClose').onclick = () => document.getElementById('logBox').classList.remove('on');

// ---------- loop ----------
let last = performance.now(), predT = 0;
function frame(now) {
  const raw = (now - last) / 1000; last = now;
  const dt = Math.min(0.05, raw);
  clock += dt;
  const t0 = performance.now();
  if (started && !paused) {
    update(dt);
    predT -= dt;
    if (predT <= 0) { G.pred = predictJump(); G.jumpOK = G.pred.ok; predT = 0.05; }
  }
  const t1 = performance.now();
  draw();
  const t2 = performance.now();
  if (started && !paused) {
    FPS.acc.push(raw > 0 ? 1 / raw : 60); FPS.accU += t1 - t0; FPS.accD += t2 - t1; FPS.n++; FPS.t += raw;
    LOG.maxMs = Math.max(LOG.maxMs, (t2 - t0));
    if (FPS.t >= 1) {
      FPS.avg = FPS.n / FPS.t; FPS.min = Math.min(...FPS.acc); FPS.msU = FPS.accU / FPS.n; FPS.msD = FPS.accD / FPS.n;
      FPS.acc = []; FPS.accU = FPS.accD = 0; FPS.n = 0; FPS.t = 0;
      logRow();
    }
  }
  requestAnimationFrame(frame);
}

function fit() {
  const s = Math.min(innerWidth / (W * SC), innerHeight / (H * SC));
  cv.style.width = Math.floor(W * SC * s) + 'px';
  cv.style.height = Math.floor(H * SC * s) + 'px';
}
addEventListener('resize', fit); fit();

// ---------- debug panel ----------
const dbg = document.getElementById('dbg');
document.getElementById('dbgBtn').onclick = () => dbg.classList.toggle('on');
const sl = document.getElementById('sliders');
for (const [k, mn, mx, stp] of SLIDERS) {
  const lab = document.createElement('label');
  lab.innerHTML = '<div class="row"><span>' + k + '</span><span id="v_' + k + '">' + P[k] + '</span></div>';
  const inp = document.createElement('input');
  inp.type = 'range'; inp.min = mn; inp.max = mx; inp.step = stp; inp.value = P[k];
  inp.oninput = () => { P[k] = +inp.value; document.getElementById('v_' + k).textContent = inp.value; };
  lab.appendChild(inp); sl.appendChild(lab);
}
const stressEl = document.getElementById('stress');
stressEl.oninput = () => { P.stress = +stressEl.value; document.getElementById('v_stress').textContent = P.stress || 'off'; };
document.getElementById('tLite').onchange = e => { P.lite = e.target.checked; };
document.getElementById('tFlat').onchange = e => { P.flatten = e.target.checked; };
document.getElementById('tArc').onchange = e => { P.arc = e.target.checked; };
document.getElementById('bSkip').onclick = () => { G.T += 20; };
document.getElementById('bReset').onclick = () => reset();
document.getElementById('bBurst').onclick = () => { for (let i = 0; i < 100; i++) { const k = Math.random(); spawn(k < 0.4 ? 't' : k < 0.6 ? 'm' : k < 0.8 ? 'u' : 'f', Math.random() * 300); } };
document.getElementById('bVoid').onclick = () => { G.wCharge = 1; };
document.getElementById('bLog').onclick = copyLog;
for (const id of ['dbgBtn', 'dbg', 'logBox']) document.getElementById(id).addEventListener('pointerdown', e => e.stopPropagation());
setInterval(() => {
  if (!dbg.classList.contains('on')) return;
  const p = G.pred || { maxH: 0, airtime: 0 };
  document.getElementById('dbgOut').textContent =
    'time      ' + G.T.toFixed(1) + ' s  (' + phase() + ')\n' +
    'input     ' + inputState() + '\n' +
    'tempo v   ' + G.v.toFixed(0) + '  (' + (vNorm() * 100).toFixed(0) + ' %)\n' +
    'face u    ' + G.u.toFixed(0) + '   trough y ' + (Y_TOP + AMP).toFixed(0) + '\n' +
    'height    ' + (heightNorm() * 100).toFixed(0) + ' %   steep sinθ ' + sinTheta().toFixed(2) + '\n' +
    'dash pow  ' + (dashPower() * 100).toFixed(0) + ' %\n' +
    'jump J    ' + jumpImpulse().toFixed(0) + '  apex ' + p.maxH.toFixed(1) + ' px\n' +
    'clears mussel  ' + (G.jumpOK ? 'YES' : 'no') + '\n' +
    'state     ' + (G.air ? 'air' : 'water') + (G.dashT > 0 ? ' dash' : '') + (G.diveT > 0 ? ' dive' : '') + (G.inv > 0 ? ' inv' : '') + (G.stumble > 0 ? ' stumble' : '') + '\n' +
    'S ' + (G.sCharge * 100).toFixed(0) + ' %   W ' + (G.wCharge * 100).toFixed(0) + ' %\n' +
    'spills ' + G.C.spills + '  washed ' + G.C.washed;
}, 200);

buildBG();
reset();
window.SURF = { G: () => G, P, press, release, reset, update, useS, useW, dashPower, jumpImpulse, predictJump, ysAt, logText, start: resume, FPS, PT };
requestAnimationFrame(frame);
</script>
