<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Sun Mini Prototype v003</title>
<style>
  html, body { margin: 0; padding: 0; background: #000; overflow: hidden; height: 100%; }
  canvas { display: block; }
  #note {
    position: fixed; top: 8px; left: 8px; z-index: 2;
    font-family: monospace; font-size: 11px; color: rgba(255,180,150,0.75);
    background: rgba(0,0,0,0.4); padding: 6px 10px; border-radius: 6px;
    pointer-events: none;
  }
</style>
</head>
<body>
<div id="note">sun-mini-prototype-v003 — radius = 0.25×W, center slightly down-left of screen middle<br>fps: <span id="fps">--</span></div>
<canvas id="c"></canvas>
<script>
// ================= Canvas / sizing =================
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W = 0, H = 0;
function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
  // Requested placement: radius a quarter of screen width, slightly down-left of true center.
  sunRadius = W * 0.25;
  sunCenterX = W * 0.5 - W * 0.08;
  sunCenterY = H * 0.5 + H * 0.08;
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 60));

// ================= EPOCH 2: FINISHED SUN — extracted verbatim from drift-prototype-v070.html,
// only sunRadius/sunCenterX/sunCenterY are driven by the smaller test placement above instead of
// the full-game targetSunRadiusE2/targetSunCenterXE2/targetSunCenterYE2. ==================
let sunCenterX = 0, sunCenterY = 0, sunRadius = 0;
let sunTick = 0;
let sunParticles = [];
const SUN_MAX_PARTICLES = 250;
let sunEruptionTimer = 0;
const SUN_ERUPTION_INTERVAL = 240;
let sunIsErupting = false;
let sunEruptionProgress = 0;
let sunEruptionAngle = 0;

class SunFlareParticle {
  constructor(isMajor = false) {
    this.isMajor = isMajor;
    this.reset();
    if (!isMajor) this.age = Math.random() * this.maxAge;
  }
  reset() {
    this.age = 0;
    this.swirlSeed = Math.random() * 100;
    if (this.isMajor) {
      this.baseAngle = sunEruptionAngle + (Math.random() - 0.5) * 0.5; // wider random spread around the eruption point
      this.maxAge = 100 + Math.random() * 60;
      this.maxHeight = 280 + Math.random() * 220;
      this.loopDirection = (Math.random() - 0.5) * 0.3; // much more varied arc curvature per particle
      this.size = 5 + Math.random() * 15;
      this.hue = 0 + Math.random() * 18;
    } else {
      this.baseAngle = Math.random() * Math.PI * 2; // full circle — the whole disc is visible now
      this.maxAge = 40 + Math.random() * 60;
      this.maxHeight = 25 + Math.random() * 65;
      this.loopDirection = (Math.random() - 0.5) * 2.5; // continuous random spread, not just a coin-flip direction
      this.size = 2 + Math.random() * 7;
      this.hue = 10 + Math.random() * 22;
    }
    this.angle = this.baseAngle;
    this.radius = sunRadius;
  }
  update(tick) {
    this.age++;
    const progress = this.age / this.maxAge;
    if (this.isMajor) {
      const reach = Math.sin(progress * Math.PI * 0.85) * this.maxHeight;
      this.radius = sunRadius + reach;
      this.angle = this.baseAngle + (progress * this.loopDirection) + Math.sin(tick * 0.08 + this.swirlSeed) * 0.015;
    } else {
      const archHeight = Math.sin(progress * Math.PI) * this.maxHeight;
      this.radius = sunRadius + archHeight;
      this.angle = this.baseAngle + (progress * 0.15 * this.loopDirection) + Math.cos(tick * 0.08 + this.swirlSeed) * 0.006;
    }
    if (this.age >= this.maxAge) {
      if (this.isMajor) return false;
      this.reset();
    }
    return true;
  }
  draw() {
    const progress = this.age / this.maxAge;
    const alpha = this.isMajor ? (1 - progress) * Math.sin(progress * Math.PI) : Math.sin(progress * Math.PI);
    const x = sunCenterX + Math.cos(this.angle) * this.radius;
    const y = sunCenterY + Math.sin(this.angle) * this.radius;
    if (x < -100) return;
    ctx.save();
    ctx.globalCompositeOperation = 'screen';
    const grad = ctx.createRadialGradient(x, y, 0, x, y, this.size);
    grad.addColorStop(0, this.isMajor ? `hsla(${this.hue + 35}, 100%, 92%, ${alpha})` : `hsla(${this.hue + 25}, 100%, 75%, ${alpha})`);
    grad.addColorStop(0.3, `hsla(${this.hue}, 100%, 55%, ${alpha * 0.8})`);
    grad.addColorStop(1, `hsla(0, 100%, 30%, 0)`);
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(x, y, this.size, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }
}

function initSunE2() {
  sunTick = 0;
  sunParticles = [];
  sunEruptionTimer = 0;
  sunIsErupting = false;
  for (let i = 0; i < SUN_MAX_PARTICLES; i++) sunParticles.push(new SunFlareParticle(false));
}

// ================= Domain-warp overlay for the inner disc — same generator the game uses for
// the pre-ignition cloud sphere (nebulaMakeWarpedSource / bakeSphereWarpTexture), reapplied here
// to the finished sun's own body, clipped to sunRadius so it never touches the corona. ==================
function nebulaMakeGrid(size) {
  const g = [];
  for (let y = 0; y <= size; y++) { g.push([]); for (let x = 0; x <= size; x++) g[y].push(Math.random()); }
  for (let x = 0; x <= size; x++) g[size][x] = g[0][x];
  for (let y = 0; y <= size; y++) g[y][size] = g[y][0];
  return g;
}
function nebulaSampleGrid(g, size, u, v) {
  u = u - Math.floor(u); v = v - Math.floor(v);
  const gx = u * size, gy = v * size;
  const x0 = Math.floor(gx), y0 = Math.floor(gy);
  const x1 = Math.min(size, x0 + 1), y1 = Math.min(size, y0 + 1);
  const fx = gx - x0, fy = gy - y0;
  const top = g[y0][x0] * (1 - fx) + g[y0][x1] * fx;
  const bot = g[y1][x0] * (1 - fx) + g[y1][x1] * fx;
  return top * (1 - fy) + bot * fy;
}
function nebulaMakeFbmSource(octaveSizes) {
  const grids = octaveSizes.map(nebulaMakeGrid);
  return function (u, v) {
    let sum = 0, norm = 0, amp = 1;
    for (let i = 0; i < grids.length; i++) { sum += nebulaSampleGrid(grids[i], octaveSizes[i], u, v) * amp; norm += amp; amp *= 0.5; }
    return sum / norm;
  };
}
function nebulaMakeWarpedSource(baseOctaves, warp1Octaves, warp2Octaves, warpAmount) {
  const base = nebulaMakeFbmSource(baseOctaves);
  const w1x = nebulaMakeFbmSource(warp1Octaves), w1y = nebulaMakeFbmSource(warp1Octaves.map(s => s + 3));
  const w2x = nebulaMakeFbmSource(warp2Octaves), w2y = nebulaMakeFbmSource(warp2Octaves.map(s => s + 3));
  return function (u, v) {
    const d1x = w1x(u, v), d1y = w1y(u, v);
    const u2 = u + d1x * warpAmount, v2 = v + d1y * warpAmount;
    const d2x = w2x(u2, v2), d2y = w2y(u2, v2);
    const u3 = u2 + d2x * warpAmount, v3 = v2 + d2y * warpAmount;
    const value = base(u3, v3);
    const distortion = Math.hypot(d1x, d1y) + Math.hypot(d2x, d2y);
    return { value, distortion };
  };
}
// The random NOISE GRIDS themselves are created exactly once (discWarpSource), so the underlying
// pattern stays a single continuous field. What's "dynamic" is that we keep SAMPLING that same
// field at a slowly drifting (u,v) window and re-bake the small preview texture from it every
// frame — actual flowing/morphing noise, not a static image translated across the screen.
let discWarpSource = null;
function getDiscWarpSource() {
  if (!discWarpSource) discWarpSource = nebulaMakeWarpedSource([4, 8], [2, 4], [3, 5], 0.6);
  return discWarpSource;
}
let sunWarpCanvas = null;
let sunWarpOctx = null;
let sunWarpImg = null;
function bakeDiscWarpTexture(offsetU, offsetV) {
  const size = 64;
  if (!sunWarpCanvas) {
    sunWarpCanvas = document.createElement('canvas');
    sunWarpCanvas.width = size; sunWarpCanvas.height = size;
    sunWarpOctx = sunWarpCanvas.getContext('2d');
    sunWarpImg = sunWarpOctx.createImageData(size, size);
  }
  const structureSrc = getDiscWarpSource();
  const img = sunWarpImg;
  for (let y = 0; y < size; y++) {
    for (let x = 0; x < size; x++) {
      const val = structureSrc(x / size + offsetU, y / size + offsetV).value;
      const idx = (y * size + x) * 4;
      img.data[idx] = Math.round(100 + val * 155); img.data[idx + 1] = Math.round(40 + val * 180); img.data[idx + 2] = Math.round(val * 40);
      img.data[idx + 3] = Math.round(180 + val * 75);
    }
  }
  sunWarpOctx.putImageData(img, 0, 0);
  return sunWarpCanvas;
}
let discWarpStartTime = 0;
function drawDiscWarpOverlay() {
  if (!discWarpStartTime) discWarpStartTime = performance.now();
  const t = (performance.now() - discWarpStartTime) / 1000;
  const canvasTex = bakeDiscWarpTexture(t * 0.09, t * 0.06); // re-sampled live every frame — this is the actual motion, not a translate trick
  ctx.save();
  ctx.beginPath();
  ctx.arc(sunCenterX, sunCenterY, sunRadius, 0, Math.PI * 2);
  ctx.clip(); // never touches the corona — clipped strictly to the disc itself
  const pattern = ctx.createPattern(canvasTex, 'repeat');
  const tileSize = Math.max(20, sunRadius * 0.8);
  const m = new DOMMatrix()
    .translate(sunCenterX - tileSize / 2, sunCenterY - tileSize / 2)
    .scale(tileSize / 64, tileSize / 64);
  pattern.setTransform(m);
  ctx.globalCompositeOperation = 'hard-light'; // unlike multiply (darken-only) or overlay (blind to a
                                                // maxed channel), hard-light both darkens AND lightens,
                                                // depending on whether the texture pixel is below/above
                                                // mid-gray — needed for a convincing bright/dark flicker
  ctx.globalAlpha = 0.85;
  ctx.fillStyle = pattern;
  ctx.fillRect(sunCenterX - sunRadius, sunCenterY - sunRadius, sunRadius * 2, sunRadius * 2);
  ctx.restore();
}

function drawSunSurfaceAndRimE2(tick) {
  ctx.save();
  // Corona now scales proportionally with sunRadius instead of the old fixed pixel offsets
  // (which were tuned only for the huge full-game sun and looked wrong at this smaller size).
  const corona = ctx.createRadialGradient(sunCenterX, sunCenterY, sunRadius * 0.965, sunCenterX, sunCenterY, sunRadius * 1.33);
  corona.addColorStop(0, 'rgba(255, 45, 0, 0.4)');
  corona.addColorStop(0.25, 'rgba(180, 15, 0, 0.18)');
  corona.addColorStop(0.7, 'rgba(60, 2, 0, 0.03)');
  corona.addColorStop(1, 'rgba(0, 0, 0, 0)');
  ctx.fillStyle = corona;
  ctx.beginPath();
  ctx.arc(sunCenterX, sunCenterY, sunRadius * 1.33, 0, Math.PI * 2);
  ctx.fill();

  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = '#1c0200';
  ctx.beginPath();
  ctx.arc(sunCenterX, sunCenterY, sunRadius, 0, Math.PI * 2);
  ctx.fill();

  const numCells = 120; // full circle now visible, not just the narrow left-facing sliver the full-size sun shows
  const startAngle = 0, endAngle = Math.PI * 2;
  for (let i = 0; i < numCells; i++) {
    const anglePercent = i / numCells;
    const currentAngle = startAngle + (endAngle - startAngle) * anglePercent;
    const cellWave = Math.sin(tick * 0.07 + i * 1.5) * 5;
    const cellShiftX = Math.cos(tick * 0.03 + i) * 5;
    let intensityModifier = 1;
    if (sunIsErupting) {
      intensityModifier = 1.2 + Math.sin(tick * 0.35 + i) * 0.9 * (1 - sunEruptionProgress);
    } else if (sunEruptionTimer > SUN_ERUPTION_INTERVAL * 0.75) {
      const premonitionScale = (sunEruptionTimer - SUN_ERUPTION_INTERVAL * 0.75) / (SUN_ERUPTION_INTERVAL * 0.25);
      intensityModifier = 1 + Math.sin(tick * 0.18 + i) * 0.5 * premonitionScale;
    }
    const cellRadius = sunRadius - 8 + (cellWave * intensityModifier);
    const cellX = sunCenterX + Math.cos(currentAngle) * cellRadius + cellShiftX;
    const cellY = sunCenterY + Math.sin(currentAngle) * cellRadius;
    const cellGrad = ctx.createRadialGradient(cellX, cellY, 1, cellX, cellY, 70 * intensityModifier);
    if (sunIsErupting && Math.abs(currentAngle - sunEruptionAngle) < 0.22) {
      cellGrad.addColorStop(0, '#ffffff');
      cellGrad.addColorStop(0.25, '#ffdf42');
    } else {
      cellGrad.addColorStop(0, '#ffe552');
      cellGrad.addColorStop(0.45, '#ff3700');
    }
    cellGrad.addColorStop(0.85, 'rgba(107, 3, 0, 0.35)');
    cellGrad.addColorStop(1, 'rgba(28, 2, 0, 0)');
    ctx.globalCompositeOperation = 'screen';
    ctx.fillStyle = cellGrad;
    ctx.beginPath();
    ctx.arc(cellX, cellY, 80 * intensityModifier, 0, Math.PI * 2);
    ctx.fill();
  }

  ctx.globalCompositeOperation = 'source-over';
  const bodyGrad = ctx.createRadialGradient(sunCenterX, sunCenterY, sunRadius * 0.96, sunCenterX, sunCenterY, sunRadius);
  bodyGrad.addColorStop(0, '#ffcc00');
  bodyGrad.addColorStop(0.4, '#e62e00');
  bodyGrad.addColorStop(0.88, '#730000');
  bodyGrad.addColorStop(1, '#1a0100');
  ctx.fillStyle = bodyGrad;
  ctx.beginPath();
  ctx.arc(sunCenterX, sunCenterY, sunRadius, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  drawDiscWarpOverlay(); // layered on top, clipped to just the disc — never the corona or flare cells
}

function updateAndDrawSunE2() {
  ctx.fillStyle = 'rgba(3, 1, 0, 0.25)';
  ctx.fillRect(0, 0, W, H);
  sunTick++;
  if (!sunIsErupting) {
    sunEruptionTimer++;
    if (sunEruptionTimer >= SUN_ERUPTION_INTERVAL) {
      sunIsErupting = true;
      sunEruptionProgress = 0;
      sunEruptionAngle = Math.random() * Math.PI * 2; // full circle — the whole disc is visible now
    }
  } else {
    sunEruptionProgress += 0.01;
    if (sunEruptionProgress < 0.75) {
      for (let k = 0; k < 5; k++) sunParticles.push(new SunFlareParticle(true));
    }
    if (sunEruptionProgress >= 1) { sunIsErupting = false; sunEruptionTimer = 0; }
  }
  for (let i = sunParticles.length - 1; i >= 0; i--) {
    const active = sunParticles[i].update(sunTick);
    if (!active) sunParticles.splice(i, 1);
    else sunParticles[i].draw();
  }
  drawSunSurfaceAndRimE2(sunTick);
}

// ================= FPS counter =================
const fpsEl = document.getElementById('fps');
let fpsFrames = 0, fpsLastTime = performance.now();
function updateFps() {
  fpsFrames++;
  const now = performance.now();
  if (now - fpsLastTime >= 500) { // refresh twice a second, steadier reading than every single frame
    fpsEl.textContent = Math.round(fpsFrames * 1000 / (now - fpsLastTime));
    fpsFrames = 0;
    fpsLastTime = now;
  }
}

// ================= boot =================
resize();
initSunE2();
function loop() {
  updateAndDrawSunE2();
  updateFps();
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
