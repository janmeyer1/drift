<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vertical Solar Rim & Flare Eruption</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #030100;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        canvas {
            background: #000;
        }
    </style>
</head>
<body>

<canvas id="solarCanvas"></canvas>

<script>
const canvas = document.getElementById('solarCanvas');
const ctx = canvas.getContext('2d');

// Setup full screen scaling
function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

// Position the Sun off-screen to the right to create a vertical rim profile
let centerX = canvas.width * 2.3;
let centerY = canvas.height / 2;
let sunRadius = canvas.width * 1.5;

// Recalculate positioning dynamic bounds dynamically on window resize
window.addEventListener('resize', () => {
    centerX = canvas.width * 2.3;
    centerY = canvas.height / 2;
    sunRadius = canvas.width * 1.5;
});

const standardParticles = [];
const majorArchParticles = [];
const maxStandard = 200;

// Eruption State Machine variables
let eruptionTimer = 0;
const eruptionInterval = 240; // Every ~4 seconds at 60 FPS
let isErupting = false;
let eruptionProgress = 0;
let eruptionAngle = Math.PI; // Pointing straight left into space

// --- VORTEX & FLARE PARTICLES ---
class SolarParticle {
    constructor(isMajor = false) {
        this.isMajor = isMajor;
        this.reset();
        if(!isMajor) this.age = Math.random() * this.maxAge;
    }

    reset() {
        this.age = 0;
        
        if (this.isMajor) {
            // Target the center-left path of the active zone
            this.baseAngle = eruptionAngle + (Math.random() - 0.5) * 0.15;
            this.maxAge = 90 + Math.random() * 50;
            this.maxHeight = 250 + Math.random() * 200; // Deep space arm stretch
            this.loopDirection = (Math.random() - 0.5) * 0.05; // Less loop, more trajectory blast
            this.size = 4 + Math.random() * 16;
            this.hue = 0 + Math.random() * 20; // Blazing red-orange to white core
        } else {
            // Standard continuous background rim turbulence (Pi = left side of right-bound sun)
            this.baseAngle = Math.PI + (Math.random() - 0.5) * 0.6; 
            this.maxAge = 40 + Math.random() * 60;
            this.maxHeight = 20 + Math.random() * 70;
            this.loopDirection = Math.random() > 0.5 ? 1 : -1;
            this.size = 2 + Math.random() * 8;
            this.hue = 10 + Math.random() * 25;
        }
        
        this.angle = this.baseAngle;
        this.radius = sunRadius;
        this.swirlSeed = Math.random() * 100;
    }

    update(tick) {
        this.age++;
        const progress = this.age / this.maxAge;

        if (this.isMajor) {
            // Core logic for the giant fiery arm breaking into space
            // Erupts far outward, then rapidly dissolves/burns out instead of cleanly returning
            const reach = Math.sin(progress * Math.PI * 0.8) * this.maxHeight; 
            this.radius = sunRadius + reach;
            this.angle = this.baseAngle + (progress * this.loopDirection) + Math.sin(tick * 0.1 + this.swirlSeed) * 0.01;
        } else {
            // Standard small churning looping magnetic vortex loops
            const archHeight = Math.sin(progress * Math.PI) * this.maxHeight;
            this.radius = sunRadius + archHeight;
            this.angle = this.baseAngle + (progress * 0.05 * this.loopDirection) + Math.cos(tick * 0.1 + this.swirlSeed) * 0.005;
        }

        if (this.age >= this.maxAge) {
            if (this.isMajor) {
                // Major arch particles kill themselves off permanently once burned out
                return false; 
            }
            this.reset();
        }
        return true;
    }

    draw() {
        const progress = this.age / this.maxAge;
        const alpha = this.isMajor ? (1 - progress) * Math.sin(progress * Math.PI) : Math.sin(progress * Math.PI);

        const x = centerX + Math.cos(this.angle) * this.radius;
        const y = centerY + Math.sin(this.angle) * this.radius;

        ctx.save();
        ctx.globalCompositeOperation = 'screen';
        
        const grad = ctx.createRadialGradient(x, y, 0, x, y, this.size);
        // Major bursts get an intense blinding ultra-white center core
        grad.addColorStop(0, this.isMajor ? `hsla(${this.hue + 30}, 100%, 90%, ${alpha})` : `hsla(${this.hue + 25}, 100%, 75%, ${alpha})`);
        grad.addColorStop(0.3, `hsla(${this.hue}, 100%, 55%, ${alpha * 0.8})`);
        grad.addColorStop(1, `hsla(0, 100%, 30%, 0)`);

        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(x, y, this.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
    }
}

// Initialize standard continuous background particles
for (let i = 0; i < maxStandard; i++) {
    standardParticles.push(new SolarParticle(false));
}

// --- MAIN RENDER FUNCTION ---
function drawSunSurfaceAndRim(tick) {
    ctx.save();

    // 1. Base Corona Glow leaking into the black space background
    const corona = ctx.createRadialGradient(centerX, centerY, sunRadius - 20, centerX, centerY, sunRadius + 300);
    corona.addColorStop(0, 'rgba(255, 50, 0, 0.35)');
    corona.addColorStop(0.3, 'rgba(200, 20, 0, 0.15)');
    corona.addColorStop(1, 'rgba(0, 0, 0, 0)');
    ctx.fillStyle = corona;
    ctx.beginPath();
    ctx.arc(centerX, centerY, sunRadius + 300, 0, Math.PI * 2);
    ctx.fill();

    // 2. High-Contrast Border Convection Cells 
    // We layer moving geometric paths along the perimeter to simulate boiling plasma blocks without pixel array loops
    ctx.globalCompositeOperation = 'source-over';
    
    // Base solid background layer of the inner sun
    ctx.fillStyle = '#1c0200';
    ctx.beginPath();
    ctx.arc(centerX, centerY, sunRadius, 0, Math.PI * 2);
    ctx.fill();

    // Generate localized convection granules near the active edge segment
    const numCells = 24;
    const startAngle = Math.PI - 0.4;
    const endAngle = Math.PI + 0.4;

    for (let i = 0; i < numCells; i++) {
        const anglePercent = i / numCells;
        const currentAngle = startAngle + (endAngle - startAngle) * anglePercent;
        
        // Calculate dynamic boiling offset frequencies
        const cellWave = Math.sin(tick * 0.08 + i * 1.7) * 4;
        const cellShiftX = Math.cos(tick * 0.04 + i) * 6;
        
        // Intensify contrast calculations dramatically if an eruption is actively building or occurring
        let intensityModifier = 1;
        if (isErupting) {
            // High frequency distortion shaking during major eruptions
            intensityModifier = 1 + Math.sin(tick * 0.3 + i) * 0.8 * (1 - eruptionProgress);
        } else if (eruptionTimer > eruptionInterval * 0.75) {
            // Premonition glow stage: begin churning violently right before the blast drops
            const premonitionScale = (eruptionTimer - eruptionInterval * 0.75) / (eruptionInterval * 0.25);
            intensityModifier = 1 + Math.sin(tick * 0.15 + i) * 0.4 * premonitionScale;
        }

        const cellRadius = sunRadius - 5 + (cellWave * intensityModifier);
        const cellX = centerX + Math.cos(currentAngle) * cellRadius + cellShiftX;
        const cellY = centerY + Math.sin(currentAngle) * cellRadius;

        // Draw overlapping high-contrast thermal plasma cells
        const cellGrad = ctx.createRadialGradient(cellX, cellY, 2, cellX, cellY, 60 * intensityModifier);
        
        if (isErupting && Math.abs(currentAngle - eruptionAngle) < 0.2) {
            // White-hot plasma core generation at immediate base of blast site
            cellGrad.addColorStop(0, '#ffffff');
            cellGrad.addColorStop(0.3, '#ffcc00');
        } else {
            cellGrad.addColorStop(0, '#fff275'); // Bright convective hot spot upwellings
            cellGrad.addColorStop(0.4, '#ff4500'); // Sinking cooler orange plasma filaments
        }
        cellGrad.addColorStop(0.8, '#7a0700');
        cellGrad.addColorStop(1, 'rgba(28, 2, 0, 0)');

        ctx.globalCompositeOperation = 'screen';
        ctx.fillStyle = cellGrad;
        ctx.beginPath();
        ctx.arc(cellX, cellY, 70 * intensityModifier, 0, Math.PI * 2);
        ctx.fill();
    }

    // 3. Flat low-detail inner sun center mask to clean up interior overlap lines safely
    ctx.globalCompositeOperation = 'source-over';
    const bodyGrad = ctx.createRadialGradient(centerX, centerY, sunRadius * 0.94, centerX, centerY, sunRadius);
    bodyGrad.addColorStop(0, '#ffd000');
    bodyGrad.addColorStop(0.5, '#e63900');
    bodyGrad.addColorStop(0.9, '#800000');
    bodyGrad.addColorStop(1, '#1f0200'); // Deep dark cooling perimeter boundary line

    ctx.fillStyle = bodyGrad;
    ctx.beginPath();
    ctx.arc(centerX, centerY, sunRadius, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
}

// --- ANIMATION LOOP ---
let tick = 0;
function animate() {
    // Clear viewport frame leaving dynamic transparency speed paths behind
    ctx.fillStyle = 'rgba(3, 1, 0, 0.22)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    tick++;

    // Managing eruption life-cycles
    if (!isErupting) {
        eruptionTimer++;
        if (eruptionTimer >= eruptionInterval) {
            isErupting = true;
            eruptionProgress = 0;
            // Target slightly random spots along the visible central left rim profile
            eruptionAngle = Math.PI + (Math.random() - 0.5) * 0.3; 
        }
    } else {
        eruptionProgress += 0.012; // Controls overall duration of the arm stretch
