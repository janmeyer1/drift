<!-- Solar Arc & Flare Simulator v12 -->
<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solar Rim v12 - Pure Grafik ohne Audio</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #030100;
        }
        canvas {
            display: block;
            background: #000;
            width: 100vw;
            height: 100vh;
        }
    </style>
</head>
<body>

<canvas id="solarCanvas"></canvas>

<script>
const canvas = document.getElementById('solarCanvas');
const ctx = canvas.getContext('2d');

// --- GEOMETRIE & POSITIONIERUNG ---
let centerX, centerY, sunRadius;

function resize() {
    const w = window.innerWidth || document.documentElement.clientWidth;
    const h = window.innerHeight || document.documentElement.clientHeight;
    
    canvas.width = w;
    canvas.height = h;
    
    // Radius orientiert sich starr an der Fensterhöhe
    sunRadius = h * 1.2; 
    
    // Positioniert das Kreissegment so, dass es exakt 100px von rechts hereinragt
    centerX = w + sunRadius - 100; 
    centerY = h / 2;
}
resize();
window.addEventListener('resize', resize);
window.addEventListener('load', resize);

// --- PARTIKEL SYSTEM VARIABLEN ---
const standardParticles = []; 
const flareParticles = [];  
const maxStandard = 180;       

// Eruptions-Zeiten für seltene große Arme
let globalEruptionTimer = 0;
const globalEruptionInterval = 960; 
let isGlobalErupting = false;
let globalEruptionProgress = 0;
let globalEruptionAngle = Math.PI;

class SolarParticle {
    constructor(type) {
        this.type = type; 
        this.reset();
        if(type === 'standard') this.age = Math.random() * this.maxAge;
    }

    reset() {
        this.age = 0;
        this.swirlSeed = Math.random() * 100;

        if (this.type === 'global') {
            // Großer, seltener Ausbruch gerade nach links
            this.baseAngle = globalEruptionAngle + (Math.random() - 0.5) * 0.12;
            this.maxAge = 120;
            this.maxHeight = 350 + Math.random() * 150; 
            this.gravityPull = 0.85; 
            this.loopDirection = (Math.random() - 0.5) * 0.02;
            this.size = 6 + Math.random() * 10;        
            this.hue = 0 + Math.random() * 15;          
        } 
        else if (this.type === 'local') {
            // Lokale Flares: Kleiner und stark gekrümmt zurück zur Oberfläche
            this.baseAngle = Math.PI + (Math.random() - 0.5) * 0.5;
            this.maxAge = 60;
            this.maxHeight = 40 + Math.random() * 40; 
            this.gravityPull = 1.5; // Hoher Exponent zwingt Partikel schnell in die Kurve
            this.loopDirection = (Math.random() > 0.5 ? 1 : -1) * 0.15; // Starker Seitendrift
            this.size = 2 + Math.random() * 4;
            this.hue = 14 + Math.random() * 18;
        } 
        else {
            // Standard Micro-Brodeln direkt an der Kante
            this.baseAngle = Math.PI + (Math.random() - 0.5) * 0.7; 
            this.maxAge = 40;
            this.maxHeight = 15 + Math.random() * 25;   
            this.gravityPull = 1.0;
            this.loopDirection = Math.random() > 0.5 ? 1 : -1; 
            this.size = 1.5 + Math.random() * 3;
            this.hue = 12 + Math.random() * 18;         
        }
        
        this.angle = this.baseAngle;
        this.radius = sunRadius;
    }

    update(tick) {
        this.age++;
        const progress = this.age / this.maxAge; 

        // Saubere mathematische Parabel ohne Risiko von NaN-Werten
        const archHeight = Math.sin(Math.pow(progress, this.gravityPull) * Math.PI) * this.maxHeight;
        this.radius = sunRadius + archHeight;
        this.angle = this.baseAngle + (progress * this.loopDirection) + Math.sin(tick * 0.08 + this.swirlSeed) * 0.006;

        if (this.age >= this.maxAge) {
            if (this.type === 'global' || this.type === 'local') return false; 
            this.reset(); 
        }
        return true;
    }

    draw() {
        const progress = this.age / this.maxAge;
        const alpha = Math.sin(progress * Math.PI);

        const x = centerX + Math.cos(this.angle) * this.radius;
        const y = centerY + Math.sin(this.angle) * this.radius;

        // Optimierung: Zeichnen abbrechen, wenn weit außerhalb des Bildschirms
        if (x < -100 || x > canvas.width + 100) return;

        ctx.save();
        ctx.globalCompositeOperation = 'screen';
        
        const grad = ctx.createRadialGradient(x, y, 0, x, y, this.size);
        grad.addColorStop(0, this.type === 'global' ? `hsla(${this.hue + 35}, 100%, 94%, ${alpha})` : `hsla(${this.hue + 22}, 100%, 75%, ${alpha})`);
        grad.addColorStop(0.3, `hsla(${this.hue}, 100%, 55%, ${alpha * 0.8})`);
        grad.addColorStop(1, `hsla(0, 100%, 30%, 0)`);

        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(x, y, this.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
    }
}

// Basis-Pool initialisieren
for (let i = 0; i < maxStandard; i++) {
    standardParticles.push(new SolarParticle('standard'));
}

// --- RENDER-FUNKTION FÜR STRUKTUR & BILD-MASKE ---
function drawSunSurfaceAndRim(tick) {
    ctx.save();

    // 1. Hintergrund-Korona (Weiches Glühen)
    const corona = ctx.createRadialGradient(centerX, centerY, sunRadius - 40, centerX, centerY, sunRadius + 350);
    corona.addColorStop(0, 'rgba(255, 45, 0, 0.35)');
    corona.addColorStop(0.3, 'rgba(160, 10, 0, 0.15)');
    corona.addColorStop(1, 'rgba(0, 0, 0, 0)');
    ctx.fillStyle = corona;
    ctx.beginPath();
    ctx.arc(centerX, centerY, sunRadius + 350, 0, Math.PI * 2);
    ctx.fill();

    // 2. Kochende Zellen am Rand (Granulation)
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = '#1c0200'; 
    ctx.beginPath();
    ctx.arc(centerX, centerY, sunRadius, 0, Math.PI * 2);
    ctx.fill();

    const numCells = 26; 
    const startAngle = Math.PI - 0.5;
    const endAngle = Math.PI + 0.5;

    for (let i = 0; i < numCells; i++) {
        const anglePercent = i / numCells;
        const currentAngle = startAngle + (endAngle - startAngle) * anglePercent;
        
        const cellWave = Math.sin(tick * 0.07 + i * 1.5) * 5;
        const cellShiftX = Math.cos(tick * 0.03 + i) * 5;
        
        let intensityModifier = 1;
        if (isGlobalErupting) {
            intensityModifier = 1.3 + Math.sin(tick * 0.35 + i) * 0.8 * (1 - globalEruptionProgress);
        } else if (globalEruptionTimer > globalEruptionInterval * 0.85) {
            const premonitionScale = (globalEruptionTimer - globalEruptionInterval * 0.85) / (globalEruptionInterval * 0.15);
            intensityModifier = 1 + Math.sin(tick * 0.2 + i) * 0.6 * premonitionScale;
        }

        const cellRadius = sunRadius - 8 + (cellWave * intensityModifier);
        const cellX = centerX + Math.cos(currentAngle) * cellRadius + cellShiftX;
        const cellY = centerY + Math.sin(currentAngle) * cellRadius;

        const cellGrad = ctx.createRadialGradient(cellX, cellY, 1, cellX, cellY, 70 * intensityModifier);
        
        if (isGlobalErupting && Math.abs(currentAngle - globalEruptionAngle) < 0.22) {
            cellGrad.addColorStop(0, '#ffffff'); 
            cellGrad.addColorStop(0.25, '#ffcf33');
        } else {
            cellGrad.addColorStop(0, '#ffe552'); 
            cellGrad.addColorStop(0.45, '#ff3700'); 
        }
        cellGrad.addColorStop(0.85, 'rgba(107, 3, 0, 0.35)'); 
        cellGrad.addColorStop(1, 'rgba(28, 2, 0, 0)');

        ctx.globalCompositeOperation = 'screen';
        ctx.fillStyle = cellGrad;
        ctx.beginPath();
        ctx.arc(cellX, cellY, 80 * intensityModifier, 0, Math.PI * 2);
        ctx.fill();
    }

    // 3. Glatte innere Abdeckung (Verdeckt Hilfslinien im Kern)
    ctx.globalCompositeOperation = 'source-over';
    const bodyGrad = ctx.createRadialGradient(centerX, centerY, sunRadius * 0.96, centerX, centerY, sunRadius);
    bodyGrad.addColorStop(0, '#ffbc00');
    bodyGrad.addColorStop(0.4, '#e62a00');
    bodyGrad.addColorStop(0.88, '#730000');
    bodyGrad.addColorStop(1, '#1a0100'); 

    ctx.fillStyle = bodyGrad;
    ctx.beginPath();
    ctx.arc(centerX, centerY, sunRadius, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
}

// --- HAUPT-ANIMATIONSLOOP ---
let tick = 0;
function animate() {
    ctx.fillStyle = 'rgba(3, 1, 0, 0.25)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    tick++;

    // Timer für seltene Mega-Eruptionen
    if (!isGlobalErupting) {
        globalEruptionTimer++;
        if (globalEruptionTimer >= globalEruptionInterval) {
            isGlobalErupting = true;
            globalEruptionProgress = 0;
            globalEruptionAngle = Math.PI + (Math.random() - 0.5) * 0.35; 
        }
    } else {
        globalEruptionProgress += 0.008; 
        if (globalEruptionProgress < 0.7) {
            for (let k = 0; k < 4; k++) {
                flareParticles.push(new SolarParticle('global'));
            }
        }
        if (globalEruptionProgress >= 1) {
            isGlobalErupting = false;
            globalEruptionTimer = 0;
        }
    }

    // Intervall für regelmäßige kleine, stark gekrümmte lokale Flares
    if (Math.random() < 0.015) {
        const spawnCount = Math.random() < 0.35 ? 2 : 1; 

        for(let s = 0; s < spawnCount; s++) {
            const randomAngleOffset = Math.PI + (Math.random() - 0.5) * 0.5;
            for (let k = 0; k < 35; k++) {
                const p = new SolarParticle('local');
                p.baseAngle = randomAngleOffset + (Math.random() - 0.5) * 0.05; 
                flareParticles.push(p);
            }
        }
    }

    // Standard-Hintergrund zeichnen
    standardParticles.forEach(p => {
        p.update(tick);
        p.draw();
    });

    // Flares updaten und zeichnen
