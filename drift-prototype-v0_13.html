<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Drift — Epoch I Prototype v0.10</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    overflow: hidden;
    overscroll-behavior: none;
    background: #05070d;
    height: 100%;
    width: 100%;
    position: fixed;
    touch-action: none;
  }
  canvas {
    display: block;
    touch-action: none;
  }
  #hud {
    position: fixed;
    top: 12px;
    left: 12px;
    color: rgba(180, 200, 255, 0.6);
    font-family: -apple-system, sans-serif;
    font-size: 12px;
    line-height: 1.6;
    pointer-events: none;
    z-index: 5;
  }
  #hud b { color: rgba(220, 230, 255, 0.9); }
  #echoRow {
    display: none;
    color: rgba(255, 220, 150, 0.85);
  }
  #echoRow b { color: rgba(255, 230, 170, 1); }
  #combo {
    position: fixed;
    top: 12px;
    right: 16px;
    color: rgba(190, 255, 210, 0.85);
    font-family: -apple-system, sans-serif;
    font-size: 28px;
    font-weight: 300;
    text-align: right;
    pointer-events: none;
    z-index: 5;
    transition: opacity 0.3s ease;
  }
  #combo small {
    display: block;
    font-size: 11px;
    color: rgba(180, 200, 255, 0.5);
    font-weight: 400;
  }
  #combo.maxed #comboVal { color: rgba(255, 220, 150, 0.95); }
  #startOverlay {
    position: fixed;
    inset: 0;
    background: #05070d;
    z-index: 10;
    transition: opacity 0.8s ease;
  }
  #startPulse {
    position: absolute;
    left: 50%;
    top: 34%;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: rgba(180, 200, 255, 0.8);
    box-shadow: 0 0 14px 4px rgba(150, 180, 255, 0.4);
    animation: startPulse 3s ease-in-out infinite;
  }
  @keyframes startPulse {
    0%, 100% { opacity: 0.25; transform: translate(-50%, -50%) scale(0.85); }
    50% { opacity: 0.9; transform: translate(-50%, -50%) scale(1.15); }
  }
  #startTagline {
    position: absolute;
    left: 50%;
    top: 54%;
    transform: translate(-50%, -50%);
    color: rgba(190, 205, 255, 0.45);
    font-family: -apple-system, sans-serif;
    font-size: 13px;
    font-style: italic;
    letter-spacing: 0.03em;
    white-space: nowrap;
  }
  #startOverlay span:not(#startTagline) {
    position: absolute;
    right: 20px;
    bottom: 34px;
    color: rgba(200, 215, 255, 0.55);
    font-family: -apple-system, sans-serif;
    font-size: 13px;
    letter-spacing: 0.05em;
    animation: pulse 2.4s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 0.35; }
    50% { opacity: 0.85; }
  }
  .fullOverlay {
    position: fixed;
    inset: 0;
    background: rgba(5,7,13,0.96);
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 16px;
    z-index: 20;
    text-align: center;
    font-family: -apple-system, sans-serif;
    color: rgba(255, 230, 180, 0.95);
    padding: 24px;
    box-sizing: border-box;
  }
  .fullOverlay.visible { display: flex; }
  #quipText {
    color: rgba(200,210,255,0.7);
    font-size: 13px;
    max-width: 280px;
    font-style: italic;
  }
  #epochCard {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,220,150,0.3);
    border-radius: 16px;
    padding: 20px 28px;
    display: flex;
    flex-direction: column;
    gap: 4px;
    -webkit-tap-highlight-color: transparent;
  }
  #epochCard b { font-size: 18px; font-weight: 400; }
  #epochCard small { color: rgba(200,210,255,0.5); }
  .overlayNavRow {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    height: 64px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    background: linear-gradient(to top, rgba(5,7,13,0.92), rgba(5,7,13,0.55));
  }
  .navBtn {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 12px;
    padding: 8px 18px;
    font-size: 13px;
    color: rgba(230,235,255,0.9);
    -webkit-tap-highlight-color: transparent;
  }
  #echoShopScreen h2 { font-weight: 300; font-size: 18px; margin: 0 0 4px; }
  #echoShopBalance {
    color: rgba(255, 220, 150, 0.85);
    font-size: 13px;
    margin-bottom: 4px;
  }
  #echoShopBalance b { color: rgba(255, 230, 170, 1); }
  #echoShopList {
    display: flex;
    flex-direction: column;
    gap: 10px;
    width: 100%;
    max-width: 320px;
    max-height: 50vh;
    overflow-y: auto;
  }
  .echoItem {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 12px;
    padding: 10px 14px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 13px;
    color: rgba(230,235,255,0.9);
    text-align: left;
  }
  .echoItem small { display: block; color: rgba(200,210,255,0.5); font-size: 11px; }
  .echoItem .price { color: rgba(255,220,150,0.9); font-size: 13px; }
  .echoItem.owned { opacity: 0.5; }
  #boostBanner {
    position: fixed;
    top: 76px;
    right: 16px;
    color: rgba(255, 190, 120, 0.95);
    font-family: -apple-system, sans-serif;
    font-size: 13px;
    text-align: right;
    pointer-events: none;
    z-index: 5;
    display: none;
  }

  /* ============ BOTTOM UPGRADE ROW ============ */
  #upgradeRow {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    height: 64px;
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 8px;
    padding: 0 14px;
    background: linear-gradient(to top, rgba(5,7,13,0.92), rgba(5,7,13,0.55));
    z-index: 6;
    box-sizing: border-box;
    font-family: -apple-system, sans-serif;
  }
  #spawnBtn, #levelBtn {
    display: flex;
    align-items: center;
    gap: 7px;
    height: 48px;
    box-sizing: border-box;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 12px;
    padding: 0 11px;
    color: rgba(230, 235, 255, 0.9);
    font-family: inherit;
    font-size: 12px;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    transition: transform 0.15s ease, border-color 0.2s ease;
  }
  #spawnBtn:active, #levelBtn:active { transform: scale(0.96); }
  #spawnBtn.affordable, #levelBtn.affordable { border-color: rgba(190,255,210,0.5); }
  #levelBtn { display: none; border-color: rgba(150,200,255,0.25); }
  #spawnSwatch {
    width: 16px; height: 16px;
    border-radius: 50%;
    flex-shrink: 0;
    box-shadow: 0 0 10px 2px currentColor;
  }
  #levelSwatch {
    width: 16px;
    flex-shrink: 0;
    font-size: 15px;
    line-height: 1;
    text-align: center;
  }
  #spawnText b, #levelText b { color: #fff; }
  #spawnText small, #levelText small {
    display: block;
    color: rgba(200,210,255,0.5);
    font-size: 10px;
  }
  #spawnOwned {
    display: grid;
    grid-template-rows: repeat(4, 1fr);
    grid-auto-flow: column;
    gap: 2px;
    height: 28px;
  }
  #spawnOwned .sq {
    width: 6px; height: 6px;
    border-radius: 1px;
  }
  #abortBtn {
    display: none; /* shown only after the first playthrough completes */
    width: 40px;
    height: 48px;
    box-sizing: border-box;
    align-items: center;
    justify-content: center;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 12px;
    font-size: 16px;
    color: rgba(230, 235, 255, 0.6);
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }
  #abortBtn.holding { border-color: rgba(255,150,150,0.6); color: rgba(255,200,200,0.9); }
  #abortProgress {
    display: none;
    position: fixed;
    left: 0; right: 0; bottom: 64px;
    height: 3px;
    background: rgba(255,120,120,0.7);
    width: 0%;
    z-index: 7;
  }
  #abortWarning {
    display: none;
    position: fixed;
    left: 0; right: 0; bottom: 78px;
    text-align: center;
    font-family: -apple-system, sans-serif;
    font-size: 22px;
    font-weight: 700;
    letter-spacing: 0.04em;
    color: rgba(255, 70, 70, 0.95);
    text-shadow: 0 0 12px rgba(255, 50, 50, 0.6);
    z-index: 7;
    pointer-events: none;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <div>score: <b id="score">0</b></div>
  <div id="echoRow">echo: <b id="echoVal">0</b></div>
  <div id="hint">swipe back and forth to hit quarks in rhythm</div>
</div>
<div id="combo"><span id="comboVal">×1</span><small id="comboLabel">rhythm</small></div>
<div id="boostBanner"></div>
<div id="startOverlay"><div id="startPulse"></div><span id="startTagline">Quiet hands. Reach of a god.</span><span>tap to begin</span></div>

<div id="epochScreen" class="fullOverlay">
  <div id="quipText"></div>
  <div id="epochCard">
    <b>Epoch I</b>
    <small>Elementary particles &rarr; Atoms</small>
  </div>
  <div class="overlayNavRow">
    <div class="navBtn" id="navEpochsBtn">Epochs</div>
    <div class="navBtn" id="navEchoShopBtn">Echo Shop</div>
  </div>
</div>

<div id="echoShopScreen" class="fullOverlay">
  <h2>Echo Shop</h2>
  <div id="echoShopBalance">echo: <b id="echoShopBalanceVal">0</b></div>
  <div id="echoShopList"></div>
  <div class="overlayNavRow">
    <div class="navBtn" id="echoShopBackBtn">Back</div>
  </div>
</div>

<div id="upgradeRow">
  <div id="abortBtn" title="Hold to abandon this run">&#9209;</div>
  <div id="levelBtn">
    <div id="levelSwatch"></div>
    <div id="levelText">
      <b id="levelName">—</b>
      <small id="levelCost">—</small>
    </div>
  </div>
  <div id="spawnBtn">
    <div id="spawnOwned"></div>
    <div id="spawnSwatch"></div>
    <div id="spawnText">
      <b id="spawnName">—</b>
      <small id="spawnCost">—</small>
    </div>
  </div>
</div>
<div id="abortProgress"></div>
<div id="abortWarning">ABANDON RUN?</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H;
function resize() {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

// ================= SPAWN CATALOG (the "Spawn-Button", far right) =================
// Nothing spawns until the first purchase — every entry (including Neutron/Proton/Electron)
// follows the exact same buy pattern now. The first purchase (Up Quark) costs 0 — just a tap.
const SPAWN_CATALOG = [
  { name: 'Up Quark',      kind: 'quark', hue: 355 },
  { name: 'Down Quark',    kind: 'quark', hue: 45  },
  { name: 'Charm Quark',   kind: 'quark', hue: 300 },
  { name: 'Strange Quark', kind: 'quark', hue: 150 },
  { name: 'Top Quark',     kind: 'quark', hue: 195 },
  { name: 'Bottom Quark',  kind: 'quark', hue: 250 },
  { name: 'Neutron',       kind: 'unlock', flag: 'neutron' },
  { name: 'Proton',        kind: 'unlock', flag: 'proton', costMultiplier: 1.5 },
  { name: 'Electron',      kind: 'unlock', flag: 'electron', costMultiplier: 1.5 },
  { name: 'Double red quarks', kind: 'unlock', flag: 'doubleRed' }
];
const SPAWN_BASE_COST = 20;
const SPAWN_GROWTH = 2.4;

let spawnLevel = 0; // number of purchases made so far — 0 means nothing unlocked yet
let unlockedNeutron = false;
let unlockedProton = false;
let unlockedElectron = false;
let doubleRedSpawn = false;

function unlockedQuarkHues() {
  const n = Math.min(spawnLevel, 6);
  return SPAWN_CATALOG.slice(0, n).map(c => c.hue);
}
function spawnPurchaseCost(i) {
  if (i === 0) return 0;
  const base = SPAWN_BASE_COST * Math.pow(SPAWN_GROWTH, i - 1);
  const mult = SPAWN_CATALOG[i].costMultiplier || 1;
  return Math.round(base * mult);
}
function nextSpawnUpgrade() {
  if (spawnLevel >= SPAWN_CATALOG.length) return { maxed: true };
  const entry = SPAWN_CATALOG[spawnLevel];
  const cost = spawnPurchaseCost(spawnLevel);
  return { entry, cost, maxed: false };
}
function swatchColorFor(entry) {
  if (entry.kind === 'quark') return `hsl(${entry.hue}, 90%, 65%)`;
  if (entry.flag === 'neutron') return 'hsl(48, 55%, 85%)';
  if (entry.flag === 'proton') return 'hsl(0, 85%, 55%)';
  if (entry.flag === 'electron') return 'hsl(200, 40%, 90%)';
  if (entry.flag === 'doubleRed') return 'hsl(355, 90%, 60%)';
  return '#fff';
}

const spawnBtn = document.getElementById('spawnBtn');
const spawnOwned = document.getElementById('spawnOwned');
const spawnSwatch = document.getElementById('spawnSwatch');
const spawnName = document.getElementById('spawnName');
const spawnCost = document.getElementById('spawnCost');

function refreshSpawnUI() {
  // small squares: one per already-owned quark color (kind:'quark' entries only)
  spawnOwned.innerHTML = '';
  for (let i = 0; i < Math.min(spawnLevel, 6); i++) {
    const sq = document.createElement('div');
    sq.className = 'sq';
    sq.style.background = `hsl(${SPAWN_CATALOG[i].hue}, 90%, 65%)`;
    spawnOwned.appendChild(sq);
  }
  const nxt = nextSpawnUpgrade();
  if (nxt.maxed) {
    const last = SPAWN_CATALOG[SPAWN_CATALOG.length - 1];
    spawnName.textContent = '✓';
    spawnCost.textContent = '';
    const col = swatchColorFor(last);
    spawnSwatch.style.color = col;
    spawnSwatch.style.background = col;
    spawnBtn.classList.remove('affordable');
    return;
  }
  spawnName.textContent = nxt.entry.name;
  spawnCost.textContent = nxt.cost === 0 ? 'frei' : String(nxt.cost);
  const col = swatchColorFor(nxt.entry);
  spawnSwatch.style.color = col;
  spawnSwatch.style.background = col;
  spawnBtn.classList.toggle('affordable', score >= nxt.cost);
}

function buySpawnUpgrade() {
  const nxt = nextSpawnUpgrade();
  if (nxt.maxed || score < nxt.cost) return;
  score -= nxt.cost;
  const entry = SPAWN_CATALOG[spawnLevel];
  if (entry.flag === 'neutron') unlockedNeutron = true;
  if (entry.flag === 'proton') unlockedProton = true;
  if (entry.flag === 'electron') unlockedElectron = true;
  if (entry.flag === 'doubleRed') doubleRedSpawn = true;
  spawnLevel += 1;
  document.getElementById('score').textContent = score;
  refreshSpawnUI();
  updateSpawnRate();
}
spawnBtn.addEventListener('pointerdown', (e) => { e.stopPropagation(); buySpawnUpgrade(); });

// ================= LEVEL UPGRADES (the "Level-Button", left of Spawn-Button) =================
// These are epoch-1-specific: either tied directly to this epoch's physics (stability), or
// something a player needs to be able to buy on their very first run, before any Echo exists
// (x8 manual value) — so they can't live in the Echo-Shop. Universal skill upgrades that reward
// repeat play (Color-Combo, Autopilot-Bonus) moved to the Echo-Shop instead.
// Visible as soon as Neutron is bought. Entry 2 (stability) is greyed out until the first Echo.
const LEVEL_BASE_COST = Math.round(SPAWN_BASE_COST * Math.pow(SPAWN_GROWTH, 6)); // ~3823
const LEVEL_GROWTH = SPAWN_GROWTH;
const LEVEL_UPGRADES = [
  { name: 'x8 manual score',   flag: 'manualMultiplier', icon: '\u26A1', needsEcho: false },
  { name: 'Stability +50%',    flag: 'stability',        icon: '\u{1F6E1}', needsEcho: true },
  { name: 'Finish epoch',      flag: 'finishLevel',      icon: '\u{1F3C1}', needsEcho: false }
];
let levelIndex = 0;
let boughtManualMultiplier = false;
let boughtStability = false;

const levelBtn = document.getElementById('levelBtn');
const levelSwatch = document.getElementById('levelSwatch');
const levelName = document.getElementById('levelName');
const levelCost = document.getElementById('levelCost');

function levelUpgradeCost(i) {
  return Math.round(LEVEL_BASE_COST * Math.pow(LEVEL_GROWTH, i));
}

function refreshLevelUI() {
  if (!unlockedNeutron) { levelBtn.style.display = 'none'; return; }
  levelBtn.style.display = 'flex';
  if (levelIndex >= LEVEL_UPGRADES.length) {
    levelName.textContent = '\u2713';
    levelCost.textContent = '';
    levelBtn.classList.remove('affordable');
    return;
  }
  const nxt = LEVEL_UPGRADES[levelIndex];
  const locked = nxt.needsEcho && echo <= 0;
  const cost = levelUpgradeCost(levelIndex);
  levelName.textContent = locked ? nxt.name + ' \u{1F512}' : nxt.name;
  levelCost.textContent = String(cost);
  levelSwatch.textContent = nxt.icon;
  levelBtn.classList.toggle('affordable', !locked && score >= cost);
}

function buyLevelUpgrade() {
  if (levelIndex >= LEVEL_UPGRADES.length) return;
  const nxt = LEVEL_UPGRADES[levelIndex];
  if (nxt.needsEcho && echo <= 0) return; // locked until first echo
  const cost = levelUpgradeCost(levelIndex);
  if (score < cost) return;
  score -= cost;
  if (nxt.flag === 'manualMultiplier') boughtManualMultiplier = true;
  if (nxt.flag === 'stability') {
    boughtStability = true;
    // makes bonding EASIER, not harder — raises the disturbance a bond can absorb before breaking
    DISTURB_BREAK_FORM *= 1.5;
    DISTURB_BREAK_STABLE_BASE *= 1.5;
  }
  if (nxt.flag === 'finishLevel') {
    showEpochScreen();
  }
  levelIndex += 1;
  document.getElementById('score').textContent = score;
  refreshLevelUI();
  refreshSpawnUI();
}
levelBtn.addEventListener('pointerdown', (e) => { e.stopPropagation(); buyLevelUpgrade(); });

// ================= PHYSICS CONSTANTS =================
const FRICTION = 0.995;
const QUADRATIC_DRAG_K = 0.006; // extra speed-squared braking — barely touches normal speeds, strongly reins in post-vortex/shockwave spikes
function applyQuadraticDrag(p) {
  const speed = Math.hypot(p.vx, p.vy);
  if (speed > 0.01) {
    const dragFactor = 1 / (1 + QUADRATIC_DRAG_K * speed);
    p.vx *= dragFactor;
    p.vy *= dragFactor;
  }
}
const SPAWN_ORIGIN = { x: 0.08, y: 0.10 };
const HIT_RADIUS = 26;
const AUTOPILOT_HIT_RADIUS = HIT_RADIUS * 1.3; // 30% more forgiving than manual — testing whether this is the real fix for autopilot's weaker hit rate

function attractor() {
  return { x: W * 0.25, y: H + 40 };
}
const GRAVITY_STRENGTH = 0.045;

const QUARK_RADIUS_MIN = 2.4;
const QUARK_RADIUS_VAR = 1.2;
const NUCLEON_RADIUS = 8.5;
const ELECTRON_RADIUS = 1.6;
const ATOM_RADIUS = 11;

const BOND_RADIUS = 14;
const GRID_CELL = 40;
const REPEL_RADIUS = 30;
const REPEL_STRENGTH = 0.15;
const CAPTURE_RADIUS = 26;
const ELECTRON_ORBIT_RADIUS = 10;
const DISTURB_RADIUS = 55;
let DISTURB_BREAK_FORM = 3;             // halved from the original 6 — rare to stabilize unassisted
let DISTURB_BREAK_STABLE_BASE = 6;      // >= 2x the formation threshold, per design
const STABLE_MS = 4000;
const SPAWN_PROTECT_MS = 300;           // freshly spawned quarks can't bond for this long
const DUO_ORBIT_RADIUS = 6;
const HEAVY_GRAVITY_FACTOR = 0.35; // shared by duo-pairs and nucleons — both sink slowly and at the same rate

const SPAWN_INTERVAL_BASE = 1400;
const SPAWN_INTERVAL_MIN = 320;
let spawnTimer = null;

function currentSpawnInterval() {
  const interval = SPAWN_INTERVAL_BASE * Math.pow(0.82, spawnLevel);
  return Math.max(SPAWN_INTERVAL_MIN, interval);
}
function currentSpawnCount() {
  return 1 + Math.floor(spawnLevel / 3);
}
function updateSpawnRate() {
  if (spawnTimer) clearInterval(spawnTimer);
  spawnTimer = setInterval(spawnBatch, currentSpawnInterval());
}
function spawnBatch() {
  if (unlockedQuarkHues().length === 0) return; // nothing bought yet — nothing spawns
  const n = currentSpawnCount();
  for (let i = 0; i < n; i++) {
    if (unlockedElectron && Math.random() < 0.2) spawnElectron();
    else spawnQuark();
  }
}

let particles = [];
let duoLinks = []; // {qa, qb, x, y, vx, vy, angle, u, d} — the visible rotating quark-pair stage
let score = 0;
let echo = 0;

function updateEchoDisplay() {
  const row = document.getElementById('echoRow');
  row.style.display = 'block';
  document.getElementById('echoVal').textContent = echo;
  refreshLevelUI();
}

function makeQuarkParticle(forcedFlavor) {
  const angle = (Math.random() * 70 + 10) * (Math.PI / 180);
  const speed = 3.5 + Math.random() * 2.5;
  const hues = unlockedQuarkHues();
  let idx, flavor;
  if (forcedFlavor === 'up') {
    idx = 0; flavor = 'up';
  } else {
    idx = Math.floor(Math.random() * hues.length);
    flavor = idx === 0 ? 'up' : idx === 1 ? 'down' : 'exotic';
  }
  // freshly-unlocked color spawns slightly larger on average — subtle, not an obvious max-size tell
  const isNewest = idx === Math.min(spawnLevel, 6) - 1;
  const sizeRoll = isNewest ? Math.pow(Math.random(), 0.6) : Math.random();
  return {
    kind: 'quark',
    flavor,
    colorIndex: idx,
    x: W * SPAWN_ORIGIN.x,
    y: H * SPAWN_ORIGIN.y,
    vx: Math.cos(angle) * speed,
    vy: Math.sin(angle) * speed,
    radius: QUARK_RADIUS_MIN + sizeRoll * QUARK_RADIUS_VAR,
    hue: hues[idx] + (Math.random() * 10 - 5),
    wasNear: false,
    bonded: false,
    duoLink: null,
    spawnT: performance.now(),
    popAt: null
  };
}

function spawnQuark() {
  const p = makeQuarkParticle(null);
  particles.push(p);
  if (doubleRedSpawn && p.flavor === 'up') {
    particles.push(makeQuarkParticle('up')); // "doppelte rote Quarks" — every Up-quark spawn doubles up
  }
}

function spawnElectron() {
  const angle = (Math.random() * 70 + 10) * (Math.PI / 180);
  const speed = 3 + Math.random() * 2;
  particles.push({
    kind: 'electron',
    x: W * SPAWN_ORIGIN.x,
    y: H * SPAWN_ORIGIN.y,
    vx: Math.cos(angle) * speed,
    vy: Math.sin(angle) * speed,
    radius: ELECTRON_RADIUS,
    hue: 200,
    boundTo: null,
    orbitPhase: Math.random() * Math.PI * 2,
    popAt: null
  });
}

function spawnNucleon(type, x, y, vx, vy) {
  // random momentum on formation — some drift upward and stay visible longer instead of sinking right away
  const kickAngle = Math.random() * Math.PI * 2;
  const kickStrength = 1 + Math.random() * 2.5;
  const kickVx = vx + Math.cos(kickAngle) * kickStrength;
  const kickVy = vy + Math.sin(kickAngle) * kickStrength - kickStrength * 0.6; // biased upward
  particles.push({
    kind: 'nucleon',
    nucleonType: type,
    x, y, vx: kickVx, vy: kickVy,
    radius: NUCLEON_RADIUS,
    boundElectron: null,
    bondTimer: 0,
    disturbance: 0,
    stableAtom: false,
    wasNear: false,
    popAt: null
  });
}

// ================= FLOOR / PILE (granular-ish physics — atoms fall, collide, and settle; settled ones still creep) =================
function barrierY() { return H - 8; }

function updateAtomPhysics() {
  const attr = attractor();
  const atoms = particles.filter(p => p.kind === 'atom' && p.popAt === null);
  for (const a of atoms) {
    const ax = attr.x - a.x, ay = attr.y - a.y, dist = Math.hypot(ax, ay) || 1;
    const pull = a.settled ? GRAVITY_STRENGTH * 0.05 : GRAVITY_STRENGTH * 0.4;
    a.vx += (ax / dist) * pull;
    a.vy += (ay / dist) * pull;
    const damp = a.settled ? 0.7 : 0.99;
    a.vx *= damp; a.vy *= damp;
    a.x += a.vx; a.y += a.vy;
  }
  for (let iter = 0; iter < 3; iter++) {
    for (const a of atoms) {
      if (a.y + a.radius > barrierY()) { a.y = barrierY() - a.radius; a.vy = 0; }
    }
    for (let i = 0; i < atoms.length; i++) {
      for (let j = i + 1; j < atoms.length; j++) {
        const A = atoms[i], B = atoms[j];
        const dx = B.x - A.x, dy = B.y - A.y, d = Math.hypot(dx, dy) || 0.01;
        const minD = A.radius + B.radius;
        if (d < minD) {
          const overlap = (minD - d) / 2;
          const nx = dx / d, ny = dy / d;
          A.x -= nx * overlap; A.y -= ny * overlap;
          B.x += nx * overlap; B.y += ny * overlap;
        }
      }
    }
  }
  for (const a of atoms) {
    const onFloor = a.y + a.radius >= barrierY() - 0.5;
    const supported = onFloor || atoms.some(b => b !== a && b.settled &&
      Math.hypot(a.x - b.x, a.y - b.y) <= a.radius + b.radius + 1.5 && b.y < a.y);
    if (supported && Math.hypot(a.vx, a.vy) < 0.3) a.settled = true;
  }
}

function pileDepthOf(a, atoms) {
  let count = 0;
  for (const b of atoms) {
    if (b === a) continue;
    if (Math.abs(b.x - a.x) < (a.radius + b.radius) * 1.5 && b.y < a.y) count++;
  }
  return count;
}

// ================= QUARK BONDING → VISIBLE ROTATING DUO (grid-accelerated, pure perf optimization) =================
function buildQuarkGrid() {
  const grid = new Map();
  const now = performance.now();
  for (let i = 0; i < particles.length; i++) {
    const p = particles[i];
    if (p.kind !== 'quark' || p.popAt !== null || p.bonded || p.flavor === 'exotic') continue;
    if (now - p.spawnT < SPAWN_PROTECT_MS) continue;
    const cx = Math.floor(p.x / GRID_CELL), cy = Math.floor(p.y / GRID_CELL);
    const key = cx + ',' + cy;
    if (!grid.has(key)) grid.set(key, []);
    grid.get(key).push(i);
  }
  return grid;
}
function gridNeighbors(grid, p) {
  const cx = Math.floor(p.x / GRID_CELL), cy = Math.floor(p.y / GRID_CELL);
  const result = [];
  for (let dx = -1; dx <= 1; dx++) {
    for (let dy = -1; dy <= 1; dy++) {
      const key = (cx + dx) + ',' + (cy + dy);
      if (grid.has(key)) result.push(...grid.get(key));
    }
  }
  return result;
}

function processQuarkBonding() {
  if (!(unlockedNeutron || unlockedProton)) return;
  const now = performance.now();
  const grid = buildQuarkGrid();
  for (let i = 0; i < particles.length; i++) {
    const p = particles[i];
    if (p.kind !== 'quark' || p.popAt !== null || p.bonded || p.flavor === 'exotic') continue;
    if (now - p.spawnT < SPAWN_PROTECT_MS) continue;
    const neighborIdxs = gridNeighbors(grid, p);
    for (const j of neighborIdxs) {
      if (j <= i) continue;
      const q = particles[j];
      if (q.kind !== 'quark' || q.popAt !== null || q.bonded || q.flavor === 'exotic') continue;
      if (now - q.spawnT < SPAWN_PROTECT_MS) continue;
      const d = Math.hypot(p.x - q.x, p.y - q.y);
      if (d < BOND_RADIUS) {
        p.bonded = true; q.bonded = true;
        const link = {
          qa: p, qb: q,
          x: (p.x + q.x) / 2, y: (p.y + q.y) / 2,
          vx: (p.vx + q.vx) / 2, vy: (p.vy + q.vy) / 2,
          angle: Math.random() * Math.PI * 2,
          u: (p.flavor === 'up' ? 1 : 0) + (q.flavor === 'up' ? 1 : 0),
          d: (p.flavor === 'down' ? 1 : 0) + (q.flavor === 'down' ? 1 : 0)
        };
        p.duoLink = link; q.duoLink = link;
        duoLinks.push(link);
        break;
      }
    }
  }
}

function updateDuoLinks() {
  const attr = attractor();
  for (const link of duoLinks) {
    const ax = attr.x - link.x, ay = attr.y - link.y, dist = Math.hypot(ax, ay) || 1;
    link.vx += (ax / dist) * GRAVITY_STRENGTH * HEAVY_GRAVITY_FACTOR;
    link.vy += (ay / dist) * GRAVITY_STRENGTH * HEAVY_GRAVITY_FACTOR;
    link.vx *= FRICTION; link.vy *= FRICTION;
    applyQuadraticDrag(link);
    link.x += link.vx; link.y += link.vy;
    link.angle += 0.15;
    link.qa.x = link.x + Math.cos(link.angle) * DUO_ORBIT_RADIUS;
    link.qa.y = link.y + Math.sin(link.angle) * DUO_ORBIT_RADIUS;
    link.qa.vx = link.vx; link.qa.vy = link.vy;
    link.qb.x = link.x - Math.cos(link.angle) * DUO_ORBIT_RADIUS;
    link.qb.y = link.y - Math.sin(link.angle) * DUO_ORBIT_RADIUS;
    link.qb.vx = link.vx; link.qb.vy = link.vy;
  }
}

function processTrioCompletion() {
  if (!(unlockedNeutron || unlockedProton)) return;
  const now = performance.now();
  for (let li = duoLinks.length - 1; li >= 0; li--) {
    const link = duoLinks[li];
    for (const q of particles) {
      if (q.kind !== 'quark' || q.popAt !== null || q.bonded || q.flavor === 'exotic') continue;
      if (now - q.spawnT < SPAWN_PROTECT_MS) continue;
      const d = Math.hypot(link.x - q.x, link.y - q.y);
      if (d < BOND_RADIUS) {
        const u = link.u + (q.flavor === 'up' ? 1 : 0);
        const dd = link.d + (q.flavor === 'down' ? 1 : 0);
        let finalized = null;
        if (u === 2 && dd === 1 && unlockedProton) finalized = 'proton';
        else if (u === 1 && dd === 2 && unlockedNeutron) finalized = 'neutron';
        if (finalized) {
          q.bonded = true; q.popAt = now;
          link.qa.popAt = now; link.qb.popAt = now;
          spawnNucleon(finalized, link.x, link.y, link.vx, link.vy);
          duoLinks.splice(li, 1);
        } else {
          const dx = q.x - link.x, dy = q.y - link.y, dist = Math.hypot(dx, dy) || 1;
          q.vx += (dx / dist) * 1.5; q.vy += (dy / dist) * 1.5;
        }
        break;
      }
    }
  }
}

// ================= PROTON REPULSION =================
function applyProtonRepulsion() {
  const protons = particles.filter(p => p.kind === 'nucleon' && p.nucleonType === 'proton' && p.popAt === null);
  for (let i = 0; i < protons.length; i++) {
    for (let j = i + 1; j < protons.length; j++) {
      const a = protons[i], b = protons[j];
      const dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy) || 1;
      if (d < REPEL_RADIUS) {
        const f = (1 - d / REPEL_RADIUS) * REPEL_STRENGTH;
        a.vx -= (dx / d) * f; a.vy -= (dy / d) * f;
        b.vx += (dx / d) * f; b.vy += (dy / d) * f;
      }
    }
  }
}

// ================= ELECTRON CAPTURE =================
function processElectronCapture() {
  for (const e of particles) {
    if (e.kind !== 'electron' || e.popAt !== null || e.boundTo) continue;
    let nearest = null, nearestD = CAPTURE_RADIUS;
    for (const p of particles) {
      if (p.kind !== 'nucleon' || p.nucleonType !== 'proton' || p.popAt !== null || p.boundElectron) continue;
      const d = Math.hypot(p.x - e.x, p.y - e.y);
      if (d < nearestD) { nearest = p; nearestD = d; }
    }
    if (nearest) {
      nearest.boundElectron = e;
      e.boundTo = nearest;
      nearest.bondTimer = 0;
      nearest.disturbance = 0;
      nearest.stableAtom = false;
      spawnCaptureSpark(nearest.x, nearest.y);
    }
  }
}

// ================= ATOM STABILITY / DECAY (lightweight disturbance abstraction) =================
function processAtomStability(dtMs) {
  // forming bonds (proton + electron, not yet stable)
  for (const p of particles) {
    if (p.kind !== 'nucleon' || p.nucleonType !== 'proton' || !p.boundElectron || p.stableAtom || p.popAt !== null) continue;
    p.disturbance *= 0.95;
    for (const q of particles) {
      if (q.kind !== 'quark' || q.popAt !== null) continue;
      const d = Math.hypot(p.x - q.x, p.y - q.y);
      if (d < DISTURB_RADIUS) {
        const speed = Math.hypot(q.vx, q.vy);
        p.disturbance += speed * 0.06 * (1 - d / DISTURB_RADIUS);
      }
    }
    if (p.disturbance > DISTURB_BREAK_FORM) {
      const e = p.boundElectron;
      if (e) { e.boundTo = null; e.vx += (Math.random() - 0.5) * 3; e.vy += (Math.random() - 0.5) * 3; }
      p.boundElectron = null;
      p.bondTimer = 0;
      p.disturbance = 0;
      continue;
    }
    p.bondTimer += dtMs;
    if (p.bondTimer >= STABLE_MS) finalizeAtom(p);
  }

  // already-stable atoms can also decay, at a much higher (and pile-depth-scaled) threshold
  const atoms = particles.filter(a => a.kind === 'atom' && a.popAt === null);
  for (const a of atoms) {
    a.disturbance = (a.disturbance || 0) * 0.95;
    for (const q of particles) {
      if (q.kind !== 'quark' || q.popAt !== null) continue;
      const d = Math.hypot(a.x - q.x, a.y - q.y);
      if (d < DISTURB_RADIUS) {
        const speed = Math.hypot(q.vx, q.vy);
        a.disturbance += speed * 0.06 * (1 - d / DISTURB_RADIUS);
      }
    }
    const depth = pileDepthOf(a, atoms);
    const threshold = DISTURB_BREAK_STABLE_BASE * (1 + depth * 0.25);
    if (a.disturbance > threshold) {
      a.popAt = performance.now();
      a.decaying = true;
      echo = Math.max(0, echo - 1);
      updateEchoDisplay();
      spawnDecayExplosion(a.x, a.y);
      applyShockwave(a.x, a.y, 90, 5);
    }
  }
}

function finalizeAtom(p) {
  p.stableAtom = true;
  p.kind = 'atom';
  p.radius = ATOM_RADIUS;
  if (p.boundElectron) p.boundElectron.popAt = performance.now();
  p.boundElectron = null;
  p.settled = false;
  p.disturbance = 0;
  // stays at its current position and falls/settles into the pile naturally — no teleport
  echo += 1;
  updateEchoDisplay();
  spawnStabilizeFlash(p.x, p.y);
}

// ================= SHOCKWAVE + DEBRIS (dramatic decay) =================
function applyShockwave(x, y, radius, strength) {
  for (const p of particles) {
    if (p.popAt !== null) continue;
    if (p.kind !== 'quark' && p.kind !== 'atom' && p.kind !== 'nucleon' && p.kind !== 'electron') continue;
    const dx = p.x - x, dy = p.y - y, dist = Math.hypot(dx, dy) || 1;
    if (dist > radius) continue;
    const push = (1 - dist / radius) * strength;
    p.vx += (dx / dist) * push;
    p.vy += (dy / dist) * push;
    if (p.kind === 'atom') p.settled = false; // knocked loose from the pile if nearby
  }
}

let debris = [];
function spawnDebris(x, y, count) {
  for (let i = 0; i < count; i++) {
    const ang = Math.random() * Math.PI * 2;
    const speed = 2 + Math.random() * 4;
    debris.push({ x, y, vx: Math.cos(ang) * speed, vy: Math.sin(ang) * speed, born: performance.now(), life: 500 + Math.random() * 300 });
  }
}
function updateAndDrawDebris() {
  const now = performance.now();
  debris = debris.filter(d => now - d.born < d.life);
  for (const d of debris) {
    d.x += d.vx; d.y += d.vy;
    d.vx *= 0.94; d.vy *= 0.94;
    const t = (now - d.born) / d.life;
    ctx.beginPath();
    ctx.fillStyle = `hsla(15, 90%, 60%, ${1 - t})`;
    ctx.arc(d.x, d.y, 1.8 * (1 - t) + 0.5, 0, Math.PI * 2);
    ctx.fill();
  }
}

// ================= FLASH / EXPLOSION ANIMATIONS =================
let flashes = [];
function spawnCaptureSpark(x, y) { flashes.push({ x, y, born: performance.now(), life: 260, kind: 'capture' }); }
function spawnStabilizeFlash(x, y) { flashes.push({ x, y, born: performance.now(), life: 550, kind: 'stabilize' }); }
function spawnDecayExplosion(x, y) {
  flashes.push({ x, y, born: performance.now(), life: 650, kind: 'decay' });
  spawnDebris(x, y, 10);
}

function drawFlashes() {
  const now = performance.now();
  flashes = flashes.filter(f => now - f.born < f.life);
  for (const f of flashes) {
    const t = (now - f.born) / f.life;
    if (f.kind === 'capture') {
      ctx.beginPath();
      ctx.strokeStyle = `hsla(200, 80%, 80%, ${1 - t})`;
      ctx.lineWidth = 1.5;
      ctx.arc(f.x, f.y, 4 + t * 14, 0, Math.PI * 2);
      ctx.stroke();
    } else if (f.kind === 'stabilize') {
      ctx.beginPath();
      ctx.strokeStyle = `hsla(45, 90%, 85%, ${(1 - t) * 0.9})`;
      ctx.lineWidth = 2;
      ctx.arc(f.x, f.y, 6 + t * 26, 0, Math.PI * 2);
      ctx.stroke();
      const spikes = 6;
      for (let i = 0; i < spikes; i++) {
        const ang = (i / spikes) * Math.PI * 2 + t * 2;
        const r1 = 8 + t * 10, r2 = 8 + t * 30;
        ctx.beginPath();
        ctx.moveTo(f.x + Math.cos(ang) * r1, f.y + Math.sin(ang) * r1);
        ctx.lineTo(f.x + Math.cos(ang) * r2, f.y + Math.sin(ang) * r2);
        ctx.strokeStyle = `hsla(45, 95%, 80%, ${(1 - t) * 0.8})`;
        ctx.stroke();
      }
    } else if (f.kind === 'decay') {
      // dramatic: brief white core flash, then a bigger, longer double shockwave ring; real debris drawn separately
      if (t < 0.15) {
        const flashT = t / 0.15;
        ctx.beginPath();
        ctx.fillStyle = `hsla(40, 100%, 95%, ${1 - flashT})`;
        ctx.arc(f.x, f.y, 20 * (1 - flashT) + 8, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.beginPath();
      ctx.strokeStyle = `hsla(10, 90%, 60%, ${(1 - t) * 0.9})`;
      ctx.lineWidth = 3;
      ctx.arc(f.x, f.y, 8 + t * 70, 0, Math.PI * 2);
      ctx.stroke();
      ctx.beginPath();
      ctx.strokeStyle = `hsla(30, 95%, 65%, ${(1 - t) * 0.5})`;
      ctx.lineWidth = 1.5;
      ctx.arc(f.x, f.y, 8 + t * 45, 0, Math.PI * 2);
      ctx.stroke();
    }
  }
}

// ================= MAIN PHYSICS UPDATE =================
function update(dtMs) {
  const attr = attractor();
  for (const p of particles) {
    if (p.popAt !== null) continue;
    if (p.kind === 'atom') continue;              // handled by updateAtomPhysics
    if (p.kind === 'quark' && p.bonded && p.duoLink) continue; // handled by updateDuoLinks

    if (p.kind === 'electron' && p.boundTo) {
      if (p.boundTo.popAt !== null || !particles.includes(p.boundTo)) {
        p.boundTo = null;
      } else {
        p.orbitPhase += 0.12;
        p.x = p.boundTo.x + Math.cos(p.orbitPhase) * ELECTRON_ORBIT_RADIUS;
        p.y = p.boundTo.y + Math.sin(p.orbitPhase) * ELECTRON_ORBIT_RADIUS;
        continue;
      }
    }

    const heavy = p.kind === 'nucleon';
    const ax = attr.x - p.x, ay = attr.y - p.y, dist = Math.hypot(ax, ay) || 1;
    const gStrength = GRAVITY_STRENGTH * (heavy ? HEAVY_GRAVITY_FACTOR : 1);
    p.vx += (ax / dist) * gStrength;
    p.vy += (ay / dist) * gStrength;
    const fr = heavy ? FRICTION * 0.995 : FRICTION;
    p.vx *= fr; p.vy *= fr;
    applyQuadraticDrag(p);
    p.x += p.vx; p.y += p.vy;
  }

  updateDuoLinks();
  applyProtonRepulsion();
  processQuarkBonding();
  processTrioCompletion();
  processElectronCapture();
  processAtomStability(dtMs);
  updateAtomPhysics();

  // clean up any duo links that drifted off-screen (both quarks pop together)
  const now = performance.now();
  duoLinks = duoLinks.filter(link => {
    const offscreen = link.x < -60 || link.x > W + 60 || link.y > H + 60;
    const stale = link.qa.popAt !== null || link.qb.popAt !== null;
    if (offscreen && !stale) {
      link.qa.popAt = now; link.qb.popAt = now;
      return false;
    }
    return !stale;
  });

  particles = particles.filter(p => {
    if (p.popAt !== null) return performance.now() - p.popAt < 260;
    if (p.kind === 'atom') return true;
    if (p.bonded && p.duoLink) return true; // lifecycle governed by duoLinks cleanup above
    return p.x < W + 50 && p.y < H + 50 && p.x > -50;
  });
}

// ================= VORTEX WAKE (swirl missed particles like tracing through water) =================
// Recent swipe positions form a short-lived trail of vortex sources (300ms, exponential decay) instead
// of a single instantaneous point — sharp direction reversals leave genuine counter-rotating wake
// structure behind, the way a real wake trails a moving object. No extra randomness: purely derived
// from the actual recorded motion.
//
// The rotation sense depends on swipe direction: each history entry carries a movement direction
// (dirX, dirY). A particle's side of that movement line (via 2D cross product) determines which way
// it spins — a real wake is a counter-rotating PAIR straddling the direction of travel, not a single
// fixed-handed swirl. Reversing the swipe flips every particle's side, so the whole wake flips with it.
//
// v0.11 force mix (isolated here — revert to v0.10's version if this doesn't feel right):
//   - tangential: curls the path into the actual spiral/hook shape
//   - outward fling: particles get flung AWAY from the swipe trail, not sucked toward it
//   - forward entrainment: a push along the actual direction of travel, like water being dragged along
// Only the time-decay of the history (not a constant force) is what stops the curl from becoming an
// endless orbit — a constant tangential pull would just produce a stable circular orbit instead.
//
// v0.12: removed the particle-to-particle secondary wake coupling that was here (buildMobileGrid +
// neighbor loop) — it rebuilt a grid over ALL mobile particles on every single call, including every
// autopilot frame (60/sec), for a marginal visual effect. Testing whether this was also quietly
// degrading autopilot's hit accuracy by nudging particles just outside the blindly-replayed path.
// Tangential weight raised and the decay window lengthened so the curl actually reads as a curl.
const VORTEX_RADIUS = 90;
const VORTEX_STRENGTH = 0.9;
const VORTEX_WAKE_MS = 300;
const VORTEX_WAKE_DECAY_TAU = 200; // ms — lengthened from 120 so the curl has time to actually form
const VORTEX_TANGENT_WEIGHT = 1.6;   // curl strength — raised from 1.0
const VORTEX_OUTWARD_WEIGHT = 0.3;   // flings particles away from the trail
const VORTEX_ENTRAIN_WEIGHT = 0.45;  // pushes particles along the swipe's actual direction of travel

let vortexHistory = []; // { x, y, strength, t, dirX, dirY }

function isMobileForWake(p) {
  if (p.popAt !== null || p.kind === 'atom') return false;
  if (p.kind === 'electron' && p.boundTo) return false;
  if (p.kind === 'quark' && p.bonded) return false;
  return true;
}

function applyVortex(x, y, moveSpeed, dirX, dirY) {
  if (moveSpeed < 0.5) return;
  const strength = Math.min(moveSpeed * VORTEX_STRENGTH * 0.05, 2.2);
  const now = performance.now();
  vortexHistory.push({ x, y, strength, t: now, dirX: dirX || 0, dirY: dirY || 0 });
  vortexHistory = vortexHistory.filter(v => now - v.t < VORTEX_WAKE_MS);

  for (const p of particles) {
    if (!isMobileForWake(p)) continue;
    let sumTx = 0, sumTy = 0;
    for (const v of vortexHistory) {
      const dx = p.x - v.x, dy = p.y - v.y;
      const dist = Math.hypot(dx, dy);
      if (dist < 1 || dist > VORTEX_RADIUS) continue;
      const age = now - v.t;
      const decay = Math.exp(-age / VORTEX_WAKE_DECAY_TAU);
      const falloff = 1 - dist / VORTEX_RADIUS;
      // which side of the movement line is this particle on? Determines rotation sense —
      // this is what makes reversing the swipe direction flip the whole wake structure.
      const cross = v.dirX * dy - v.dirY * dx;
      const side = cross >= 0 ? 1 : -1;
      const tx = side * (-dy / dist), ty = side * (dx / dist); // tangential — the curl
      const ox = dx / dist, oy = dy / dist;                     // outward — away from the trail
      const kindFactor = p.kind === 'nucleon' ? 0.4 : 1;
      const f = v.strength * falloff * decay * kindFactor;
      sumTx += (tx * VORTEX_TANGENT_WEIGHT + ox * VORTEX_OUTWARD_WEIGHT + v.dirX * VORTEX_ENTRAIN_WEIGHT) * f;
      sumTy += (ty * VORTEX_TANGENT_WEIGHT + oy * VORTEX_OUTWARD_WEIGHT + v.dirY * VORTEX_ENTRAIN_WEIGHT) * f;
    }
    p.vx += sumTx; p.vy += sumTy;
  }
}

// ================= TRAIL =================
let trail = [];
function addTrailPoint(x, y, kind) {
  const colors = {
    neutral: 'hsla(210, 60%, 75%,',
    success: 'hsla(150, 70%, 65%,',
    reset:   'hsla(210, 15%, 55%,'
  };
  trail.push({ x, y, born: performance.now(), color: colors[kind] || colors.neutral, r: kind === 'success' ? 10 : 7 });
}
function updateAndDrawTrail() {
  const now = performance.now();
  trail = trail.filter(t => now - t.born < 450);
  for (const t of trail) {
    const life = 1 - (now - t.born) / 450;
    ctx.beginPath();
    ctx.fillStyle = t.color + (life * 0.5) + ')';
    ctx.arc(t.x, t.y, t.r * life + 2, 0, Math.PI * 2);
    ctx.fill();
  }
}

// ================= SWIPE / RHYTHM / TAKT LOGIC =================
const HITS_PER_TAKT = 4;
const AUTOPILOT_TAKT_THRESHOLD = 4; // fixed — independent of the speed-tier cap below

// Slower, steadier rhythm reaches a higher score cap. Hectic fast swiping still works,
// it's just capped lower — three flat tiers, no interpolation.
function currentMaxMultiplier() {
  if (referenceInterval === null) return 4;
  if (referenceInterval >= 1000) return 4; // at least 1s per swipe direction
  if (referenceInterval >= 500) return 3;
  return 2; // hectic
}

let dragging = false;
let lastX = 0, lastY = 0;
let currentDir = null;
let referenceInterval = null;
let lastReversalTime = null;
let comboMultiplier = 1;
let beatsInTakt = 0;
let taktsCompleted = 0;

let autopilot = false;
let autoPos = { x: 0, y: 0 };
let autopilotStartTime = 0;
let loopPath = [];
let loopDuration = 0;
let pathBuffer = [];

const TOLERANCE_RATIO = 0.3;

function resetRhythmState() {
  currentDir = null;
  referenceInterval = null;
  comboMultiplier = 1;
  beatsInTakt = 0;
  taktsCompleted = 0;
  autopilot = false;
  updateComboDisplay();
}

function registerBeat(success, x, y) {
  if (success) {
    beatsInTakt++;
    addTrailPoint(x, y, 'success');
    if (beatsInTakt >= HITS_PER_TAKT) {
      beatsInTakt = 0;
      taktsCompleted = Math.min(AUTOPILOT_TAKT_THRESHOLD, taktsCompleted + 1);
      comboMultiplier = Math.min(currentMaxMultiplier(), comboMultiplier + 1);
      updateComboDisplay();
      // no auto-trigger here anymore — reaching the threshold just means the player is now
      // "holding" at the max multiplier manually; autopilot only takes over on release (onPointerUp)
    }
  } else {
    beatsInTakt = 0;
    taktsCompleted = 0;
    comboMultiplier = 1;
    addTrailPoint(x, y, 'reset');
    updateComboDisplay();
  }
}

function startAutopilot(x, y) {
  try {
    const rawPath = pathBuffer.slice();
    if (rawPath.length >= 2) {
      const t0 = rawPath[0].t;
      loopPath = rawPath.map(p => ({ x: p.x, y: p.y, t: p.t - t0 }));
      loopDuration = loopPath[loopPath.length - 1].t;
      if (!Number.isFinite(loopDuration) || loopDuration < 200) loopDuration = 0;
    } else {
      loopDuration = 0;
    }
    if (!loopDuration) {
      const amplitude = 90;
      const half = Math.max(referenceInterval || 500, 150);
      loopPath = [
        { x: Math.max(20, x - amplitude), y, t: 0 },
        { x: Math.min(W - 20, x + amplitude), y, t: half }
      ];
      loopDuration = half * 2;
      loopPath.push({ x: loopPath[0].x, y, t: loopDuration });
    }
    autopilot = true;
    autopilotStartTime = performance.now();
    autoPos = { x, y };
    autopilotCapAtTrigger = currentMaxMultiplier();
    if (autopilotBonusStage > 0) {
      autopilotBonusUntil = performance.now() + (6000 + autopilotBonusDurationBought * 3000);
      const bonusValue = autopilotCapAtTrigger + autopilotBonusStage;
      document.getElementById('hint').textContent = `auto-pilot \u2014 \u00d7${bonusValue} for a moment, then \u00d7${autopilotCapAtTrigger}`;
    } else {
      document.getElementById('hint').textContent = `auto-pilot \u2014 replaying your rhythm at \u00d7${autopilotCapAtTrigger}`;
    }
    document.getElementById('combo').classList.add('maxed');
  } catch (e) {
    console.warn('Failed to start autopilot, staying in manual mode:', e);
    autopilot = false;
  }
}

function pointAtLoopTime(t) {
  const path = loopPath;
  if (path.length < 2) return path[0] || { x: autoPos.x, y: autoPos.y };
  for (let i = 1; i < path.length; i++) {
    const a = path[i - 1], b = path[i];
    if (t <= b.t) {
      const span = (b.t - a.t) || 1;
      const f = (t - a.t) / span;
      return { x: a.x + (b.x - a.x) * f, y: a.y + (b.y - a.y) * f };
    }
  }
  return { x: path[path.length - 1].x, y: path[path.length - 1].y };
}

function stopAutopilot() {
  autopilot = false;
  document.getElementById('hint').textContent = 'swipe back and forth to hit quarks in rhythm';
  document.getElementById('combo').classList.remove('maxed');
}

// ================= TEMPORARY SCORE BOOST (Farb-Kombo, bought in the Echo-Shop) =================
let boostMultiplier = 1;
let boostExpiresAt = 0;
function activateBoost(mult, durationMs) {
  boostMultiplier = mult;
  boostExpiresAt = performance.now() + durationMs;
  const banner = document.getElementById('boostBanner');
  banner.textContent = '×' + mult + ' Boost!';
  banner.style.display = 'block';
}
function tryActivateBoost(mult, durationMs) {
  // a running boost blocks any same-or-lower attempt from cutting it short or redundantly
  // retriggering it — but a genuinely higher value is still allowed to upgrade it, so a
  // same-color run that keeps growing (3 → 4 → 5) can climb the ladder instead of getting
  // stuck at the first threshold it happens to cross.
  if (performance.now() < boostExpiresAt && mult <= boostMultiplier) return;
  activateBoost(mult, durationMs);
}
function currentBoostMultiplier() {
  if (performance.now() < boostExpiresAt) return boostMultiplier;
  document.getElementById('boostBanner').style.display = 'none';
  return 1;
}

let sameColorRun = { color: null, length: 0 };
let lastColors = [];
function checkFarbKombo(colorIndex) {
  // same-color run (Stufe I/II): tracks an actual consecutive run
  if (colorIndex === sameColorRun.color) sameColorRun.length++;
  else { sameColorRun.color = colorIndex; sameColorRun.length = 1; }
  if (farbkomboStage >= 2 && sameColorRun.length === 4) { tryActivateBoost(20, 10000); }
  else if (farbkomboStage >= 1 && sameColorRun.length === 3) { tryActivateBoost(5, 10000); }

  // five-different-in-a-row (Stufe III): independent rolling window
  lastColors.push(colorIndex);
  if (lastColors.length > 5) lastColors.shift();
  if (farbkomboStage >= 3 && lastColors.length === 5 && new Set(lastColors).size === 5) {
    tryActivateBoost(80, 10000);
    lastColors = [];
  }
}

let autopilotBonusUntil = 0;
let autopilotCapAtTrigger = 4;

function onPointerDown(e) {
  if (autopilot) stopAutopilot();
  dragging = true;
  lastX = e.clientX; lastY = e.clientY;
  lastReversalTime = performance.now();
  resetRhythmState();
  pathBuffer = [{ x: e.clientX, y: e.clientY, t: performance.now() }];
  for (const p of particles) p.wasNear = false;
}

function hitTestAt(x, y, isManual) {
  let hitsThisCall = 0;
  const now = performance.now();
  const inAutopilotBonusWindow = autopilot && autopilotBonusStage > 0 && now < autopilotBonusUntil;
  for (const p of particles) {
    const hittable = p.kind === 'quark' || (p.kind === 'nucleon' && p.nucleonType === 'neutron');
    if (!hittable || p.popAt !== null) continue;
    const d = Math.hypot(p.x - x, p.y - y);
    const radius = isManual ? HIT_RADIUS : AUTOPILOT_HIT_RADIUS;
    const near = d < radius;
    if (near && !p.wasNear) {
      p.popAt = now;
      hitsThisCall++;
      const baseValue = p.kind === 'nucleon' ? 400 : 1;
      const effectiveCombo = inAutopilotBonusWindow ? (autopilotCapAtTrigger + autopilotBonusStage) : comboMultiplier;
      let value = baseValue * effectiveCombo * currentBoostMultiplier();
      if (isManual && boughtManualMultiplier) value *= 8;
      score += value;
      document.getElementById('score').textContent = score;
      refreshSpawnUI();
      refreshLevelUI();
      if (p.kind === 'quark' && isManual) checkFarbKombo(p.colorIndex); // manual-only, per design intent
    }
    p.wasNear = near;
  }
  return hitsThisCall;
}

function onPointerMove(e) {
  if (!dragging || autopilot) return;
  const x = e.clientX, y = e.clientY;
  const dx = x - lastX, dy = y - lastY;
  const moveSpeed = Math.hypot(dx, dy);
  const dirX = moveSpeed > 0.01 ? dx / moveSpeed : 0;
  const dirY = moveSpeed > 0.01 ? dy / moveSpeed : 0;

  addTrailPoint(x, y, 'neutral');
  applyVortex(x, y, moveSpeed, dirX, dirY);
  pathBuffer.push({ x, y, t: performance.now() });
  if (pathBuffer.length > 3000) pathBuffer.shift();

  if (Math.abs(dx) > 3) {
    const dir = dx > 0 ? 1 : -1;
    if (currentDir === null) {
      currentDir = dir;
    } else if (dir !== currentDir) {
      const now = performance.now();
      if (referenceInterval === null) {
        referenceInterval = now - lastReversalTime;
        addTrailPoint(x, y, 'neutral');
      } else {
        const elapsed = now - lastReversalTime;
        const tolerance = referenceInterval * TOLERANCE_RATIO;
        const success = Math.abs(elapsed - referenceInterval) <= tolerance;
        if (!success) referenceInterval = elapsed;
        registerBeat(success, x, y);
      }
      lastReversalTime = now;
      currentDir = dir;
    }
  }

  hitTestAt(x, y, true);
  lastX = x; lastY = y;
}

function onPointerUp() {
  dragging = false;
  currentDir = null;
  if (taktsCompleted >= AUTOPILOT_TAKT_THRESHOLD && !autopilot) {
    startAutopilot(lastX, lastY);
  }
}

function updateComboDisplay() {
  const now = performance.now();
  const inBonusWindow = autopilot && autopilotBonusStage > 0 && now < autopilotBonusUntil;
  const shown = inBonusWindow ? (autopilotCapAtTrigger + autopilotBonusStage) : comboMultiplier;
  document.getElementById('comboVal').textContent = '\u00d7' + shown;
}

canvas.addEventListener('pointerdown', onPointerDown);
canvas.addEventListener('pointermove', onPointerMove);
window.addEventListener('pointerup', onPointerUp);

// ================= AUTOPILOT LOOP =================
function updateAutopilot(now) {
  if (!autopilot) return;
  try {
    const elapsed = (now - autopilotStartTime) % loopDuration;
    const pt = pointAtLoopTime(elapsed);
    if (!Number.isFinite(pt.x) || !Number.isFinite(pt.y)) throw new Error('non-finite autopilot point');
    const dx = pt.x - autoPos.x, dy = pt.y - autoPos.y;
    const moveSpeed = Math.hypot(dx, dy);
    const dirX = moveSpeed > 0.01 ? dx / moveSpeed : 0;
    const dirY = moveSpeed > 0.01 ? dy / moveSpeed : 0;
    autoPos = pt;
    addTrailPoint(pt.x, pt.y, 'success');
    applyVortex(pt.x, pt.y, moveSpeed * 2, dirX, dirY);
    hitTestAt(pt.x, pt.y, false);
  } catch (e) {
    console.warn('Autopilot hit an unexpected error, stopping it gracefully:', e);
    stopAutopilot();
  }
}

// ================= RENDER =================
function popColor(p) {
  if (p.kind === 'quark') return `hsla(${p.hue}, 90%, 80%, 1)`;
  if (p.kind === 'nucleon') return p.nucleonType === 'proton' ? 'hsla(0, 85%, 70%, 1)' : 'hsla(48, 60%, 85%, 1)';
  if (p.kind === 'atom') return p.decaying ? 'hsla(10, 90%, 55%, 1)' : 'hsla(0, 80%, 55%, 1)';
  return `hsla(${p.hue || 200}, 70%, 85%, 1)`;
}

function drawKind(p) {
  if (p.kind === 'quark' || p.kind === 'electron') {
    const speed = Math.hypot(p.vx, p.vy);
    const alpha = Math.min(1, 0.35 + speed * 0.08);
    const hue = p.kind === 'electron' ? 200 : (p.hue || 210);
    const sat = p.kind === 'electron' ? 25 : 90;
    const light = p.kind === 'electron' ? 92 : 75;
    const grad = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.radius * 4);
    grad.addColorStop(0, `hsla(${hue}, ${sat}%, ${light}%, ${alpha})`);
    grad.addColorStop(1, `hsla(${hue}, ${sat}%, ${light}%, 0)`);
    ctx.fillStyle = grad;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.radius * 4, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = `hsla(${hue}, ${sat}%, ${Math.min(96, light + 10)}%, ${Math.min(1, alpha + 0.3)})`;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2); ctx.fill();
  } else if (p.kind === 'nucleon') {
    const isProton = p.nucleonType === 'proton';
    const hue = isProton ? 0 : 48;
    const sat = isProton ? 85 : 55;
    const light = isProton ? 55 : 88;
    const grad = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.radius * 3);
    grad.addColorStop(0, `hsla(${hue}, ${sat}%, ${light}%, 0.9)`);
    grad.addColorStop(1, `hsla(${hue}, ${sat}%, ${light}%, 0)`);
    ctx.fillStyle = grad;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.radius * 3, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = `hsla(${hue}, ${sat}%, ${light}%, 0.95)`;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2); ctx.fill();
    if (isProton) {
      ctx.beginPath();
      ctx.strokeStyle = 'hsla(30, 90%, 65%, 0.55)';
      ctx.lineWidth = 1.5;
      ctx.arc(p.x, p.y, p.radius + 2.5, 0, Math.PI * 2);
      ctx.stroke();
      if (p.boundElectron) {
        ctx.beginPath();
        ctx.strokeStyle = 'hsla(190, 70%, 80%, 0.35)';
        ctx.lineWidth = 1;
        ctx.moveTo(p.x, p.y);
        ctx.lineTo(p.boundElectron.x, p.boundElectron.y);
        ctx.stroke();
        if (!p.stableAtom) {
          const prog = Math.min(1, p.bondTimer / STABLE_MS);
          ctx.beginPath();
          ctx.strokeStyle = 'hsla(190, 80%, 75%, 0.8)';
          ctx.lineWidth = 2;
          ctx.arc(p.x, p.y, p.radius + 5, -Math.PI / 2, -Math.PI / 2 + prog * Math.PI * 2);
          ctx.stroke();
        }
      }
    }
  } else if (p.kind === 'atom') {
    // stable atoms stay red (slightly darker than the free proton) instead of turning gold
    const grad = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.radius * 2.4);
    grad.addColorStop(0, 'hsla(0, 75%, 40%, 0.9)');
    grad.addColorStop(1, 'hsla(0, 75%, 40%, 0)');
    ctx.fillStyle = grad;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.radius * 2.4, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'hsla(0, 70%, 35%, 1)';
    ctx.beginPath(); ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2); ctx.fill();
  }
}

function drawDuoLinks() {
  for (const link of duoLinks) {
    ctx.beginPath();
    ctx.strokeStyle = 'hsla(210, 60%, 80%, 0.4)';
    ctx.lineWidth = 1;
    ctx.moveTo(link.qa.x, link.qa.y);
    ctx.lineTo(link.qb.x, link.qb.y);
    ctx.stroke();
  }
}

function drawParticles() {
  const now = performance.now();
  let visibleCount = 0;
  for (const p of particles) {
    if (p.popAt !== null) {
      const t = (now - p.popAt) / 260;
      const r = (p.radius || 4) * (1 + t * 6);
      ctx.beginPath();
      ctx.strokeStyle = popColor(p);
      ctx.globalAlpha = 1 - t;
      ctx.lineWidth = 2;
      ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
      ctx.stroke();
      ctx.globalAlpha = 1;
      continue;
    }
    drawKind(p);
    visibleCount++;
  }
  // particle count HUD line removed to save vertical space
}

let lastFrameTime = performance.now();
function loop() {
  const now = performance.now();
  const dt = now - lastFrameTime;
  lastFrameTime = now;

  ctx.fillStyle = 'rgba(5, 7, 13, 0.25)';
  ctx.fillRect(0, 0, W, H);
  update(dt);
  updateAutopilot(now);
  updateComboDisplay();
  drawDuoLinks();
  drawParticles();
  updateAndDrawTrail();
  drawFlashes();
  updateAndDrawDebris();
  requestAnimationFrame(loop);
}

// ================= AMBIENT MUSIC (synthesized, 60bpm, soft pads + ultra-soft beat) =================
let audioCtx = null;
let musicStarted = false;

function startMusic() {
  if (musicStarted) return;
  musicStarted = true;
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') {
    audioCtx.resume().catch(() => {});
  }

  const beatMs = 1000;

  const masterGain = audioCtx.createGain();
  masterGain.gain.value = 0.22;
  masterGain.connect(audioCtx.destination);

  const panner = audioCtx.createStereoPanner ? audioCtx.createStereoPanner() : null;
  const panTarget = panner || masterGain;
  if (panner) panner.connect(masterGain);

  const filter = audioCtx.createBiquadFilter();
  filter.type = 'lowpass';
  filter.frequency.value = 2200; // brighter than the old pad filter — piano needs the transient click through
  filter.connect(panTarget);

  // long, soft reverb tail — two delay taps at different times for a more diffuse "hall" feel
  // instead of a single distinct echo
  const delayA = audioCtx.createDelay(3.0);
  delayA.delayTime.value = 0.7;
  const feedbackA = audioCtx.createGain();
  feedbackA.gain.value = 0.42;
  const delayB = audioCtx.createDelay(3.0);
  delayB.delayTime.value = 1.15;
  const feedbackB = audioCtx.createGain();
  feedbackB.gain.value = 0.38;
  const reverbWet = audioCtx.createGain();
  reverbWet.gain.value = 0.32;

  delayA.connect(feedbackA); feedbackA.connect(delayA);
  delayB.connect(feedbackB); feedbackB.connect(delayB);
  delayA.connect(reverbWet); delayB.connect(reverbWet);
  reverbWet.connect(panTarget);
  filter.connect(delayA);
  filter.connect(delayB);

  const chords = [
    [130.81, 164.81, 196.00], // C major (C3 E3 G3)
    [174.61, 220.00, 261.63], // F major (F3 A3 C4)
    [196.00, 246.94, 293.66], // G major (G3 B3 D4)
    [220.00, 261.63, 329.63], // A minor (A3 C4 E4)
    [130.81, 164.81, 196.00], // C major
    [174.61, 220.00, 261.63], // F major
    [146.83, 174.61, 220.00], // D minor (D3 F3 A3) — brief gentle touch
    [196.00, 246.94, 293.66]  // G major
  ];

  let beatCount = 0;

  // A soft piano-like pluck: fast attack (the "hammer"), then a natural exponential decay
  // (the "string" ringing out) rather than a sustained held pad. Each note rings well past
  // the next chord change, letting them overlap — that's what reads as "long reverb/sustain".
  function playPianoNote(freq, startTime, velocity) {
    const osc = audioCtx.createOscillator();
    osc.type = 'triangle';
    osc.frequency.value = freq;
    const overtone = audioCtx.createOscillator();
    overtone.type = 'sine';
    overtone.frequency.value = freq * 2; // soft upper harmonic for a touch of "hammer" brightness

    const g = audioCtx.createGain();
    g.gain.value = 0;
    const overtoneGain = audioCtx.createGain();
    overtoneGain.gain.value = 0;

    osc.connect(g);
    overtone.connect(overtoneGain);
    g.connect(filter);
    overtoneGain.connect(filter);

    osc.start(startTime);
    overtone.start(startTime);

    // fast, soft attack (a gentle touch, not a hard strike) then a long natural decay
    g.gain.setValueAtTime(0.0001, startTime);
    g.gain.linearRampToValueAtTime(velocity, startTime + 0.03);
    g.gain.exponentialRampToValueAtTime(0.0008, startTime + 5.5);
    overtoneGain.gain.setValueAtTime(0.0001, startTime);
    overtoneGain.gain.linearRampToValueAtTime(velocity * 0.35, startTime + 0.02);
    overtoneGain.gain.exponentialRampToValueAtTime(0.0005, startTime + 3.0);

    const stopAt = startTime + 5.7;
    osc.stop(stopAt);
    overtone.stop(stopAt);
  }

  function playChord(freqs, startTime) {
    // very soft touch, one note ever so slightly after the other — like a hand, not a machine
    freqs.forEach((f, i) => {
      playPianoNote(f, startTime + i * 0.03, 0.28 - i * 0.03);
    });
  }

  playChord(chords[0], audioCtx.currentTime + 0.05);

  function playSoftBeat() {
    const beatOsc = audioCtx.createOscillator();
    beatOsc.type = 'sine';
    beatOsc.frequency.value = 55;
    const beatFilter = audioCtx.createBiquadFilter();
    beatFilter.type = 'lowpass';
    beatFilter.frequency.value = 180;
    const beatGain = audioCtx.createGain();
    beatGain.gain.value = 0;
    beatOsc.connect(beatFilter);
    beatFilter.connect(beatGain);
    beatGain.connect(panTarget);
    beatOsc.start();
    beatGain.gain.linearRampToValueAtTime(0.04, audioCtx.currentTime + 0.08);
    beatGain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.5);
    beatOsc.stop(audioCtx.currentTime + 0.55);
  }

  let panPhase = 0;
  setInterval(() => {
    beatCount++;
    if (panner) {
      panPhase += 0.18;
      panner.pan.linearRampToValueAtTime(Math.sin(panPhase) * 0.35, audioCtx.currentTime + beatMs / 1000);
    }
    playSoftBeat();
    if (beatCount % 4 === 0) {
      const chordIndex = (beatCount / 4) % chords.length;
      playChord(chords[chordIndex], audioCtx.currentTime + 0.02);
    }
  }, beatMs);
}

  { name: 'Color-Combo I (3 same score higher)',   flag: 'farbkombo1',       cost: 1 },
  { name: 'Color-Combo II (4 same, even higher)',  flag: 'farbkombo2',       cost: 25, requires: 'farbkombo1' },
  { name: 'Color-Combo III (5 different, highest)', flag: 'farbkombo3',      cost: 60, requires: 'farbkombo2' },
  { name: 'Auto-pilot boost (+1 above your cap, briefly)', flag: 'autopilotStage',  cost: 15 },
  { name: 'Auto-pilot boost, longer window',        flag: 'autopilotDuration', cost: 20, requires: 'autopilotStage' }
];
let echoShopOwned = {};
let farbkomboStage = 0;      // 0-3, derived from echoShopOwned at restart
let autopilotBonusStage = 0;
let autopilotBonusDurationBought = 0;

function applyEchoShopEffects() {
  farbkomboStage = (echoShopOwned.farbkombo3 ? 3 : echoShopOwned.farbkombo2 ? 2 : echoShopOwned.farbkombo1 ? 1 : 0);
  autopilotBonusStage = echoShopOwned.autopilotStage ? 1 : 0;
  autopilotBonusDurationBought = echoShopOwned.autopilotDuration ? 1 : 0;
}

function renderEchoShop() {
  document.getElementById('echoShopBalanceVal').textContent = echo;
  const list = document.getElementById('echoShopList');
  list.innerHTML = '';
  for (const item of ECHO_SHOP_ITEMS) {
    const owned = !!echoShopOwned[item.flag];
    const locked = item.requires && !echoShopOwned[item.requires];
    const row = document.createElement('div');
    row.className = 'echoItem' + (owned ? ' owned' : '') + (locked ? ' owned' : '');
    row.innerHTML = `<div><b>${item.name}${locked ? ' \u{1F512}' : ''}</b><small>${owned ? 'owned' : 'one-time, permanent'}</small></div>
      <div class="price">${owned ? '\u2713' : item.cost}</div>`;
    if (!owned && !locked) {
      row.addEventListener('pointerdown', () => {
        if (echo < item.cost) return;
        echo -= item.cost;
        echoShopOwned[item.flag] = true;
        applyEchoShopEffects();
        updateEchoDisplay();
        renderEchoShop();
      });
    }
    list.appendChild(row);
  }
}

function showEpochScreen() {
  playthroughCount += 1;
  const quipIdx = Math.min(playthroughCount - 1, EPOCH1_QUIPS.length - 1);
  let quip = EPOCH1_QUIPS[quipIdx];
  if (playthroughCount > EPOCH1_QUIPS.length) quip += ' Run #' + playthroughCount + '.';
  document.getElementById('quipText').textContent = quip;
  document.getElementById('echoShopScreen').classList.remove('visible');
  document.getElementById('epochScreen').classList.add('visible');
  if (playthroughCount > 0) document.getElementById('abortBtn').style.display = 'flex';
}

document.getElementById('navEpochsBtn').addEventListener('pointerdown', () => {
  // only Epoch 1 exists so far — placeholder for future epoch switching
});
document.getElementById('navEchoShopBtn').addEventListener('pointerdown', () => {
  renderEchoShop();
  document.getElementById('epochScreen').classList.remove('visible');
  document.getElementById('echoShopScreen').classList.add('visible');
});
document.getElementById('echoShopBackBtn').addEventListener('pointerdown', () => {
  document.getElementById('echoShopScreen').classList.remove('visible');
  document.getElementById('epochScreen').classList.add('visible');
});

// ================= ABORT RUN (hold 3s, only available after the first completed playthrough) =================
const ABORT_HOLD_MS = 3000;
let abortHoldStart = null;
let abortHoldTimer = null;

function abortHoldStep() {
  if (abortHoldStart === null) return;
  const elapsed = performance.now() - abortHoldStart;
  const pct = Math.min(1, elapsed / ABORT_HOLD_MS);
  document.getElementById('abortProgress').style.width = (pct * 100) + '%';
  if (pct >= 1) {
    cancelAbortHold();
    document.getElementById('abortProgress').style.display = 'none';
    document.getElementById('abortProgress').style.width = '0%';
    showEpochScreenForAbort();
    return;
  }
  abortHoldTimer = requestAnimationFrame(abortHoldStep);
}
function startAbortHold() {
  if (playthroughCount <= 0) return;
  abortHoldStart = performance.now();
  document.getElementById('abortBtn').classList.add('holding');
  document.getElementById('abortProgress').style.display = 'block';
  document.getElementById('abortWarning').style.display = 'block';
  abortHoldTimer = requestAnimationFrame(abortHoldStep);
}
function cancelAbortHold() {
  abortHoldStart = null;
  if (abortHoldTimer) cancelAnimationFrame(abortHoldTimer);
  document.getElementById('abortBtn').classList.remove('holding');
  document.getElementById('abortProgress').style.display = 'none';
  document.getElementById('abortProgress').style.width = '0%';
  document.getElementById('abortWarning').style.display = 'none';
}
function showEpochScreenForAbort() {
  // abandoning a run does not count as a finish — no quip escalation, straight to the epoch screen
  document.getElementById('quipText').textContent = 'Run abandoned. The field settles back into stillness.';
  document.getElementById('echoShopScreen').classList.remove('visible');
  document.getElementById('epochScreen').classList.add('visible');
}
const abortBtn = document.getElementById('abortBtn');
abortBtn.addEventListener('pointerdown', (e) => { e.stopPropagation(); startAbortHold(); });
abortBtn.addEventListener('pointerup', cancelAbortHold);
abortBtn.addEventListener('pointerleave', cancelAbortHold);
document.getElementById('epochCard').addEventListener('pointerdown', () => {
  document.getElementById('epochScreen').classList.remove('visible');
  restartCycle();
});

function restartCycle() {
  // fresh attempt at Epoch 1 — everything epoch-local resets; Echo and Echo-shop purchases persist
  particles = [];
  duoLinks = [];
  flashes = [];
  trail = [];
  vortexHistory = [];
  score = 0;
  spawnLevel = 0;
  unlockedNeutron = false;
  unlockedProton = false;
  unlockedElectron = false;
  doubleRedSpawn = false;
  levelIndex = 0;
  boughtManualMultiplier = false;
  boughtStability = false;
  DISTURB_BREAK_FORM = 3;
  DISTURB_BREAK_STABLE_BASE = 6;
  applyEchoShopEffects(); // re-derive farbkomboStage/autopilotBonus* from persistent Echo-Shop purchases
  boostMultiplier = 1;
  boostExpiresAt = 0;
  sameColorRun = { color: null, length: 0 };
  lastColors = [];
  resetRhythmState();
  document.getElementById('score').textContent = score;
  document.getElementById('echoRow').style.display = echo > 0 ? 'block' : 'none';
  document.getElementById('echoVal').textContent = echo;
  refreshSpawnUI();
  refreshLevelUI();
}

// ================= START =================
let gameStarted = false;
function startGame() {
  if (gameStarted) return;
  gameStarted = true;
  const overlay = document.getElementById('startOverlay');
  overlay.style.opacity = '0';
  setTimeout(() => overlay.remove(), 800);
  updateSpawnRate();
  refreshSpawnUI();
  try {
    startMusic();
  } catch (e) {
    console.warn('Audio failed to start, continuing without sound:', e);
  }
}
const startOverlayEl = document.getElementById('startOverlay');
startOverlayEl.addEventListener('pointerdown', startGame, { once: true });
startOverlayEl.addEventListener('touchstart', startGame, { once: true });
startOverlayEl.addEventListener('click', startGame, { once: true });

document.addEventListener('touchmove', (e) => { e.preventDefault(); }, { passive: false });

loop();
</script>
</body>
