<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Drift — Prototypes Index</title>
<style>
  body{font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:#05070d;color:#dbe8ff;margin:0;padding:24px}
  h1{font-weight:300}
  .note{color:#9fb0d9;font-size:14px}
  ul{margin-top:12px}
  li{margin:8px 0}
  a{color:#ffdca0}
  .file-meta{color:#9fb0d9;font-size:12px;margin-left:6px}
  .spinner{width:18px;height:18px;border-radius:50%;border:2px solid rgba(255,255,255,0.08);border-top-color:#ffdca0;display:inline-block;vertical-align:middle}
</style>
</head>
<body>
  <h1>Drift — Prototype Builds</h1>
  <div class="note">This page automatically lists HTML files published to this repository's gh-pages branch. Click a file to open the prototype.</div>
  <p style="margin-top:12px"><span id="loading" class="spinner"></span> <span id="loadingText">Loading available prototypes…</span></p>
  <ul id="list"></ul>
  <script>
    const owner = 'janmeyer1';
    const repo = 'drift';
    const branch = 'gh-pages';
    const listEl = document.getElementById('list');
    const loadingText = document.getElementById('loadingText');
    const loadingSpinner = document.getElementById('loading');

    function makeLink(item){
      // Relative link will work on gh-pages (same branch)
      const name = encodeURI(item.name);
      const a = document.createElement('a');
      a.href = './' + name;
      a.textContent = item.name;
      a.target = '_blank';
      return a;
    }

    function showFallback() {
      loadingSpinner.style.display = 'none';
      loadingText.textContent = 'Could not load listing automatically. Here is the latest known build:';
      listEl.innerHTML = '<li><a href="./drift-prototype-v0.10.html" target="_blank">drift-prototype-v0.10.html</a> <span class="file-meta">(fallback)</span></li>';
    }

    fetch(`https://api.github.com/repos/${owner}/${repo}/contents?ref=${branch}`)
      .then(r => {
        if (!r.ok) throw new Error('GitHub API returned ' + r.status);
        return r.json();
      })
      .then(files => {
        loadingSpinner.style.display = 'none';
        loadingText.textContent = '';
        const htmlFiles = files.filter(f => f.type === 'file' && f.name.toLowerCase().endsWith('.html'))
                               .sort((a,b)=> a.name.localeCompare(b.name));
        if (htmlFiles.length === 0) {
          listEl.innerHTML = '<li>No HTML files found on gh-pages branch yet.</li>';
          return;
        }
        for (const f of htmlFiles) {
          const li = document.createElement('li');
          li.appendChild(makeLink(f));
          const meta = document.createElement('span');
          meta.className = 'file-meta';
          meta.textContent = new Date(f.sha ? 0 : 0).toString(); // placeholder – we don't rely on modified time here
          li.appendChild(meta);
          listEl.appendChild(li);
        }
      })
      .catch(err => {
        console.warn('Failed to load repo listing:', err);
        showFallback();
      });
  </script>
</body>
</html>
