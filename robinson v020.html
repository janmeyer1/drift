<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#146b86">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Robinson v019</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Patrick+Hand&family=Pixelify+Sans:wght@500;700&family=VT323&display=swap" rel="stylesheet">
<style>
:root{--ink:#3b2a1a;--paper:#fff6e3;--sea:#146b86;--green:#39e639}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#0d3f52;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;font-family:'Fredoka',system-ui,sans-serif;color:var(--ink)}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#hud{position:fixed;inset:0;pointer-events:none;z-index:2}
.pill{position:absolute;background:rgba(255,246,227,.88);border-radius:14px;padding:6px 12px;box-shadow:0 2px 0 rgba(59,42,26,.25);font-weight:600;font-size:clamp(12px,2.6vh,17px);white-space:nowrap}
#stats{left:max(10px,env(safe-area-inset-left));top:10px;display:flex;gap:10px;align-items:center}
.bar{width:clamp(70px,13vw,150px);height:12px;border-radius:6px;background:#e3cfa6;overflow:hidden;position:relative}
.bar>i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#ff8a5c,#ffb347);border-radius:6px;transition:width .25s}
.res{display:none}.res.on{display:inline}
#greenTxt{color:#1f9d1f}
#catTxt{color:#e46a6a}#catTxt.used{opacity:.35;filter:grayscale(1)}
#stats.boost{animation:boost .9s ease-out}@keyframes boost{0%{box-shadow:0 0 0 0 rgba(255,179,71,.9);transform:scale(1.08)}100%{box-shadow:0 0 0 18px rgba(255,179,71,0);transform:scale(1)}}
#petMsg{position:absolute;z-index:2;top:calc(30px + 9vh);left:50%;transform:translateX(-50%);display:none;background:#fff6e3;color:#3b2a1a;font:600 clamp(14px,3.2vh,19px) 'Fredoka',sans-serif;padding:8px 16px;border-radius:14px;box-shadow:0 4px 0 rgba(0,0,0,.25);white-space:nowrap}
#petMsg.gain{background:#ffe7b3;animation:petPop 1.1s ease-out}@keyframes petPop{0%{transform:translateX(-50%) scale(1.25);box-shadow:0 0 0 0 rgba(255,179,71,.9)}100%{transform:translateX(-50%) scale(1);box-shadow:0 0 0 22px rgba(255,179,71,0)}}
#tideBox{left:50%;bottom:16px;transform:translateX(-50%);display:flex;gap:10px;align-items:center;background:rgba(10,40,60,.8);color:#fff6e3;box-shadow:0 2px 0 rgba(0,0,0,.25)}
#tideBox b{color:#7fe6d6}
#track{display:none;gap:3px;align-items:center}
#track .nd,#resTrack .nd{position:relative;display:inline-flex;align-items:center;justify-content:center;min-width:clamp(18px,3.8vh,28px);height:clamp(18px,3.8vh,28px);border-radius:50%;font-size:clamp(10px,2vh,13px);background:rgba(255,255,255,.12);color:rgba(255,246,227,.6)}
#track .nd.done{background:#2d6b3a;color:#fff6e3}
#track .nd.cur{background:#ffcf5a;color:#3b2a1a;box-shadow:0 0 0 2px #fff6e3}
#track .nd.boss{background:#5a1a1a;color:#ff8a7a;box-shadow:0 0 0 2px #ff4a3a}
#track .nd.boss.done{background:#2d6b3a;color:#fff6e3;box-shadow:none}
#track .nd i,#resTrack .nd i{position:absolute;top:-1.15em;left:50%;transform:translateX(-50%);font-style:normal;font-size:clamp(11px,2.2vh,15px)}
#track .ln,#resTrack .ln{width:clamp(3px,.7vw,8px);height:2px;background:rgba(255,246,227,.3)}
#waitBtn.hint{animation:mapHint 1.2s ease-in-out infinite;box-shadow:0 0 0 3px #ffd36a}
#mapBtn.hint{animation:mapHint 1.2s ease-in-out infinite;box-shadow:0 0 0 3px #ffd36a}@keyframes mapHint{0%,100%{box-shadow:0 0 0 3px #ffd36a,0 0 0 0 rgba(255,211,106,.8)}50%{box-shadow:0 0 0 3px #ffd36a,0 0 0 12px rgba(255,211,106,0)}}
#mapBtn{display:none;border:0;background:#2f7f6f;color:#fff6e3;font:600 clamp(12px,2.6vh,16px) 'Fredoka',sans-serif;padding:3px 10px;border-radius:10px;cursor:pointer}
.logbox{margin-top:10px;border-top:2px dashed #e3cfa6;padding-top:8px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:14px}
.logbox .btn{min-width:0;padding:6px 10px;font-size:13px;background:#5b6a2e;box-shadow:0 3px 0 #3a4520}
#tideBox.top{padding-top:calc(6px + 1.25em)}
#tideBox.top{bottom:auto;top:10px}

#tideBar{background:rgba(255,255,255,.18)}#tideBar>i{background:linear-gradient(90deg,#1f8aa6,#5fd3c7)}
#topRight{right:max(10px,env(safe-area-inset-right));top:10px;display:flex;gap:8px;align-items:center;pointer-events:auto}
#mute{border:0;background:none;font:inherit;font-size:clamp(14px,3vh,20px);cursor:pointer;color:var(--ink)}
.hbtn{position:absolute;bottom:14px;pointer-events:auto;border:0;cursor:pointer;font:600 clamp(13px,2.8vh,18px) 'Fredoka',sans-serif;color:var(--paper);padding:9px 16px;border-radius:14px;display:none}
#ledgerBtn{right:max(14px,env(safe-area-inset-right));background:#2d6b3a;box-shadow:0 3px 0 #1b4524}
#ledgerBtn.ready{animation:pulse 1.1s infinite}
#waitBtn{left:max(14px,env(safe-area-inset-left));background:rgba(20,107,134,.85);box-shadow:0 3px 0 #0d3f52}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07);background:#3c8a4b}}
/* combat ability buttons */
#sBtn{position:absolute;left:50%;transform:translateX(-50%);bottom:0;width:33.4vw;height:20vh;pointer-events:auto;border:0;background:none;display:none;cursor:pointer}
#sBtn .face{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);min-width:clamp(120px,22vw,200px);padding:8px 14px;border-radius:16px;background:rgba(255,246,227,.88);box-shadow:0 3px 0 rgba(59,42,26,.3);font:600 clamp(13px,2.8vh,18px) 'Fredoka',sans-serif;color:var(--ink);overflow:hidden}
#sBtn .face i{position:absolute;left:0;top:0;bottom:0;background:rgba(57,230,57,.35);width:100%}
#sBtn .face span{position:relative}
#sBtn.cd .face{opacity:.75}
#wBtn{position:absolute;left:50%;transform:translateX(-50%);top:calc(30px + 2.6em + 4.6vh);pointer-events:auto;border:0;cursor:pointer;display:none;min-width:clamp(96px,16vw,150px);padding:9px 14px;border-radius:16px;font:600 clamp(13px,2.8vh,18px) 'Fredoka',sans-serif;color:var(--paper);background:#1d1d1d;box-shadow:0 3px 0 #000;overflow:hidden}
#wBtn i{position:absolute;left:0;top:0;bottom:0;background:rgba(57,230,57,.45);width:100%}
#wBtn span{position:relative}
#wBtn.win{animation:pulse2 .35s infinite}
@keyframes pulse2{0%,100%{transform:translateX(-50%) scale(1)}50%{transform:translateX(-50%) scale(1.1)}}
#wBtn.none{opacity:.55}
#panel{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(13,63,82,.5);z-index:5;pointer-events:auto}
#panel .card{background:var(--paper);border-radius:20px;padding:10px 14px 10px;width:min(980px,96vw);height:min(94vh,700px);display:flex;flex-direction:column;gap:6px;box-shadow:0 6px 0 rgba(59,42,26,.3);overflow:hidden}
#panel .head{display:flex;align-items:baseline;gap:10px}
#treeCv{position:static;inset:auto;height:auto;flex:1;min-height:0;width:100%;border-radius:12px;touch-action:none;cursor:pointer}
#treeInfo{display:flex;align-items:center;gap:10px;min-height:44px;border-top:2px dashed #e3cfa6;padding-top:6px}
#treeInfo .txt{flex:1;line-height:1.15}#treeInfo b{font-size:15px}#treeInfo p{font-family:'Patrick Hand',cursive;font-size:15px;opacity:.85}
#panel .foot{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
#panel .foot .logbox{margin:0;border:0;padding:0;flex:1}
#upgList .item{border:0;padding:0}
@media (max-height:520px){#panel .card{padding:6px 10px;gap:4px;height:96vh}#panel h2{font-size:17px}#panel .sub{display:none}#treeInfo{min-height:36px;padding-top:3px}#treeInfo p{font-size:13px}#panel .foot .btn{padding:5px 8px;font-size:12px}}
#panel h2{font-size:22px;margin-bottom:2px}
#panel .sub{font-family:'Patrick Hand',cursive;font-size:16px;opacity:.75;margin-bottom:4px}
#panel h3{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:#7a8a4a;margin:10px 0 0}
.item{display:flex;gap:12px;align-items:center;border-top:2px dashed #e3cfa6;padding:7px 0}
.item .txt{flex:1}
.item b{font-size:16px}.item .lv{font-size:13px;opacity:.6;margin-left:6px}
.item p{font-family:'Patrick Hand',cursive;font-size:16px;opacity:.85;line-height:1.1}
.btn{border:0;cursor:pointer;font:600 15px 'Fredoka',sans-serif;color:var(--paper);background:#2d6b3a;padding:8px 12px;border-radius:12px;box-shadow:0 3px 0 #1b4524;min-width:86px}
.btn:disabled{background:#b9a888;box-shadow:none;cursor:default}
#closePanel{background:var(--sea);box-shadow:0 3px 0 #0d3f52;min-width:0}
#bubble{position:fixed;z-index:4;max-width:min(380px,42vw);background:var(--paper);border-radius:16px;padding:10px 14px 12px;box-shadow:0 3px 0 rgba(59,42,26,.3);font-family:'Patrick Hand',cursive;font-size:clamp(15px,3.4vh,21px);line-height:1.2;display:none;pointer-events:auto;cursor:pointer}
#bubble .who{font-family:'Fredoka',sans-serif;font-weight:600;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#7a8a4a;margin-bottom:2px}
#banner{position:fixed;left:0;right:0;top:38%;text-align:center;z-index:3;font-weight:600;font-size:clamp(26px,8vh,54px);color:var(--paper);text-shadow:0 3px 0 rgba(13,63,82,.6);opacity:0;transition:opacity .4s;pointer-events:none}
#overlay{position:fixed;inset:0;z-index:6;overflow:hidden;background:#140f33;transition:opacity .6s}
#tlCv{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);image-rendering:pixelated;image-rendering:crisp-edges}
#tlCrt{position:absolute;inset:0;pointer-events:none;display:none}
#tlMenu{position:absolute;left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:14px;padding:0 16px;text-align:center}
#tlTeaser{font:400 clamp(19px,2.6vw,24px)/1.15 'VT323',monospace;color:#ffe9c8;text-shadow:2px 2px 0 #2a1840;max-width:560px}
#tlStart{font:700 20px 'Pixelify Sans',monospace;letter-spacing:.06em;color:#2a1840;background:#ffd27a;border:0;padding:10px 22px;cursor:pointer;
  box-shadow:0 -4px 0 0 #2a1840,0 4px 0 0 #2a1840,-4px 0 0 0 #2a1840,4px 0 0 0 #2a1840,inset 0 -4px 0 0 #e08a4a,inset 0 4px 0 0 #fff2c0;animation:tlPulse 2.4s ease-in-out infinite}
#tlStart:hover{background:#ffe6a0}#tlStart:active{transform:translateY(2px)}
@keyframes tlPulse{0%,100%{filter:brightness(1)}50%{filter:brightness(1.12)}}
@media (prefers-reduced-motion:reduce){#tlStart{animation:none}}
#tlVer{position:absolute;right:8px;bottom:6px;font:400 14px 'VT323',monospace;color:#ffe9c888}
#sketch{position:fixed;inset:0;z-index:5;display:none;align-items:center;justify-content:center;background:rgba(13,30,40,.45);pointer-events:auto}
#sketch .sk{display:flex;flex-direction:column;align-items:center;gap:10px;background:var(--paper);border-radius:18px;padding:14px 20px 16px;max-width:min(620px,90vw);max-height:92vh;overflow:auto;box-shadow:0 6px 0 rgba(59,42,26,.3)}
#sketch .who{font-family:'Fredoka',sans-serif;font-weight:600;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#7a8a4a;align-self:flex-start}
#fkTxt{font-family:'Patrick Hand',cursive;font-size:clamp(17px,3.6vh,22px);line-height:1.25;color:#3b2a1a;align-self:stretch}
#skCv{position:static;inset:auto;width:min(520px,80vw,100vh);height:auto;border-radius:6px;box-shadow:0 3px 12px rgba(0,0,0,.35)}
#result{position:fixed;inset:0;z-index:6;display:none;align-items:center;justify-content:center;background:rgba(13,63,82,.55);pointer-events:auto}
#result .card{background:var(--paper);border-radius:20px;padding:18px 26px;width:min(460px,84vw);text-align:center;box-shadow:0 6px 0 rgba(59,42,26,.3)}
#result h2{font-size:26px;margin-bottom:8px}
#result.win .card{box-shadow:0 0 0 4px #39e639,0 6px 0 rgba(59,42,26,.3)}#result.win h2{color:#2d6b3a;font-size:30px}
#resTrack{display:flex;justify-content:center;gap:3px;margin:24px 0 12px;flex-wrap:wrap}#resTrack .nd{background:#e3cfa6;color:#7a6a4a}#resTrack .nd.done{background:#2d6b3a;color:#fff6e3}#resTrack .nd.cur{background:#ffcf5a;color:#3b2a1a}#resTrack .nd.boss{background:#5a1a1a;color:#ff8a7a}#resTrack .nd.boss.done{background:#2d6b3a;color:#fff6e3}#resTrack .ln{background:#c9b48a}
#result .rs{display:flex;justify-content:center;flex-wrap:wrap;gap:6px 18px;font-weight:600;margin:6px 0 10px}
#result .quip{font-family:'Patrick Hand',cursive;font-size:19px;margin-bottom:14px;color:#5b6a2e}
#ovCat{position:absolute;width:56px;height:44px;opacity:0;cursor:pointer;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}   /* invisible: hold the cat's ear tips */
#ovCat.hold{transform:scale(1.25)}
#pet{position:fixed;inset:0;z-index:8;display:none;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 60%,#2a6f6a 0%,#0d3f52 80%);color:#fff6e3;pointer-events:auto}
#pet h2{position:absolute;top:12px;left:0;right:0;text-align:center;z-index:1;pointer-events:none;font:400 clamp(20px,5vh,30px) 'Patrick Hand',cursive}
#pet .sub{position:absolute;top:calc(18px + 5.5vh);left:0;right:0;text-align:center;z-index:1;pointer-events:none;font:400 clamp(13px,3vh,18px) 'Patrick Hand',cursive;opacity:.75}
#petCv{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
#petClose{position:absolute;z-index:2;right:14px;top:10px;border:0;background:rgba(255,246,227,.2);color:#fff6e3;font:600 18px 'Fredoka';padding:6px 12px;border-radius:12px;cursor:pointer}
#petAsk{position:absolute;z-index:2;bottom:14px;left:50%;transform:translateX(-50%);display:none;gap:10px;align-items:center;background:rgba(10,40,60,.85);padding:8px 14px;border-radius:14px;white-space:nowrap;font-size:clamp(13px,2.8vh,17px)}
#petAsk .btn{min-width:0}
#rotate{position:fixed;inset:0;z-index:9;display:none;align-items:center;justify-content:center;flex-direction:column;gap:12px;background:#0d3f52;color:var(--paper);font-size:22px;text-align:center;padding:20px}
#rotate .ph{width:46px;height:80px;border:4px solid var(--paper);border-radius:10px;animation:rot 2s infinite}
@keyframes rot{0%,30%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="hud">
  <div id="stats" class="pill">
    <span>Stamina</span><div class="bar" id="stBar"><i></i></div><span id="stTxt">2/5</span>
    <span id="catTxt" class="res" title="Long-press the cat once per tide">🐈♥</span><span id="greenTxt" class="res">💚 0</span><span id="tailTxt" class="res">〰 0</span><span id="rumTxt" class="res">🥃 0</span>
  </div>
  <div id="tideBox" class="pill"><span id="tideLbl">Low tide</span><div class="bar" id="tideBar"><i></i></div><div id="track"></div></div>
  <div id="topRight" class="pill"><button id="mapBtn">🗺 Map</button><span id="dayLbl">Tide 1</span><button id="mute" aria-label="Sound">🔊</button></div>
  <button id="ledgerBtn" class="hbtn">Ledger</button>
  <button id="waitBtn" class="hbtn">Wait for the tide ⏭</button>
  <button id="sBtn" aria-label="Throw stamp"><div class="face"><i></i><span id="sTxt">S · Throw</span></div></button>
  <button id="wBtn" aria-label="VOID"><i></i><span id="wTxt">W · VOID</span></button>
</div>
<div id="bubble"><div class="who">Tortoise</div><div id="bubbleTxt"></div></div>
<div id="banner"></div>
<div id="panel"><div class="card">
  <div class="head"><h2 id="treeTitle">The Ledger</h2><div class="sub" id="treeSub">Every expense, accounted for.</div></div>
  <canvas id="treeCv"></canvas>
  <div id="treeInfo"><div class="txt"><b id="tiName">Tap an entry</b><p id="tiDesc">Every upgrade grows from the stamp.</p></div><button class="btn" id="tiBuy" style="display:none"></button></div>
  <div class="foot"><div id="upgList"></div><div class="logbox"><span id="logInfo">Test log</span><button class="btn" id="logCopy">Copy CSV</button><button class="btn" id="logDl">Download CSV</button><button class="btn" id="logClear">Clear</button><span style="flex-basis:100%"></span><input id="nestCode" value="NEST-0-12" placeholder="NEST-B2-15 · ARMY-4-T-15" style="font:600 14px Fredoka,system-ui;width:130px;padding:6px 8px;border-radius:10px;border:2px solid #b49a6a"><button class="btn" id="nestGo" style="background:#5a3a9a">⚔ Nest / army fight</button></div><button class="btn" id="closePanel">Close</button></div>
</div></div>
<div id="sketch"><div class="sk"><div class="who" id="fkWho"></div><div id="fkTxt"></div><canvas id="skCv" width="560" height="380"></canvas><button class="btn" id="skBtn">Keep it</button></div></div>
<div id="result"><div class="card">
  <h2 id="resTitle">Overwhelmed</h2>
  <div class="rs" id="resStats"></div>
  <div id="resTrack"></div>
  <div class="quip" id="resQuip"></div>
  <button class="btn" id="resBtn">Wake up</button>
</div></div>
<div id="overlay"><canvas id="tlCv"></canvas><div id="tlCrt"></div><div id="tlMenu"><div id="tlTeaser"></div><button id="tlStart">START ADVENTURE</button></div><span id="ovCat" aria-label="cat"></span><div id="tlVer">v019</div></div>
<div id="pet"><button id="petClose">✕</button><h2>The cat would like some attention</h2><div class="sub" id="petSub">Pet her. She has opinions about where.</div><canvas id="petCv"></canvas><div id="petMsg"></div><div id="petAsk"><span id="petTxt"></span><button class="btn" id="petGo">Go</button><button class="btn" id="petNo" style="background:#7a6a4a">No</button></div></div>
<div id="rotate"><div class="ph"></div><div>Turn your phone sideways</div></div>

<script>
'use strict';
// =====================================================================
// GAME DATA — all tunable numbers live here (top of script: TDZ-safe)
// distances are in U (1% of screen height), times in seconds
// =====================================================================
const STATS = {
  crusoe: { dmg: 1, atkInt: 1.5, range: 11, splashEvery: 3, splashR: 12, wade: 22, walk: 26, crawl: 7, reach: 40 },
  boomerang: { range: 32, speed: 80, cd: 5, push: 6, dmgMult: 1 },
  void: { dash: 22, mult: 3, cd: 25, window: 2, seekR: 22, seekRStep: 6 },
  cat: { dashTime: .12, backTime: .3, rest: .45 },
  ebb: { tideFirst: 6, tide: 8, palmStart: 3, poolSips: 3, crabsFirst: 3, crabs: 2 },
  // crabs per ebb: several early on, soon one, later only now and then — buried, the cat finds them
  crabPlan: { twoUntil: 4, oneUntil: 9, buriedChance: .4 },
  turn: .07,                    // combat: delay before Crusoe turns round (s)
  tortoise: { barMax: 3 }
};
// monster types; drops: number = guaranteed amount, fraction = chance of one
const MONSTERS = {
  // pool 1: invasive species the yacht brought in, gone green with rot
  tadpole: { name: 'cane toad tadpole', icon: '🐸', hp: 2, dmg: 1, atkInt: 1.5, speed: 16, size: .8, drops: { green: 1 } },
  clam:    { name: 'zebra mussel', icon: '🐚', hp: 14, dmg: 1, atkInt: 1.5, speed: 9, size: .9, drops: { green: 2, rum: .3 }, pearl: true },
  rat:     { name: 'ship rat', icon: '🐀', hp: 8, dmg: 2, atkInt: 1.2, speed: 30, size: .85, drops: { green: 2, tails: .5 } },
  // pool 2: paperwork — Crusoe's own past, from wave 10 on
  wasp:    { name: 'invoice wasp', icon: '📄', hp: 5, dmg: 1, atkInt: .85, speed: 34, size: .85, fly: true, drops: { green: 3 } },
  // boss: a rot-held lump with one evil eye, ropes and the yacht's lifebuoy; shoots pages from its survey folder
  bailiff: { name: 'The First Mate', icon: '👁', hp: 80, dmg: 3, atkInt: 2.4, windup: .7, speed: 6, size: 1, boss: true, reach: 9,
             ranged: { dmg: 1, int: 2.6, range: 70, speed: 42 }, drops: { green: 25 } },
  // the Bailiff in his own office (nest fight): demoted, thinner, still both attacks — home advantage +50 % hp
  bailiff1: { name: 'The Cabin Boy (ex-First Mate)', icon: '👁', hp: 68, dmg: 2, atkInt: 2.2, windup: .65, speed: 7, size: .88, boss: true, reach: 9, fixedScale: true,
             ranged: { dmg: 1, int: 3.2, range: 70, speed: 44 }, drops: { green: 20 } },
  bailiff2: { name: 'The Bilge Rat (ex-First Mate)', icon: '👁', hp: 38, dmg: 1, atkInt: 2.0, windup: .6, speed: 8, size: .75, boss: true, reach: 8, fixedScale: true,
             ranged: { dmg: 1, int: 4.0, range: 70, speed: 46 }, drops: { green: 15 } }

// ================= tortoise & rum =================

  if (!canGiveRum() || S.rum <= 0) return;
  S.rum--; S.tort.bar++; SFX.gulp(); updateHUD();
  say(S.tort.bar >= STATS.tortoise.barMax ? ["Hic."] : [LINES.rum[Math.min(S.tort.bar - 1, LINES.rum.length - 1)]]);

    if (Math.random() < .5) S.parts.push({ x: (PEE_SPOT.fx - .025) * W, y: PEE_SPOT.fy * H - 1 * U, vx: rand(-14, -8) * U, vy: rand(-6, -2) * U, life: .35, t: 0, col: '#f3e27a', r: .35 });
