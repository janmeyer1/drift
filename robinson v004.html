<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#146b86">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Robinson v004</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
:root{--ink:#3b2a1a;--paper:#fff6e3;--sea:#146b86;--green:#39e639}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#0d3f52;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;font-family:'Fredoka',system-ui,sans-serif;color:var(--ink)}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#hud{position:fixed;inset:0;pointer-events:none;z-index:2}
.pill{position:absolute;background:rgba(255,246,227,.88);border-radius:14px;padding:6px 12px;box-shadow:0 2px 0 rgba(59,42,26,.25);font-weight:600;font-size:clamp(12px,2.6vh,17px);white-space:nowrap}
#stats{left:max(10px,env(safe-area-inset-left));top:10px;display:flex;gap:10px;align-items:center}
.bar{width:clamp(70px,13vw,150px);height:12px;border-radius:6px;background:#e3cfa6;overflow:hidden;position:relative}
.bar>i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#ff8a5c,#ffb347);border-radius:6px;transition:width .25s}
.res{display:none}.res.on{display:inline}
#greenTxt{color:#1f9d1f}
#tideBox{left:50%;bottom:16px;transform:translateX(-50%);display:flex;gap:10px;align-items:center}
#tideBox.top{bottom:auto;top:10px}
#tideBar>i{background:linear-gradient(90deg,#1f8aa6,#5fd3c7)}
#topRight{right:max(10px,env(safe-area-inset-right));top:10px;display:flex;gap:8px;align-items:center;pointer-events:auto}
#mute{border:0;background:none;font:inherit;font-size:clamp(14px,3vh,20px);cursor:pointer;color:var(--ink)}
.hbtn{position:absolute;bottom:14px;pointer-events:auto;border:0;cursor:pointer;font:600 clamp(13px,2.8vh,18px) 'Fredoka',sans-serif;color:var(--paper);padding:9px 16px;border-radius:14px;display:none}
#ledgerBtn{right:max(14px,env(safe-area-inset-right));background:#2d6b3a;box-shadow:0 3px 0 #1b4524}
#ledgerBtn.ready{animation:pulse 1.1s infinite}
#waitBtn{left:max(14px,env(safe-area-inset-left));background:rgba(20,107,134,.85);box-shadow:0 3px 0 #0d3f52}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07);background:#3c8a4b}}
/* combat ability buttons */
#sBtn{position:absolute;left:50%;transform:translateX(-50%);bottom:0;width:33.4vw;height:20vh;pointer-events:auto;border:0;background:none;display:none;cursor:pointer}
#sBtn .face{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);min-width:clamp(120px,22vw,200px);padding:8px 14px;border-radius:16px;background:rgba(255,246,227,.88);box-shadow:0 3px 0 rgba(59,42,26,.3);font:600 clamp(13px,2.8vh,18px) 'Fredoka',sans-serif;color:var(--ink);overflow:hidden}
#sBtn .face i{position:absolute;left:0;top:0;bottom:0;background:rgba(57,230,57,.35);width:100%}
#sBtn .face span{position:relative}
#sBtn.cd .face{opacity:.75}
#wBtn{position:absolute;left:50%;transform:translateX(-50%);top:52px;pointer-events:auto;border:0;cursor:pointer;display:none;min-width:clamp(96px,16vw,150px);padding:9px 14px;border-radius:16px;font:600 clamp(13px,2.8vh,18px) 'Fredoka',sans-serif;color:var(--paper);background:#1d1d1d;box-shadow:0 3px 0 #000;overflow:hidden}
#wBtn i{position:absolute;left:0;top:0;bottom:0;background:rgba(57,230,57,.45);width:100%}
#wBtn span{position:relative}
#wBtn.win{animation:pulse2 .35s infinite}
@keyframes pulse2{0%,100%{transform:translateX(-50%) scale(1)}50%{transform:translateX(-50%) scale(1.1)}}
#wBtn.none{opacity:.55}
#panel{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(13,63,82,.5);z-index:5;pointer-events:auto}
#panel .card{background:var(--paper);border-radius:20px;padding:16px 22px;width:min(580px,92vw);max-height:92vh;overflow:auto;box-shadow:0 6px 0 rgba(59,42,26,.3)}
#panel h2{font-size:22px;margin-bottom:2px}
#panel .sub{font-family:'Patrick Hand',cursive;font-size:16px;opacity:.75;margin-bottom:4px}
#panel h3{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:#7a8a4a;margin:10px 0 0}
.item{display:flex;gap:12px;align-items:center;border-top:2px dashed #e3cfa6;padding:7px 0}
.item .txt{flex:1}
.item b{font-size:16px}.item .lv{font-size:13px;opacity:.6;margin-left:6px}
.item p{font-family:'Patrick Hand',cursive;font-size:16px;opacity:.85;line-height:1.1}
.btn{border:0;cursor:pointer;font:600 15px 'Fredoka',sans-serif;color:var(--paper);background:#2d6b3a;padding:8px 12px;border-radius:12px;box-shadow:0 3px 0 #1b4524;min-width:86px}
.btn:disabled{background:#b9a888;box-shadow:none;cursor:default}
#closePanel{margin-top:8px;background:var(--sea);box-shadow:0 3px 0 #0d3f52}
#bubble{position:fixed;z-index:4;max-width:min(380px,42vw);background:var(--paper);border-radius:16px;padding:10px 14px 12px;box-shadow:0 3px 0 rgba(59,42,26,.3);font-family:'Patrick Hand',cursive;font-size:clamp(15px,3.4vh,21px);line-height:1.2;display:none;pointer-events:auto;cursor:pointer}
#bubble .who{font-family:'Fredoka',sans-serif;font-weight:600;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#7a8a4a;margin-bottom:2px}
#banner{position:fixed;left:0;right:0;top:38%;text-align:center;z-index:3;font-weight:600;font-size:clamp(26px,8vh,54px);color:var(--paper);text-shadow:0 3px 0 rgba(13,63,82,.6);opacity:0;transition:opacity .4s;pointer-events:none}
#overlay{position:fixed;inset:0;z-index:6;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:14px;text-align:center;background:radial-gradient(ellipse at 50% 60%,#1f8aa6 0%,#0d3f52 75%);color:var(--paper);pointer-events:auto;cursor:pointer;transition:opacity .6s}
#overlay h1{font-size:clamp(34px,11vh,72px);letter-spacing:.02em}
#overlay p{font-family:'Patrick Hand',cursive;font-size:clamp(17px,4vh,24px);opacity:.9}
#result{position:fixed;inset:0;z-index:6;display:none;align-items:center;justify-content:center;background:rgba(13,63,82,.55);pointer-events:auto}
#result .card{background:var(--paper);border-radius:20px;padding:18px 26px;width:min(460px,84vw);text-align:center;box-shadow:0 6px 0 rgba(59,42,26,.3)}
#result h2{font-size:26px;margin-bottom:8px}
#result .rs{display:flex;justify-content:center;flex-wrap:wrap;gap:6px 18px;font-weight:600;margin:6px 0 10px}
#result .quip{font-family:'Patrick Hand',cursive;font-size:19px;margin-bottom:14px;color:#5b6a2e}
#rotate{position:fixed;inset:0;z-index:9;display:none;align-items:center;justify-content:center;flex-direction:column;gap:12px;background:#0d3f52;color:var(--paper);font-size:22px;text-align:center;padding:20px}
#rotate .ph{width:46px;height:80px;border:4px solid var(--paper);border-radius:10px;animation:rot 2s infinite}
@keyframes rot{0%,30%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="hud">
  <div id="stats" class="pill">
    <span>Stamina</span><div class="bar" id="stBar"><i></i></div><span id="stTxt">2/5</span>
    <span id="greenTxt" class="res">💚 0</span><span id="tailTxt" class="res">〰 0</span><span id="rumTxt" class="res">🥃 0</span>
  </div>
  <div id="tideBox" class="pill"><span id="tideLbl">Low tide</span><div class="bar" id="tideBar"><i></i></div></div>
  <div id="topRight" class="pill"><span id="dayLbl">Day 1</span><button id="mute" aria-label="Sound">🔊</button></div>
  <button id="ledgerBtn" class="hbtn">Ledger</button>
  <button id="waitBtn" class="hbtn">Wait for the tide ⏭</button>
  <button id="sBtn" aria-label="Throw stamp"><div class="face"><i></i><span id="sTxt">S · Throw</span></div></button>
  <button id="wBtn" aria-label="VOID"><i></i><span id="wTxt">W · VOID</span></button>
</div>
<div id="bubble"><div class="who">Tortoise</div><div id="bubbleTxt"></div></div>
<div id="banner"></div>
<div id="panel"><div class="card">
  <h2>The Ledger</h2>
  <div class="sub">Every expense, accounted for.</div>
  <div id="upgList"></div>
  <button class="btn" id="closePanel">Close</button>
</div></div>
<div id="result"><div class="card">
  <h2 id="resTitle">Overwhelmed</h2>
  <div class="rs" id="resStats"></div>
  <div class="quip" id="resQuip"></div>
  <button class="btn" id="resBtn">Wake up</button>
</div></div>
<div id="overlay"><h1>Robinson</h1><p>v004 · tap to begin</p></div>
<div id="rotate"><div class="ph"></div><div>Turn your phone sideways</div></div>

<script>
'use strict';
// =====================================================================
// GAME DATA — all tunable numbers live here (top of script: TDZ-safe)
// distances are in U (1% of screen height), times in seconds
// =====================================================================
const STATS = {
  crusoe: { dmg: 1, atkInt: 1.5, range: 11, splashEvery: 3, splashR: 12, wade: 22, walk: 26, crawl: 7, reach: 40 },
  boomerang: { range: 32, speed: 80, cd: 5, push: 6, dmgMult: 1 },
  void: { dash: 22, mult: 3, cd: 25, window: 2, seekR: 22, seekRStep: 6 },
  cat: { dashTime: .12, backTime: .3, rest: .45 },
  ebb: { tideFirst: 6, tide: 8, palmStart: 3, poolSips: 3, crabsFirst: 3, crabs: 2 },
  tortoise: { barMax: 3 }
};
// monster types; drops: number = guaranteed amount, fraction = chance of one
const MONSTERS = {
  tadpole: { name: 'tadpole', hp: 2, dmg: 1, atkInt: 1.5, speed: 16, size: .8, drops: { green: 1 } },
  clam:    { name: 'clam',    hp: 5, dmg: 1, atkInt: 1.5, speed: 11, size: .9, drops: { green: 2 }, pearl: true },
  rat:     { name: 'rat',     hp: 8, dmg: 2, atkInt: 1.2, speed: 30, size: .85, drops: { green: 2, tails: .5, rum: .3 } }
};
// wave composition per flood; floods beyond the table repeat the last entry, scaled up
const WAVES = [
  null,
  { tadpole: 8 },
  { tadpole: 10 },
  { tadpole: 8, clam: 3 },
  { tadpole: 8, clam: 5 },
  { tadpole: 6, clam: 5, rat: 2 },
  { tadpole: 6, clam: 6, rat: 4 }
];
const WAVE_TUNING = { spawnBase: 1.7, spawnPerFlood: .06, spawnMin: .7, hpPerFlood: .08, extraRatsBeyond: 2 };
// upgrades: cur = currency, max = level cap, req = prerequisite check
const UPGRADES = [
  { id: 'dmg', grp: 'Stamp', name: 'Heavier Stamp', desc: '+1 damage per stamp.', cur: 'green', base: 5, mult: 1.6 },
  { id: 'speed', grp: 'Stamp', name: 'Faster Stamping', desc: 'Stamp more often.', cur: 'green', base: 4, mult: 1.6 },
  { id: 'splash', grp: 'Stamp', name: 'Wider Splash', desc: 'Every third stamp splashes ink further.', cur: 'green', base: 5, mult: 1.6 },
  { id: 'boom', grp: 'Abilities', name: 'Stamp Boomerang [S]', desc: 'Throw the stamp. It hits, flies on, and comes back to you.', cur: 'green', base: 6, mult: 1, max: 1 },
  { id: 'boomCd', grp: 'Abilities', name: 'Quick Catch', desc: 'Boomerang recharges faster.', cur: 'green', base: 8, mult: 1.7, max: 5, req: () => S.upg.boom > 0 },
  { id: 'void', grp: 'Abilities', name: 'VOID [W]', desc: 'Dash forward, triple damage. A kill lets you VOID again for 2 seconds.', cur: 'green', base: 20, mult: 1, max: 1 },
  { id: 'voidCd', grp: 'Abilities', name: 'VOID: Shorter Cooldown', desc: 'VOID comes back sooner.', cur: 'green', base: 14, mult: 1.7, max: 5, req: () => S.upg.void > 0 },
  { id: 'voidSeek', grp: 'Abilities', name: 'VOID: Seek', desc: 'The dash jumps to the nearest monster it can finish.', cur: 'green', base: 25, mult: 1, max: 1, req: () => S.upg.void > 0 },
  { id: 'voidR', grp: 'Abilities', name: 'VOID: Wider Seek', desc: 'Seek reaches further.', cur: 'green', base: 12, mult: 1.6, max: 6, req: () => S.upg.voidSeek > 0 },
  { id: 'courage', grp: 'Cat', name: 'Cat: Courage', desc: 'She pounces on monsters with this much health left. Paid in rat tails, naturally.', cur: 'tails', base: 2, mult: 1.7 },
  { id: 'teamwork', grp: 'Cat', name: 'Cat: Teamwork', desc: 'Her kills keep your VOID chain going.', cur: 'tails', base: 3, mult: 1, max: 1, req: () => S.upg.void > 0 && S.upg.courage > 0 }
];
const GROUND = 76;
const STAMP_SPOT = { fx: .66, fy: .55 };
const BEACH_TORT = { fx: .85, fy: .37 }, PEE_SPOT = { fx: .32, fy: .62 };
const OPEN_NUT = { fx: .43, fy: .62 };
const SWIM = { stamina: 4, hits1: [1.3, 3.5, 5.7], kittenAt: 6.6, hope: 3, hits2: [9.6, 11.8, 14.0] };
const LINES = {
  wake: ["Ah. You're awake. The cat was worried. I wasn't.",
         "That coconut won't last. The palm has more. Follow the cat."],
  nut: ["Coconut water. Better than seawater. Worse than rum."],
  crab: ["Water keeps you going. Food makes you tougher. The cat suggests crab. The crab disagrees."],
  walk: ["Too far. Hold the edge of the screen to walk. Or A and D, if you're civilised."],
  dig: ["The cat's digging. Cats don't dig for nothing."],
  digAgain: ["The cat still thinks something's buried over there. I'd listen to the cat."],
  stamp: ["A rubber stamp. 'NO TAX'. In bright green.", "…Who exactly ARE you?",
          "Never mind. See the water creeping back? Everything you do, the sea takes a step closer. And things come with the high tide."],
  noStamp: ["Up the palm. Now. Don't argue."],
  afterCut: ["Things. From the sea. Green ones. They'll be back with every high tide.", "Find whatever the cat was digging for. Quickly."],
  firstFight: ["You'll stamp on your own. Hold either edge of the screen to wade left or right."],
  catWatch: ["The cat is watching. Taking notes, I expect."],
  firstKill: ["Did you see that? Neither did the monster."],
  green: ["Green blood. Your stamp seems to like it. Open your Ledger."],
  clam: ["Clams. Shiny ones. Don't get attached, the pearls sink."],
  rat: ["Now THOSE are rats. Big ones. With opinions."],
  boom: ["Throw it with S. Or tap the bottom of the screen. It comes back. Usually."],
  void: ["W. Or the button up there. Finish one off and you can go again. Don't get greedy."],
  rum: ["Oh. Oh my. That's the good stuff.", "Hic. You're… hic… not as dull as you look."],
  tip: ["Hic. Listen. LISTEN. Up past the palms. Fresh water. Go up. UP!", "…zzz"],
  wakeUp: ["Ugh. My head. Don't speak. Especially don't stamp."],
  thicket: ["Too thick up there. For now."],
  win: "Well. That was unexpected. Even for me.",
  lose: ["Again? Remarkable consistency.", "The monsters send their regards.", "Eat more crab. Become more crab.",
         "You fought bravely. Briefly, but bravely.", "Tadpoles. You lost to tadpoles. I'll remember this."],
  idle: ["I've been on this rock for a hundred and forty years. You're new.", "The cat likes you. I'm reserving judgement.",
         "Coconuts don't grow faster if you stare at them.", "Mind the tide. It minds you.", "If you happen across any rum… I'm just saying."],
  noRum: ["No rum? Then why are you poking me?"]
};

// ================= DOM =================
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
const $ = id => document.getElementById(id);
const el = {
  stBar: $('stBar').firstElementChild, stTxt: $('stTxt'), green: $('greenTxt'), tails: $('tailTxt'), rum: $('rumTxt'),
  tideBox: $('tideBox'), tideLbl: $('tideLbl'), tideBar: $('tideBar').firstElementChild, day: $('dayLbl'), mute: $('mute'),
  ledgerBtn: $('ledgerBtn'), waitBtn: $('waitBtn'), panel: $('panel'), upgList: $('upgList'), closePanel: $('closePanel'),
  sBtn: $('sBtn'), sFill: $('sBtn').querySelector('i'), sTxt: $('sTxt'), wBtn: $('wBtn'), wFill: $('wBtn').querySelector('i'), wTxt: $('wTxt'),
  bubble: $('bubble'), bubbleTxt: $('bubbleTxt'), banner: $('banner'), overlay: $('overlay'), result: $('result'),
  resTitle: $('resTitle'), resStats: $('resStats'), resQuip: $('resQuip'), resBtn: $('resBtn'), rotate: $('rotate')
};

let W = 0, H = 0, U = 1, DPR = 1;
const S = {
  screen: 'start', stamina: 0, maxStamina: 5, green: 0, tails: 0, rum: 0, hasStamp: false,
  tide: STATS.ebb.tideFirst, tideMax: STATS.ebb.tideFirst, flood: 1, day: 1,
  palmMax: STATS.ebb.palmStart, palmPending: 0, palmNuts: STATS.ebb.palmStart,
  crabs: [], tut: 0, busy: false, cut: null, wl: 0, fade: 0, floats: [], parts: [], hint: null, time: 0,
  wake: null, openNut: null, swim: null,
  firstKill: false, firstGreen: false, toldWalk: false, combats: 0, losses: 0, raided: false,
  seen: {}, forestOpen: false, poolSips: STATS.ebb.poolSips,
  upg: {}, tort: { bar: 0, sleep: 0, walk: null, fx: BEACH_TORT.fx, fy: BEACH_TORT.fy },
  cr: { fx: .5, ph: 0, face: -1 },
  kt: { fx: .44, fy: .58, tfx: .44, tfy: .58, ph: 0, face: 1, dig: 0 },
  keys: {}, pointers: new Map()
};
UPGRADES.forEach(u => S.upg[u.id] = 0);
let C = null; // combat state

// ================= utils =================
function rand(a, b) { return a + Math.random() * (b - a); }
function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
function lerp(a, b, t) { return a + (b - a) * t; }
function dist(ax, ay, bx, by) { return Math.hypot(ax - bx, ay - by); }
function WU() { return W / U; }
function easeOut(t) { return 1 - (1 - t) * (1 - t); }
function inCollect() { return S.screen === 'beach' || S.screen === 'forest'; }
function crFy() { return S.screen === 'forest' ? .72 : .56; }
// derived stats
function stampDmg() { return STATS.crusoe.dmg + S.upg.dmg; }
function atkInt() { return STATS.crusoe.atkInt * Math.pow(.88, S.upg.speed); }
function splashR() { return STATS.crusoe.splashR + 4 * S.upg.splash; }
function catThreshold() { return S.upg.courage; }              // 0 = she only watches
function boomCd() { return STATS.boomerang.cd * Math.pow(.85, S.upg.boomCd); }
function voidCd() { return STATS.void.cd * Math.pow(.85, S.upg.voidCd); }
function voidDmg() { return stampDmg() * STATS.void.mult; }
function voidSeekR() { return STATS.void.seekR + STATS.void.seekRStep * S.upg.voidR; }
function upgCost(u) { return Math.round(u.base * Math.pow(u.mult, S.upg[u.id])); }
function upgMaxed(u) { return u.max !== undefined && S.upg[u.id] >= u.max; }
function tortAsleep() { return S.tort.sleep > 0; }

// ================= audio (Web Audio, all synthesized) =================
const AU = { ctx: null, master: null, muted: false, surf: null, noise: null };
function audioInit() {
  if (AU.ctx) return;
  try {
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    const a = AU.ctx = new AC();
    AU.master = a.createGain(); AU.master.gain.value = .8; AU.master.connect(a.destination);
    const len = a.sampleRate * 4, buf = a.createBuffer(1, len, a.sampleRate), d = buf.getChannelData(0);
    let last = 0;
    for (let i = 0; i < len; i++) { const w = Math.random() * 2 - 1; last = (last + .02 * w) / 1.02; d[i] = last * 3.5; }
    AU.noise = buf;
    const src = a.createBufferSource(); src.buffer = buf; src.loop = true;
    const lp = a.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 650;
    const g = a.createGain(); g.gain.value = .2;
    src.connect(lp); lp.connect(g); g.connect(AU.master); src.start();
    const lfo = a.createOscillator(); lfo.frequency.value = .11; const lg = a.createGain(); lg.gain.value = .13;
    lfo.connect(lg); lg.connect(g.gain); lfo.start();
    AU.surf = g;
    const wb = a.createBuffer(1, len, a.sampleRate), wd = wb.getChannelData(0);
    for (let i = 0; i < len; i++) wd[i] = Math.random() * 2 - 1;
    const ws = a.createBufferSource(); ws.buffer = wb; ws.loop = true;
    const bp = a.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 900; bp.Q.value = .6;
    const wg = a.createGain(); wg.gain.value = .025;
    ws.connect(bp); bp.connect(wg); wg.connect(AU.master); ws.start();
    const wl = a.createOscillator(); wl.frequency.value = .05; const wlg = a.createGain(); wlg.gain.value = 400;
    wl.connect(wlg); wlg.connect(bp.frequency); wl.start();
  } catch (e) { AU.ctx = null; }
}
function tone(f0, f1, dur, type, vol, delay) {
  if (!AU.ctx || AU.muted) return;
  const a = AU.ctx, t = a.currentTime + (delay || 0);
  const o = a.createOscillator(), g = a.createGain();
  o.type = type || 'sine'; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + .008); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(AU.master); o.start(t); o.stop(t + dur + .05);
}
function noiseBurst(dur, ftype, freq, vol, delay) {
  if (!AU.ctx || AU.muted || !AU.noise) return;
  const a = AU.ctx, t = a.currentTime + (delay || 0);
  const s = a.createBufferSource(); s.buffer = AU.noise;

// ================= tortoise & rum =================

  say(S.tort.bar >= STATS.tortoise.barMax ? ["Hic."] : [LINES.rum[Math.min(S.tort.bar - 1, LINES.rum.length - 1)]]);

function updateTortoise(dt) {

    if (Math.random() < .5) S.parts.push({ x: (PEE_SPOT.fx - .025) * W, y: PEE_SPOT.fy * H - 1 * U, vx: rand(-14, -8) * U, vy: rand(-6, -2) * U, life: .35, t: 0, col: '#f3e27a', r: .35 });
  } else if (t < go + pee + back) {

    const q = easeOut((t - go - pee) / back); S.tort.fx = lerp(PEE_SPOT.fx, BEACH_TORT.fx, q); S.tort.fy = lerp(PEE_SPOT.fy, BEACH_TORT.fy, q);
  } else {

    if (S.tort.bar >= STATS.tortoise.barMax) {
      say(LINES.tip, true); S.forestOpen = true; S.tort.sleep = 2;

    }

}

  }

}

  c.marks.forEach(m => {
    const life = m.big ? 1 : .7, a = 1 - m.t / life, sc = (m.big ? 1.9 + .35 * ((m.n || 1) - 1) : 1) * (1 + (1 - a) * .3);
    ctx.save(); ctx.translate(m.x * U, gy - (m.big ? 16 : 12) * U - m.t * 4 * U); ctx.rotate(-.12); ctx.scale(sc, sc);
    ctx.globalAlpha = a; ctx.strokeStyle = '#39e639'; ctx.lineWidth = 2; ctx.strokeRect(-6 * U, -2.2 * U, 12 * U, 4.4 * U);
    ctx.fillStyle = '#39e639'; ctx.font = '600 ' + (3 * U) + 'px Fredoka, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(m.big ? 'VOID' : 'NOTAX', 0, .2 * U); ctx.restore(); ctx.textBaseline = 'alphabetic';
  });
  const watching = catThreshold() === 0 && kt.st === 'idle';
  drawKitten(kt.x * U, gy, 6.5 * U, { face: kt.face, ph: S.time * 3, dash: kt.st === 'dash', scared: kt.st === 'flee' || (kt.st === 'idle' && !watching), sit: watching });
  const wtop = x => gy - 1.5 * U + Math.sin(x * .03 + t * 2.2) * .4 * U;
  ctx.fillStyle = 'rgba(60,170,185,.5)';
  ctx.beginPath(); ctx.moveTo(wx - 3 * U, H + 10);
  for (let x = wx - 3 * U; x <= W + 10; x += 8) ctx.lineTo(x, x < wx ? lerp(gy + .5 * U, wtop(x), (x - wx + 3 * U) / (3 * U)) : wtop(x));
  ctx.lineTo(W + 10, H + 10); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,.75)'; ctx.lineWidth = 2;
  ctx.beginPath(); for (let x = wx; x <= W + 10; x += 8) { const y = wtop(x); x === wx ? ctx.moveTo(x, y) : ctx.lineTo(x, y); } ctx.stroke();
  drawVoidUI(t);
  drawEdgeHints(moveDir());
  ctx.restore();
  drawUltSlam();
}
function drawVoidUI(t) {
  const c = C, cr = c.cr, gy = GROUND * U;
  // chain window ring around Crusoe
  if (c.voidWin > 0) {
    const q = c.voidWin / STATS.void.window, cx = cr.x * U, cy = gy - 12 * U;
    ctx.strokeStyle = 'rgba(57,230,57,.25)'; ctx.lineWidth = 1.2 * U;
    ctx.beginPath(); ctx.arc(cx, cy, 15 * U, 0, Math.PI * 2); ctx.stroke();
    ctx.strokeStyle = '#39e639'; ctx.lineWidth = 1.2 * U; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.arc(cx, cy, 15 * U, -Math.PI / 2, -Math.PI / 2 + q * Math.PI * 2); ctx.stroke();
  }
  // marker on the monster VOID would hit right now
  if (voidReady()) {
    const vt = voidTarget();
    if (vt) {
      const m = vt.m, p = (Math.sin(t * 9) + 1) / 2, col = vt.kill ? '57,230,57' : '255,246,227';
      const s = m.def.size, mx = m.x * U, my = gy - 3 * U * s;
      ctx.strokeStyle = 'rgba(' + col + ',' + (.6 + .35 * p) + ')'; ctx.lineWidth = 2 + p;
      ctx.beginPath(); ctx.ellipse(mx, my, (7 + p) * U * s, (5 + p * .6) * U * s, 0, 0, Math.PI * 2); ctx.stroke();
      ctx.fillStyle = 'rgba(' + col + ',.9)';
      ctx.beginPath(); ctx.moveTo(mx, my - 8 * U * s); ctx.lineTo(mx - 1.4 * U, my - 10.5 * U * s); ctx.lineTo(mx + 1.4 * U, my - 10.5 * U * s); ctx.fill();
    }
  }
}
function drawUltSlam() {
  const u = C.ult; if (!u) return;
  const t = u.t;
  // desaturate & darken the world, then slam a giant green VOID stamp across it
  const dim = t < .2 ? 1 : Math.max(0, 1 - (t - .2) / .5);
  if (dim > 0) {
    ctx.save(); ctx.globalCompositeOperation = 'saturation'; ctx.globalAlpha = dim; ctx.fillStyle = '#808080'; ctx.fillRect(0, 0, W, H); ctx.restore();
    ctx.fillStyle = 'rgba(5,10,15,' + (.45 * dim) + ')'; ctx.fillRect(0, 0, W, H);
  }
  const inT = Math.min(1, t / .12), sc = lerp(2.6, 1, easeOut(inT)) * (1 + .12 * (u.n - 1)), a = t < .5 ? 1 : Math.max(0, 1 - (t - .5) / .4);
  ctx.save(); ctx.translate(W / 2, 46 * U); ctx.rotate(-.1); ctx.scale(sc, sc); ctx.globalAlpha = a;
  ctx.strokeStyle = '#39e639'; ctx.lineWidth = 1.4 * U; ctx.strokeRect(-26 * U, -9 * U, 52 * U, 18 * U);
  ctx.lineWidth = .5 * U; ctx.strokeRect(-24 * U, -7 * U, 48 * U, 14 * U);
  ctx.fillStyle = '#39e639'; ctx.font = '600 ' + (14 * U) + 'px Fredoka, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(u.n > 1 ? 'VOID ×' + u.n : 'VOID', 0, .6 * U);
  ctx.restore(); ctx.textBaseline = 'alphabetic';
}
function drawEdgeHints(d) {
  ctx.fillStyle = 'rgba(255,246,227,' + (d < 0 ? .12 : .035) + ')'; ctx.fillRect(0, 0, W / 3, H);
  ctx.fillStyle = 'rgba(255,246,227,' + (d > 0 ? .12 : .035) + ')'; ctx.fillRect(W * 2 / 3, 0, W / 3, H);
  ctx.font = '600 ' + (7 * U) + 'px Fredoka, sans-serif'; ctx.textAlign = 'center';
  ctx.fillStyle = 'rgba(255,246,227,' + (d < 0 ? .7 : .3) + ')'; ctx.fillText('‹', 4 * U, 62 * U);
  ctx.fillStyle = 'rgba(255,246,227,' + (d > 0 ? .7 : .3) + ')'; ctx.fillText('›', W - 4 * U, 62 * U);
}

// ================= floats & particles =================
function drawFX(dt) {
  S.parts.forEach(p => { p.t += dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 90 * U * dt; ctx.globalAlpha = Math.max(0, 1 - p.t / p.life); ell(p.x, p.y, (p.r || .6) * U, (p.r || .6) * U, p.col); });
  ctx.globalAlpha = 1;
  if (C && S.screen === 'combat') {
    S.parts.forEach(p => { if (p.col === '#39e639' && p.t >= p.life && p.y > (GROUND - 2) * U && C.stains.length < 60) C.stains.push([p.x / U, rand(.6, 1.6), rand(0, 2)]); });
  }
  S.parts = S.parts.filter(p => p.t < p.life);
  ctx.textAlign = 'center'; ctx.font = '600 ' + Math.max(14, 3.4 * U) + 'px Fredoka, sans-serif'; ctx.lineJoin = 'round';
  S.floats.forEach(f => {
    f.t += dt; const a = Math.max(0, 1 - f.t / f.life), y = f.y - f.t * 6 * U;
    ctx.globalAlpha = a; ctx.strokeStyle = 'rgba(59,42,26,.75)'; ctx.lineWidth = 4; ctx.strokeText(f.txt, f.x, y); ctx.fillStyle = f.col; ctx.fillText(f.txt, f.x, y);
  });
  ctx.globalAlpha = 1; S.floats = S.floats.filter(f => f.t < f.life);
}

// ================= collect movement =================
function collectWalkDir() {
  let d = 0;
  if (S.keys.a || S.keys.arrowleft) d -= 1;
  if (S.keys.d || S.keys.arrowright) d += 1;
  for (const p of S.pointers.values()) { if (p.walk) { if (p.x < W / 3) d -= 1; else if (p.x > W * 2 / 3) d += 1; } }
  return clamp(d, -1, 1);
}
function updateCollect(dt) {
  if (S.screen === 'beach') {
    if (S.cut) updateCutscene(dt); else S.wl += (waterTarget() - S.wl) * Math.min(1, dt * 2.5);
    updateTortoise(dt);
    if (S.wake) updateWake(dt);
  }
  if (S.screen !== 'beach' && S.screen !== 'forest') return;
  const crawling = S.wake && S.wake.phase === 'dark', standingUp = S.wake && S.wake.phase === 'open';
  if (!S.busy && !standingUp && el.panel.style.display !== 'flex') {
    const d = collectWalkDir();
    const sp = crawling ? STATS.crusoe.crawl : STATS.crusoe.walk;
    if (d) { S.cr.fx = clamp(S.cr.fx + d * sp * U * dt / W, .06, .94); S.cr.face = d; S.cr.ph += dt * (crawling ? 4 : 10); }
  }
  const k = S.kt;
  if (S.wake) { k.tfx = OPEN_NUT.fx - .035; k.tfy = OPEN_NUT.fy + .01; }
  else if (!S.hint || S.screen === 'forest') { k.tfx = S.cr.fx - .06 * S.cr.face; k.tfy = crFy() + .02; }
  const dx = k.tfx - k.fx, dy = k.tfy - k.fy, dd = Math.hypot(dx, dy), sp = (S.wake ? .12 : .32) * dt;
  if (dd > .004) { const m = Math.min(1, sp / dd); k.fx += dx * m; k.fy += dy * m; k.ph += dt * 10; if (Math.abs(dx) > .002) k.face = dx > 0 ? 1 : -1; k.dig = 0; }
  else if (S.wake) { k.face = S.cr.fx > k.fx ? 1 : -1; }
  else if (S.hint && S.hint.type === 'stamp') {
    k.face = 1; k.dig += dt; k.ph += dt * 3;
    if (Math.random() < dt * 6) S.parts.push({ x: k.fx * W + 3 * U, y: k.fy * H - .5 * U, vx: rand(-14, -4) * U, vy: rand(-12, -5) * U, life: .4, t: 0, col: '#d9b47a', r: .4 });
  }
}

// ================= main loop =================
let lastT = 0;
function frame(ms) {
  const now = ms / 1000, dt = Math.min(.05, lastT ? now - lastT : .016); lastT = now;
  S.time += dt;
  if (BQ.on) { BQ.t -= dt; if (BQ.t <= 0) nextLine(); }
  if (S.screen === 'swim' && S.swim) { updateSwim(dt); if (S.swim) drawSwim(S.time); }
  if (inCollect()) updateCollect(dt);
  if (S.screen === 'beach') drawBeach(S.time);
  else if (S.screen === 'forest') drawForest(S.time);
  else if (S.screen === 'combat' && C) { updateCombat(dt); drawCombat(S.time); }
  else if (S.screen === 'start') { ctx.fillStyle = '#0d3f52'; ctx.fillRect(0, 0, W, H); }
  drawFX(dt);
  if (S.fade > 0) { S.fade = Math.max(0, S.fade - dt * (S.wake ? 1 : 2.5)); ctx.fillStyle = 'rgba(0,0,0,' + S.fade + ')'; ctx.fillRect(0, 0, W, H); }
  if (BQ.on) placeBubble();
  requestAnimationFrame(frame);
}

// ================= input =================
cv.addEventListener('pointerdown', e => {
  e.preventDefault();
  const x = e.clientX, y = e.clientY;
  if (S.screen === 'beach' || S.screen === 'forest') {
    const hit = S.screen === 'beach' ? onBeachTap(x, y) : onForestTap(x, y);
    if (hit || S.busy) return;
    if (!S.wake) {
      if (S.screen === 'beach' && y < .24 * H) { goForest(); return; }
      if (S.screen === 'forest' && y > .84 * H) { goBeach(); return; }
    }
    if (x < W / 3 || x > W * 2 / 3) { S.pointers.set(e.pointerId, { x, walk: true }); try { cv.setPointerCapture(e.pointerId); } catch (_) {} }
  } else if (S.screen === 'combat' || S.screen === 'swim') { S.pointers.set(e.pointerId, { x }); try { cv.setPointerCapture(e.pointerId); } catch (_) {} }
});
cv.addEventListener('pointermove', e => { const p = S.pointers.get(e.pointerId); if (p) p.x = e.clientX; });
['pointerup', 'pointercancel', 'lostpointercapture'].forEach(n => cv.addEventListener(n, e => S.pointers.delete(e.pointerId)));
el.sBtn.addEventListener('pointerdown', e => { e.preventDefault(); e.stopPropagation(); throwBoom(); });
el.wBtn.addEventListener('pointerdown', e => { e.preventDefault(); e.stopPropagation(); castVoid(); });
window.addEventListener('keydown', e => {
  const k = e.key.toLowerCase(); S.keys[k] = true;
  if (e.repeat || el.panel.style.display === 'flex') return;
  if (S.screen === 'combat') {
    if (k === 's' || k === 'arrowdown') throwBoom();
    if (k === 'w' || k === 'arrowup') castVoid();
    return;
  }
  if ((k === 'w' || k === 'arrowup') && S.screen === 'beach') goForest();
  if ((k === 's' || k === 'arrowdown') && S.screen === 'forest') goBeach();
});
window.addEventListener('keyup', e => { S.keys[e.key.toLowerCase()] = false; });
window.addEventListener('blur', () => { S.keys = {}; S.pointers.clear(); });
document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('visibilitychange', () => { if (!AU.ctx) return; document.hidden ? AU.ctx.suspend() : AU.ctx.resume(); });
el.mute.addEventListener('click', () => {
  AU.muted = !AU.muted; el.mute.textContent = AU.muted ? '🔇' : '🔊';
  if (AU.master && AU.ctx) AU.master.gain.setTargetAtTime(AU.muted ? 0 : .8, AU.ctx.currentTime, .05);
});
el.waitBtn.addEventListener('click', () => { if (!inCollect() || S.busy || S.wake) return; S.tide = 1; spendTide(); });
el.overlay.addEventListener('click', () => {
  if (S.screen !== 'start') return;
  audioInit(); if (AU.ctx && AU.ctx.state === 'suspended') AU.ctx.resume();
  el.overlay.style.opacity = 0; setTimeout(() => el.overlay.remove(), 650);
  startSwim();
});

// ================= resize / init =================
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight; U = H / 100;
  cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  el.rotate.style.display = H > W ? 'flex' : 'none';
  if (S.screen === 'beach' && !S.cut) S.wl = waterTarget();
  placeBubble();
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 200));
resize();
updateHUD();
requestAnimationFrame(frame);
</script>
</body>
